name: Deploy Invites to Firebase
on:
  push:
    branches: [ main ]
    paths:
      - 'invites/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - '.github/workflows/firebase-deploy.yml'
      # Deliberately NOT functions/** - Cloud Functions are deployed by
      # hand, see the deploy step below.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"
      # Cloud Functions are deliberately excluded here and deployed by hand:
      #   npx firebase-tools deploy --only functions --project events-45ce5
      #
      # A 2nd-gen functions deploy needs iam.serviceAccountUser,
      # artifactregistry.writer, run.admin, cloudbuild.builds.editor,
      # eventarc.developer and secretmanager.secretAccessor on top of what
      # this service account has. Granting all that to a key stored in a
      # GitHub secret - the power to push container images, administer Cloud
      # Run and impersonate other service accounts - is a poor trade for a
      # function that changes a few times a year. Keeping functions out also
      # means a functions problem can never block a hosting or rules deploy,
      # which is exactly what happened when they shared one --only list.
      - name: Deploy hosting + Firestore + Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase-tools deploy --only hosting,firestore,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

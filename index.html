<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadnyesh Joshi - Personal Site</title>
    <link rel="stylesheet" href="/style.css?v=2">
    <script>/* Apply the saved theme before first paint, so a dark-theme visitor never gets a flash of white. "system" stores nothing and lets the CSS media query decide. */(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="intro">
            <h2>Welcome</h2>
            <p>This is my personal space on the web where I share thoughts and photos.</p>
        </section>

        <section class="recent-posts">
            <h3>Recent Posts</h3>
            <article class="post-preview">
                <h4><a href="/music/first-post.html">My First Post</a></h4>
                <time datetime="2024-02-11">February 11, 2024</time>
                <p>A brief introduction to this blog and what I plan to write about...</p>
            </article>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="/inc/include.js?v=2"></script>
</body>
</html>

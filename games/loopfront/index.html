<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Loopfront - Yadnyesh Joshi</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Reset & Layout ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #1b2030; color: #c8d0e0; font-family: system-ui, sans-serif; }

    #game-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - var(--header-height, 0px) - var(--footer-height, 0px));
      min-height: 300px;
    }

    /* ── HUD bar ──────────────────────────────────────────────────────── */
    #hud {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 48px;
      padding: 0 16px;
      background: #27364f;
      flex-shrink: 0;
      font-size: 13px;
      user-select: none;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; }
    .hud-label { font-size: 10px; color: #7a8fa8; text-transform: uppercase; letter-spacing: .05em; }
    .hud-value { font-size: 15px; font-weight: 600; color: #c8d0e0; min-width: 36px; text-align: center; }
    #hud-buttons { margin-left: auto; display: flex; gap: 8px; }
    .hud-btn {
      background: #2f4260; border: 1px solid #3d5478; color: #c8d0e0;
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .hud-btn:hover { background: #3a5278; }
    .hud-btn:disabled { opacity: .55; cursor: default; }

    /* ── Canvas area ──────────────────────────────────────────────────── */
    #canvas-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #1b2030;
    }
    #game { display: block; width: 100%; height: 100%; }

    /* ── Minimap ──────────────────────────────────────────────────────── */
    #minimap {
      position: absolute;
      bottom: 12px;
      right: 12px;
      border: 1px solid #3d5478;
      border-radius: 3px;
      background: rgba(27,32,48,0.85);
    }

    /* ── Overlay ──────────────────────────────────────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(12,14,26,0.72);
      gap: 14px;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 32px; color: #e0d0b0; }
    #overlay p  { font-size: 15px; color: #9ab0c8; max-width: 340px; text-align: center; line-height: 1.5; }
    #overlay .stats-grid {
      display: grid; grid-template-columns: repeat(2, auto);
      gap: 4px 20px; font-size: 13px; color: #c8d0e0;
    }
    #overlay .stats-grid span.lbl { color: #7a8fa8; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div id="game-wrap">
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Territory</span>
        <span class="hud-value" id="hud-territory">0%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Players</span>
        <span class="hud-value" id="hud-players">4/4</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Tick</span>
        <span class="hud-value" id="hud-tick">0</span>
      </div>
      <div id="hud-buttons">
        <button class="hud-btn" id="btn-debug">Debug: Off</button>
        <button class="hud-btn" id="btn-export-log">Export Log</button>
        <button class="hud-btn" id="btn-stop">Pause</button>
        <button class="hud-btn" id="btn-difficulty">Diff: Normal</button>
        <button class="hud-btn" id="btn-restart">Restart</button>
        <button class="hud-btn" id="btn-expand">&#x26f6;</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game"></canvas>
      <canvas id="minimap"></canvas>

      <div id="overlay">
        <h2 id="overlay-title">Loopfront</h2>
        <p id="overlay-msg">Use arrow keys to steer. Claim territory by looping back to your region. Cut enemy tails to eliminate them.</p>
        <div class="stats-grid" id="overlay-stats" style="display:none"></div>
        <button class="hud-btn" id="overlay-btn" style="font-size:14px;padding:8px 24px;">Start</button>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="/inc/include.js"></script>

  <script>
  /* ===================================================================
     LOOPFRONT  —  Vanilla JS / HTML / CSS  —  Single file
     Sections:
       1.  Config
       2.  Direction system
       3.  State model & init
       4.  Input
       5.  Simulation core
       6.  Capture system (flood-fill)
       7.  Elimination & match end
       8.  Camera
       9.  Rendering
      10.  CPU logic
      11.  Game loop
      12.  Bootstrap
  =================================================================== */

  // ─────────────────────────────────────────────────────────────────
  // 1. CONFIG
  // ─────────────────────────────────────────────────────────────────
  const CONFIG = Object.freeze({
    MAP_CELLS:          800,   // logical grid: MAP_CELLS × MAP_CELLS
    CELL_SIZE:          2,     // world units per cell
    PLAYER_SPEED:       1.6,   // world units per tick
    PLAYER_RADIUS:      9,     // visual arrow bounding radius (world units)
    TAIL_WIDTH:         6,     // visual tail width (world units)
    TAIL_SAMPLE_DIST:   1.5,   // min world units between tail path samples
    TAIL_CAPTURE_RADIUS_CELLS: 1, // logical tail thickness for collisions/capture walls
    SEED_HALF:          40,    // half-size of corner seed territory (cells)
    CPU_COUNT:          3,
    TICK_MS:            30,    // simulation target tick interval (ms)
    allowSelfTailDeath: false,
    USER_TURN_STEP:     1,     // heading index steps per tick toward requested direction

    // Camera
    DEAD_ZONE_FRAC: 0.25,      // dead-zone fraction of viewport
    LOOK_AHEAD:     80,        // world units of look-ahead
    PAN_LERP:       0.08,

    // Minimap
    MINIMAP_PX: 140,

    // Palette: base color per player, fixed high-contrast accent for user
    PALETTE: [
      { base: '#5b9bd5', name: 'Blue'  },  // 0 — user
      { base: '#c0856a', name: 'Terra' },  // 1 — cpu 1
      { base: '#74b87e', name: 'Sage'  },  // 2 — cpu 2
      { base: '#a87ab4', name: 'Plum'  },  // 3 — cpu 3
    ],
    USER_ACCENT: '#ffffff',
    DEBUG_MAX_LOG_LINES: 120000,
    DEBUG_TICK_SNAPSHOT_INTERVAL: 10,
    DEBUG_SCALE_STEP_CELLS: 20,
  });

  const WORLD_SIZE = CONFIG.MAP_CELLS * CONFIG.CELL_SIZE;

  const DIFFICULTY_PRESETS = Object.freeze({
    rookie: Object.freeze({
      label: 'Rookie', thinkMin: 14, thinkMax: 28, turnStep: 1,
      jitterChance: 0.40, jitterSteps: 2,
      expandScale: 1.6, flankBias: 0.35, contestBias: 0.10,
      interceptChance: 0.05, interceptLeadTicks: 6,
      commitMin: 20, commitMax: 36, segmentMin: 8, segmentMax: 13,
      edgeBuffer: 44, threatReturnDist: 90,
      behindAggro: 1.08, aheadSafety: 0.94,
      segmentCount: 2, loopFlipChance: 0.02,
      denyUserChance: 0.00, denyUserRadius: 120,
    }),
    easy: Object.freeze({
      label: 'Easy', thinkMin: 10, thinkMax: 20, turnStep: 1,
      jitterChance: 0.30, jitterSteps: 2,
      expandScale: 1.9, flankBias: 0.45, contestBias: 0.18,
      interceptChance: 0.10, interceptLeadTicks: 8,
      commitMin: 28, commitMax: 48, segmentMin: 8, segmentMax: 14,
      edgeBuffer: 40, threatReturnDist: 80,
      behindAggro: 1.14, aheadSafety: 0.90,
      segmentCount: 2, loopFlipChance: 0.05,
      denyUserChance: 0.03, denyUserRadius: 170,
    }),
    normal: Object.freeze({
      label: 'Normal', thinkMin: 7, thinkMax: 14, turnStep: 1,
      jitterChance: 0.20, jitterSteps: 1,
      expandScale: 2.2, flankBias: 0.60, contestBias: 0.30,
      interceptChance: 0.22, interceptLeadTicks: 10,
      commitMin: 38, commitMax: 62, segmentMin: 9, segmentMax: 15,
      edgeBuffer: 34, threatReturnDist: 70,
      behindAggro: 1.22, aheadSafety: 0.85,
      segmentCount: 3, loopFlipChance: 0.10,
      denyUserChance: 0.10, denyUserRadius: 220,
    }),
    hard: Object.freeze({
      label: 'Hard', thinkMin: 4, thinkMax: 9, turnStep: 2,
      jitterChance: 0.10, jitterSteps: 1,
      expandScale: 2.6, flankBias: 0.80, contestBias: 0.48,
      interceptChance: 0.40, interceptLeadTicks: 12,
      commitMin: 52, commitMax: 84, segmentMin: 10, segmentMax: 16,
      edgeBuffer: 28, threatReturnDist: 60,
      behindAggro: 1.34, aheadSafety: 0.78,
      segmentCount: 4, loopFlipChance: 0.18,
      denyUserChance: 0.24, denyUserRadius: 280,
    }),
    nightmare: Object.freeze({
      label: 'Nightmare', thinkMin: 2, thinkMax: 6, turnStep: 2,
      jitterChance: 0.04, jitterSteps: 1,
      expandScale: 3.0, flankBias: 1.00, contestBias: 0.66,
      interceptChance: 0.62, interceptLeadTicks: 14,
      commitMin: 68, commitMax: 104, segmentMin: 10, segmentMax: 18,
      edgeBuffer: 22, threatReturnDist: 52,
      behindAggro: 1.48, aheadSafety: 0.72,
      segmentCount: 4, loopFlipChance: 0.28,
      denyUserChance: 0.42, denyUserRadius: 340,
    }),
  });
  const DIFFICULTY_KEYS = Object.keys(DIFFICULTY_PRESETS);
  let difficultyIndex = DIFFICULTY_KEYS.indexOf('normal');

  function currentDifficultyKey() {
    return DIFFICULTY_KEYS[difficultyIndex];
  }
  function currentDifficulty() {
    return DIFFICULTY_PRESETS[currentDifficultyKey()];
  }
  function updateDifficultyUI() {
    const btn = document.getElementById('btn-difficulty');
    if (btn) btn.textContent = `Diff: ${currentDifficulty().label}`;
  }
  function cycleDifficulty() {
    difficultyIndex = (difficultyIndex + 1) % DIFFICULTY_KEYS.length;
    updateDifficultyUI();
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // ─────────────────────────────────────────────────────────────────
  // Debug / Logging
  // ─────────────────────────────────────────────────────────────────
  function pad2(n) { return String(n).padStart(2, '0'); }
  function formatSessionTimestamp(d) {
    return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  }
  function nowIso() { return new Date().toISOString(); }

  const debugState = {
    enabled: false,
    sessionId: null,
    startedAtIso: null,
    logs: [],
    seq: 0,
  };

  function safeJson(value) {
    try { return JSON.stringify(value); }
    catch (_) { return '"[unserializable]"'; }
  }

  function debugLog(type, message, data) {
    if (!debugState.enabled) return;
    const tick = G ? G.tick : -1;
    const line = `${nowIso()} | seq=${debugState.seq++} | tick=${tick} | ${type} | ${message}` +
      (data === undefined ? '' : ` | data=${safeJson(data)}`);
    const hadNoLogs = debugState.logs.length === 0;
    debugState.logs.push(line);
    if (debugState.logs.length > CONFIG.DEBUG_MAX_LOG_LINES) {
      debugState.logs.splice(0, debugState.logs.length - CONFIG.DEBUG_MAX_LOG_LINES);
    }
    if (hadNoLogs) updateDebugUI();
  }

  function readInitialDebugEnabled() {
    const p = new URLSearchParams(window.location.search);
    if (p.has('debug')) return p.get('debug') === '1';
    const s = localStorage.getItem('loopfront.debug.enabled');
    return s === '1';
  }

  function updateDebugUI() {
    const dbgBtn = document.getElementById('btn-debug');
    const expBtn = document.getElementById('btn-export-log');
    if (dbgBtn) dbgBtn.textContent = `Debug: ${debugState.enabled ? 'On' : 'Off'}`;
    if (expBtn) expBtn.disabled = !debugState.enabled || debugState.logs.length === 0;
  }

  function setDebugEnabled(enabled) {
    debugState.enabled = !!enabled;
    localStorage.setItem('loopfront.debug.enabled', debugState.enabled ? '1' : '0');
    updateDebugUI();
    if (debugState.enabled) debugLog('DEBUG', 'debug mode enabled');
    if (G) render();
  }

  function beginDebugSession() {
    if (!debugState.enabled) return;
    const d = new Date();
    debugState.sessionId = formatSessionTimestamp(d);
    debugState.startedAtIso = d.toISOString();
    debugState.logs = [];
    debugState.seq = 0;
    debugLog('SESSION', 'game started', {
      sessionId: debugState.sessionId,
      difficulty: currentDifficultyKey(),
      worldSize: WORLD_SIZE,
      mapCells: CONFIG.MAP_CELLS,
      cellSize: CONFIG.CELL_SIZE,
      tailWidth: CONFIG.TAIL_WIDTH,
      tailCaptureRadiusCells: CONFIG.TAIL_CAPTURE_RADIUS_CELLS,
      playerRadius: CONFIG.PLAYER_RADIUS,
    });
    updateDebugUI();
  }

  function exportDebugLog() {
    if (!debugState.enabled || debugState.logs.length === 0) return;
    const sid = debugState.sessionId || formatSessionTimestamp(new Date());
    const fileName = `loopfront-debug-${sid}.log`;
    const header = [
      `session_id=${sid}`,
      `started_at=${debugState.startedAtIso || 'unknown'}`,
      `exported_at=${new Date().toISOString()}`,
      `difficulty=${currentDifficultyKey()}`,
      `map_cells=${CONFIG.MAP_CELLS}`,
      `cell_size=${CONFIG.CELL_SIZE}`,
      '',
    ].join('\n');
    const blob = new Blob([header, debugState.logs.join('\n'), '\n'], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ─────────────────────────────────────────────────────────────────
  // 2. DIRECTION SYSTEM  (16-way)
  // ─────────────────────────────────────────────────────────────────
  // Index 0 = East (right on screen), increasing clockwise in screen coords.
  // angle = index * (2π/16);  x = cos(angle),  y = sin(angle)
  const DIRECTIONS = Object.freeze(
    Array.from({ length: 16 }, (_, i) => {
      const a = i * (2 * Math.PI / 16);
      return Object.freeze({ dx: Math.cos(a), dy: Math.sin(a) });
    })
  );

  /** Map angle (radians, 0=right, +clockwise in screen space) → heading index [0..15] */
  function angleToHeadingIndex(angle) {
    const norm = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    return Math.round(norm / (2 * Math.PI) * 16) % 16;
  }

  /** True if b is the exact opposite of a (offset of 8) */
  function isOppositeHeading(a, b) {
    return ((a - b + 16) % 16) === 8;
  }

  // ─────────────────────────────────────────────────────────────────
  // 3. STATE MODEL & INIT
  // ─────────────────────────────────────────────────────────────────
  let G = null;

  function cellXY(wx, wy) {
    return {
      cx: Math.floor(wx / CONFIG.CELL_SIZE),
      cy: Math.floor(wy / CONFIG.CELL_SIZE),
    };
  }
  function cellToWorld(cx, cy) {
    return {
      wx: cx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
      wy: cy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
    };
  }
  function cellIdx(cx, cy) {
    return cy * CONFIG.MAP_CELLS + cx;
  }

  function forEachTailDiskCell(centerCx, centerCy, fn) {
    const r = CONFIG.TAIL_CAPTURE_RADIUS_CELLS;
    const r2 = r * r;
    for (let oy = -r; oy <= r; oy++) {
      for (let ox = -r; ox <= r; ox++) {
        if (ox * ox + oy * oy > r2) continue;
        const cx = centerCx + ox;
        const cy = centerCy + oy;
        if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) continue;
        fn(cx, cy);
      }
    }
  }

  function rasterizeCellLine(fromPt, toPt, fn) {
    const a = cellXY(fromPt.wx, fromPt.wy);
    const b = cellXY(toPt.wx, toPt.wy);
    let x0 = a.cx, y0 = a.cy;
    const x1 = b.cx, y1 = b.cy;
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      fn(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function forEachTailCoveredCell(path, fn) {
    if (!path || path.length === 0) return;
    if (path.length === 1) {
      const { cx, cy } = cellXY(path[0].wx, path[0].wy);
      forEachTailDiskCell(cx, cy, fn);
      return;
    }
    for (let i = 1; i < path.length; i++) {
      rasterizeCellLine(path[i - 1], path[i], (cx, cy) => {
        forEachTailDiskCell(cx, cy, fn);
      });
    }
  }

  function seedCorner(grid, playerId, cx0, cy0) {
    const h = CONFIG.SEED_HALF;
    const lx = Math.max(0, cx0 - h),  hx = Math.min(CONFIG.MAP_CELLS - 1, cx0 + h);
    const ly = Math.max(0, cy0 - h),  hy = Math.min(CONFIG.MAP_CELLS - 1, cy0 + h);
    for (let cy = ly; cy <= hy; cy++)
      for (let cx = lx; cx <= hx; cx++)
        grid[cellIdx(cx, cy)] = playerId;
  }

  function headingTowardCenter(wx, wy) {
    const angle = Math.atan2(WORLD_SIZE / 2 - wy, WORLD_SIZE / 2 - wx);
    return angleToHeadingIndex(angle);
  }

  function initState() {
    const N = CONFIG.MAP_CELLS;
    const ownershipGrid = new Int8Array(N * N).fill(-1);
    const tailGrid      = new Uint8Array(N * N);  // bitmask: bit i = player i has tail here

    const margin = CONFIG.SEED_HALF * CONFIG.CELL_SIZE + CONFIG.PLAYER_RADIUS * 2;
    const corners = [
      { wx: margin,              wy: WORLD_SIZE - margin },  // bot-left  (user)
      { wx: margin,              wy: margin              },  // top-left  (cpu1)
      { wx: WORLD_SIZE - margin, wy: margin              },  // top-right (cpu2)
      { wx: WORLD_SIZE - margin, wy: WORLD_SIZE - margin },  // bot-right (cpu3)
    ];

    const seedArea = (2 * CONFIG.SEED_HALF + 1) * (2 * CONFIG.SEED_HALF + 1);

    const players = corners.map((pos, i) => {
      const { cx, cy } = cellXY(pos.wx, pos.wy);
      seedCorner(ownershipGrid, i, cx, cy);
      return {
        id:           i,
        type:         i === 0 ? 'user' : 'cpu',
        alive:        true,
        color:        CONFIG.PALETTE[i].base,
        name:         CONFIG.PALETTE[i].name,
        wx:           pos.wx,
        wy:           pos.wy,
        headingIndex: headingTowardCenter(pos.wx, pos.wy),
        speed:        CONFIG.PLAYER_SPEED,
        tailActive:   false,
        tailPath:     [],
        capturedArea: seedArea,
        currentArea:  seedArea,
        aiTargetHeading: headingTowardCenter(pos.wx, pos.wy),
        aiNextThinkTick: 0,
        aiCommitUntilTick: 0,
        aiTailStartTick: -1,
        aiLoopSign: Math.random() < 0.5 ? -1 : 1,
        aiSegment: 0,
        aiSegmentEndTick: 0,
      };
    });

    return {
      phase:    'start',   // 'start' | 'running' | 'ended'
      tick:     0,
      winnerId: null,
      endReason: null,
      players,
      ownershipGrid,
      tailGrid,
    };
  }

  // ─────────────────────────────────────────────────────────────────
  // 4. INPUT
  // ─────────────────────────────────────────────────────────────────
  const input = { targetHeading: null };

  function stepHeadingToward(current, target, maxStep) {
    const cw  = (target - current + 16) % 16;
    const ccw = (current - target + 16) % 16;
    if (cw === 0) return current;
    if (cw <= ccw) return (current + Math.min(maxStep, cw)) % 16;
    return (current - Math.min(maxStep, ccw) + 16) % 16;
  }

  function requestHeading(newIdx) {
    if (!G || G.phase !== 'running') return;
    const user = G.players[0];
    if (!user.alive) return;
    if (isOppositeHeading(user.headingIndex, newIdx)) return;
    input.targetHeading = newIdx;
    debugLog('INPUT', 'heading requested', { playerId: 0, targetHeading: newIdx });
  }

  window.addEventListener('keydown', e => {
    if (!G) return;
    if (G.phase === 'start' || G.phase === 'ended') {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); return; }
    }
    if (G.phase !== 'running') return;
    const user = G.players[0];
    const base = input.targetHeading !== null ? input.targetHeading : user.headingIndex;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); requestHeading((base - 1 + 16) % 16); }
    if (e.key === 'ArrowRight') { e.preventDefault(); requestHeading((base + 1) % 16); }
    if (e.key === 'ArrowUp')    { e.preventDefault(); requestHeading((base - 2 + 16) % 16); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); requestHeading((base + 2) % 16); }
  });

  {
    let touchStart = null;
    document.addEventListener('touchstart', e => {
      if (G && (G.phase === 'start' || G.phase === 'ended')) return;
      e.preventDefault();
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (G && (G.phase === 'start' || G.phase === 'ended')) {
        touchStart = null; startGame(); return;
      }
      if (!touchStart) return;
      e.preventDefault();
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.hypot(dx, dy) < 20) return;
      requestHeading(angleToHeadingIndex(Math.atan2(dy, dx)));
    }, { passive: false });
  }

  // ─────────────────────────────────────────────────────────────────
  // 5. SIMULATION CORE
  // ─────────────────────────────────────────────────────────────────
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function isInsideOwnTerritory(player) {
    const { cx, cy } = cellXY(player.wx, player.wy);
    if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) return false;
    return G.ownershipGrid[cellIdx(cx, cy)] === player.id;
  }

  function stampTailCell(player) {
    const path = player.tailPath;
    const n = path.length;
    if (n === 0) return;
    const bit = 1 << player.id;
    if (n === 1) {
      const { cx, cy } = cellXY(path[0].wx, path[0].wy);
      forEachTailDiskCell(cx, cy, (tx, ty) => {
        G.tailGrid[cellIdx(tx, ty)] |= bit;
      });
      return;
    }
    rasterizeCellLine(path[n - 2], path[n - 1], (cx, cy) => {
      forEachTailDiskCell(cx, cy, (tx, ty) => {
        G.tailGrid[cellIdx(tx, ty)] |= bit;
      });
    });
  }

  function movePlayer(player) {
    const dir = DIRECTIONS[player.headingIndex];
    player.wx = clamp(player.wx + dir.dx * player.speed, 0, WORLD_SIZE - 0.01);
    player.wy = clamp(player.wy + dir.dy * player.speed, 0, WORLD_SIZE - 0.01);
  }

  function updateTail(player) {
    const inside = isInsideOwnTerritory(player);
    if (inside) {
      // If tail is active, closure detected — captureLoop handles cleanup
      return;
    }
    if (!player.tailActive) {
      player.tailActive = true;
      player.tailPath = [];
      debugLog('TAIL', 'tail started', {
        playerId: player.id,
        wx: Number(player.wx.toFixed(2)),
        wy: Number(player.wy.toFixed(2)),
      });
    }
    const last = player.tailPath[player.tailPath.length - 1];
    const dist = last ? Math.hypot(player.wx - last.wx, player.wy - last.wy) : Infinity;
    if (dist >= CONFIG.TAIL_SAMPLE_DIST || player.tailPath.length === 0) {
      player.tailPath.push({ wx: player.wx, wy: player.wy });
      stampTailCell(player);
    }
  }

  // ─────────────────────────────────────────────────────────────────
  // 6. CAPTURE SYSTEM
  // ─────────────────────────────────────────────────────────────────
  function captureLoop(player) {
    if (player.tailPath.length < 2) {
      debugLog('CAPTURE', 'capture skipped: short tail', { playerId: player.id, tailPoints: player.tailPath.length });
      return;
    }
    if (!isInsideOwnTerritory(player)) return;

    const N = CONFIG.MAP_CELLS;
    const tempBoundary = new Uint8Array(N * N);
    const tailBoundary = new Uint8Array(N * N);

    // Mark tail path cells as boundary
    forEachTailCoveredCell(player.tailPath, (cx, cy) => {
      const i = cellIdx(cx, cy);
      tempBoundary[i] = 1;
      tailBoundary[i] = 1;
    });
    // Mark own territory as boundary (so fill stays enclosed)
    for (let i = 0; i < G.ownershipGrid.length; i++) {
      if (G.ownershipGrid[i] === player.id) tempBoundary[i] = 1;
    }

    // Bounding box of tail path
    let minCx = N, maxCx = 0, minCy = N, maxCy = 0;
    for (const pt of player.tailPath) {
      const { cx, cy } = cellXY(pt.wx, pt.wy);
      if (cx < minCx) minCx = cx; if (cx > maxCx) maxCx = cx;
      if (cy < minCy) minCy = cy; if (cy > maxCy) maxCy = cy;
    }
    const boundaryPad = CONFIG.TAIL_CAPTURE_RADIUS_CELLS + 2;
    minCx = Math.max(0, minCx - boundaryPad); minCy = Math.max(0, minCy - boundaryPad);
    maxCx = Math.min(N - 1, maxCx + boundaryPad); maxCy = Math.min(N - 1, maxCy + boundaryPad);

    if (maxCx < minCx || maxCy < minCy) return;

    // Seal corner-only diagonal contacts so flood-fill does not leak through
    // tiny checkerboard gaps in slanted or U-turn boundaries.
    let sealedCornerCells = 0;
    for (let cy = minCy; cy < maxCy; cy++) {
      for (let cx = minCx; cx < maxCx; cx++) {
        const a = cellIdx(cx, cy);
        const b = cellIdx(cx + 1, cy + 1);
        const c = cellIdx(cx + 1, cy);
        const d = cellIdx(cx, cy + 1);
        // Only seal if the diagonal touch involves tail cells.
        if (tempBoundary[a] && tempBoundary[b] && (tailBoundary[a] || tailBoundary[b])) {
          if (!tempBoundary[c]) { tempBoundary[c] = 1; sealedCornerCells++; }
          if (!tempBoundary[d]) { tempBoundary[d] = 1; sealedCornerCells++; }
        }
        const e = cellIdx(cx + 1, cy);
        const f = cellIdx(cx, cy + 1);
        const g = cellIdx(cx, cy);
        const h = cellIdx(cx + 1, cy + 1);
        if (tempBoundary[e] && tempBoundary[f] && (tailBoundary[e] || tailBoundary[f])) {
          if (!tempBoundary[g]) { tempBoundary[g] = 1; sealedCornerCells++; }
          if (!tempBoundary[h]) { tempBoundary[h] = 1; sealedCornerCells++; }
        }
      }
    }

    // Global flood-fill from map edges so that pockets enclosed by multiple
    // separate previous captures are also detected and filled. This prevents
    // thin strips between adjacent loops from remaining uncaptured.
    const outside = new Uint8Array(N * N);
    const queue = [];
    const tryAdd = (cx, cy) => {
      if (cx < 0 || cx >= N || cy < 0 || cy >= N) return;
      const gi = cellIdx(cx, cy);
      if (outside[gi] || tempBoundary[gi]) return;
      outside[gi] = 1;
      queue.push(cx, cy);
    };

    // Seed from all 4 map edges
    for (let cx = 0; cx < N; cx++) { tryAdd(cx, 0); tryAdd(cx, N - 1); }
    for (let cy = 1; cy < N - 1; cy++) { tryAdd(0, cy); tryAdd(N - 1, cy); }

    const dx4 = [1,-1,0,0], dy4 = [0,0,1,-1];
    let qi = 0;
    while (qi < queue.length) {
      const cx = queue[qi++], cy = queue[qi++];
      for (let d = 0; d < 4; d++) {
        tryAdd(cx + dx4[d], cy + dy4[d]);
      }
    }

    // Capture all cells globally not reachable from map edges and not already owned.
    // This correctly fills pockets enclosed by multiple prior captures.
    let newCells = 0;
    for (let gi = 0; gi < N * N; gi++) {
      if (!outside[gi] && G.ownershipGrid[gi] !== player.id) {
        G.ownershipGrid[gi] = player.id;
        newCells++;
      }
    }
    player.capturedArea += newCells;
    debugLog('CAPTURE', 'capture resolved', {
      playerId: player.id,
      tailPoints: player.tailPath.length,
      bbox: { minCx, minCy, maxCx, maxCy },
      sealedCornerCells,
      newCells,
      totalArea: player.capturedArea,
    });

    // Clear tail
    const clearBit = ~(1 << player.id);
    forEachTailCoveredCell(player.tailPath, (cx, cy) => {
      G.tailGrid[cellIdx(cx, cy)] &= clearBit;
    });
    player.tailPath = [];
    player.tailActive = false;
  }

  // ─────────────────────────────────────────────────────────────────
  // 7. ELIMINATION & MATCH END
  // ─────────────────────────────────────────────────────────────────
  function checkEliminations() {
    for (const mover of G.players) {
      if (!mover.alive) continue;
      const { cx, cy } = cellXY(mover.wx, mover.wy);
      if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) continue;
      const bits = G.tailGrid[cellIdx(cx, cy)];
      if (!bits) continue;

      for (const victim of G.players) {
        if (!victim.alive || !victim.tailActive) continue;
        if (!(bits & (1 << victim.id))) continue;
        if (mover.id === victim.id && !CONFIG.allowSelfTailDeath) continue;

        victim.alive = false;
        victim.tailActive = false;
        debugLog('ELIM', 'player eliminated', {
          moverId: mover.id,
          victimId: victim.id,
          wx: Number(mover.wx.toFixed(2)),
          wy: Number(mover.wy.toFixed(2)),
        });
        const clearBit = ~(1 << victim.id);
        forEachTailCoveredCell(victim.tailPath, (tx, ty) => {
          G.tailGrid[cellIdx(tx, ty)] &= clearBit;
        });
        victim.tailPath = [];
      }
    }
  }

  function checkMatchEnd() {
    const totalCells = CONFIG.MAP_CELLS * CONFIG.MAP_CELLS;
    const counts = new Array(G.players.length).fill(0);
    let unowned = 0;
    for (let i = 0; i < G.ownershipGrid.length; i++) {
      const owner = G.ownershipGrid[i];
      if (owner >= 0 && owner < counts.length) counts[owner]++;
      else unowned++;
    }
    for (const p of G.players) p.currentArea = counts[p.id];

    const user = G.players[0];
    const allCpuDead = G.players.filter(p => p.type === 'cpu').every(p => !p.alive);
    const leader = G.players.reduce((a, b) => (b.currentArea > a.currentArea ? b : a));
    let bestAliveChallenger = -1;
    for (const p of G.players) {
      if (!p.alive || p.id === leader.id) continue;
      if (p.currentArea > bestAliveChallenger) bestAliveChallenger = p.currentArea;
    }
    const unreachableLead = leader.currentArea > (bestAliveChallenger + unowned);
    const majorityControl = leader.currentArea > (totalCells / 2);

    if (!user.alive || allCpuDead || unreachableLead || majorityControl) {
      G.phase = 'ended';
      G.winnerId = leader.id;
      if (!user.alive) G.endReason = 'user-eliminated';
      else if (allCpuDead) G.endReason = 'all-cpu-eliminated';
      else if (majorityControl) G.endReason = 'majority-control';
      else G.endReason = 'unreachable-lead';
    }
  }

  // ─────────────────────────────────────────────────────────────────
  // 8. CAMERA
  // ─────────────────────────────────────────────────────────────────
  const camera = { wx: 0, wy: 0, vw: 1, vh: 1, screenW: 1, screenH: 1, lookX: 0, lookY: 0 };

  function cameraUpdate() {
    const user = G.players[0];
    if (!user.alive) return;
    const dir = DIRECTIONS[user.headingIndex];
    const lookLerp = 0.18;
    camera.lookX += (dir.dx * CONFIG.LOOK_AHEAD - camera.lookX) * lookLerp;
    camera.lookY += (dir.dy * CONFIG.LOOK_AHEAD - camera.lookY) * lookLerp;

    const dw = camera.vw * CONFIG.DEAD_ZONE_FRAC;
    const dh = camera.vh * CONFIG.DEAD_ZONE_FRAC;
    const marginX = (camera.vw - dw) / 2;
    const marginY = (camera.vh - dh) / 2;
    const dzL = camera.wx + (camera.vw - dw) / 2;
    const dzR = dzL + dw;
    const dzT = camera.wy + (camera.vh - dh) / 2;
    const dzB = dzT + dh;

    const focusX = user.wx + camera.lookX;
    const focusY = user.wy + camera.lookY;
    let tWx = camera.wx;
    let tWy = camera.wy;

    if (focusX < dzL) tWx = focusX - marginX;
    else if (focusX > dzR) tWx = focusX - marginX - dw;

    if (focusY < dzT) tWy = focusY - marginY;
    else if (focusY > dzB) tWy = focusY - marginY - dh;

    camera.wx += (tWx - camera.wx) * CONFIG.PAN_LERP;
    camera.wy += (tWy - camera.wy) * CONFIG.PAN_LERP;
    camera.wx = clamp(camera.wx, 0, WORLD_SIZE - camera.vw);
    camera.wy = clamp(camera.wy, 0, WORLD_SIZE - camera.vh);
  }

  function worldToScreen(wx, wy) {
    const scale = camera.screenW / camera.vw;
    return { sx: (wx - camera.wx) * scale, sy: (wy - camera.wy) * scale };
  }

  function resizeCamera() {
    const wrap   = document.getElementById('canvas-wrap');
    const canvas = document.getElementById('game');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w; canvas.height = h;
    camera.screenW = w; camera.screenH = h;
    const viewWU = WORLD_SIZE * 0.38;
    camera.vw = viewWU;
    camera.vh = viewWU * (h / w);
    camera.lookX = 0;
    camera.lookY = 0;
    const mm = document.getElementById('minimap');
    mm.width = mm.height = CONFIG.MINIMAP_PX;
  }

  // ─────────────────────────────────────────────────────────────────
  // 9. RENDERING
  // ─────────────────────────────────────────────────────────────────
  const _colorCache = {};
  function toRgba(hex, a) {
    const k = hex + a;
    if (!_colorCache[k]) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      _colorCache[k] = `rgba(${r},${g},${b},${a})`;
    }
    return _colorCache[k];
  }

  function render() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    ctx.fillStyle = '#1b2030';
    ctx.fillRect(0, 0, W, H);

    const scale = camera.screenW / camera.vw;
    const cellPx = CONFIG.CELL_SIZE * scale;

    // ── Territory fills (visible cells only) ───────────────────────
    const N = CONFIG.MAP_CELLS;
    const vMinCx = Math.max(0, Math.floor(camera.wx / CONFIG.CELL_SIZE) - 1);
    const vMaxCx = Math.min(N - 1, Math.ceil((camera.wx + camera.vw) / CONFIG.CELL_SIZE) + 1);
    const vMinCy = Math.max(0, Math.floor(camera.wy / CONFIG.CELL_SIZE) - 1);
    const vMaxCy = Math.min(N - 1, Math.ceil((camera.wy + camera.vh) / CONFIG.CELL_SIZE) + 1);

    // Draw territory as merged horizontal spans with pixel-snapped coords.
    // Both pyTop and pyBottom use Math.floor so that adjacent rows tile
    // perfectly: pyTop(cy+1) === pyBottom(cy), no horizontal gaps.
    for (let cy = vMinCy; cy <= vMaxCy; cy++) {
      const pyTop    = Math.floor((cy       * CONFIG.CELL_SIZE - camera.wy) * scale);
      const pyBottom = Math.floor(((cy + 1) * CONFIG.CELL_SIZE - camera.wy) * scale);
      const rowH = pyBottom - pyTop;
      if (rowH <= 0) continue; // cells smaller than 1px at this zoom — skip

      let spanOwner = -1, spanStartCx = 0;
      const flushSpan = (endCx) => {
        if (spanOwner < 0) return;
        const pxLeft  = Math.floor((spanStartCx * CONFIG.CELL_SIZE - camera.wx) * scale);
        const pxRight = Math.floor((endCx        * CONFIG.CELL_SIZE - camera.wx) * scale);
        ctx.fillStyle = toRgba(CONFIG.PALETTE[spanOwner].base, 0.35);
        ctx.fillRect(pxLeft, pyTop, Math.max(1, pxRight - pxLeft), rowH);
      };
      for (let cx = vMinCx; cx <= vMaxCx; cx++) {
        const owner = G.ownershipGrid[cellIdx(cx, cy)];
        if (owner !== spanOwner) { flushSpan(cx); spanOwner = owner; spanStartCx = cx; }
      }
      flushSpan(vMaxCx + 1);
    }

    // ── Tails ──────────────────────────────────────────────────────
    const tailPx = CONFIG.TAIL_WIDTH * scale;
    for (const p of G.players) {
      if (!p.alive || !p.tailActive || p.tailPath.length < 2) continue;
      ctx.save();
      ctx.strokeStyle = p.color;
      ctx.lineWidth   = tailPx;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      const f = worldToScreen(p.tailPath[0].wx, p.tailPath[0].wy);
      ctx.moveTo(f.sx, f.sy);
      for (let i = 1; i < p.tailPath.length; i++) {
        const pt = worldToScreen(p.tailPath[i].wx, p.tailPath[i].wy);
        ctx.lineTo(pt.sx, pt.sy);
      }
      const cur = worldToScreen(p.wx, p.wy);
      ctx.lineTo(cur.sx, cur.sy);
      ctx.stroke();
      ctx.restore();
    }

    // ── Player avatars ─────────────────────────────────────────────
    const avatarR = CONFIG.PLAYER_RADIUS * scale;
    for (const p of G.players) {
      if (!p.alive) continue;
      const { sx, sy } = worldToScreen(p.wx, p.wy);
      const angle = p.headingIndex * (2 * Math.PI / 16);
      if (p.type === 'user') {
        drawUserShip(ctx, sx, sy, angle, avatarR, p.color, CONFIG.USER_ACCENT);
      } else {
        drawArrow(ctx, sx, sy, angle, avatarR, p.color, null);
      }
    }

    // ── HUD text ───────────────────────────────────────────────────
    const total = CONFIG.MAP_CELLS * CONFIG.MAP_CELLS;
    const user  = G.players[0];
    document.getElementById('hud-territory').textContent =
      Math.round((user.currentArea || user.capturedArea) / total * 100) + '%';
    document.getElementById('hud-players').textContent =
      G.players.filter(p => p.alive).length + '/4';
    document.getElementById('hud-tick').textContent = G.tick;

    if (debugState.enabled) renderDebugScale(ctx, W, H, scale);

    renderMinimap();
  }

  function renderDebugScale(ctx, W, H, scale) {
    const stepCells = CONFIG.DEBUG_SCALE_STEP_CELLS;
    const minCx = Math.max(0, Math.floor(camera.wx / CONFIG.CELL_SIZE));
    const maxCx = Math.min(CONFIG.MAP_CELLS - 1, Math.ceil((camera.wx + camera.vw) / CONFIG.CELL_SIZE));
    const minCy = Math.max(0, Math.floor(camera.wy / CONFIG.CELL_SIZE));
    const maxCy = Math.min(CONFIG.MAP_CELLS - 1, Math.ceil((camera.wy + camera.vh) / CONFIG.CELL_SIZE));

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.fillStyle = 'rgba(230,240,255,0.9)';
    ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.lineWidth = 1;

    for (let cx = Math.floor(minCx / stepCells) * stepCells; cx <= maxCx; cx += stepCells) {
      const sx = (cx * CONFIG.CELL_SIZE - camera.wx) * scale;
      if (sx < 0 || sx > W) continue;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, H - 7); ctx.lineTo(sx, H); ctx.stroke();
      ctx.fillText(String(cx), sx + 2, 11);
      ctx.fillText(String(cx), sx + 2, H - 10);
    }
    for (let cy = Math.floor(minCy / stepCells) * stepCells; cy <= maxCy; cy += stepCells) {
      const sy = (cy * CONFIG.CELL_SIZE - camera.wy) * scale;
      if (sy < 0 || sy > H) continue;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(7, sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - 7, sy); ctx.lineTo(W, sy); ctx.stroke();
      ctx.fillText(String(cy), 9, sy - 2);
      const t = String(cy);
      ctx.fillText(t, W - 8 - ctx.measureText(t).width, sy - 2);
    }
    ctx.restore();
  }

  /** Arrow chevron pointing in direction `angle` (radians, screen space). */
  function drawArrow(ctx, sx, sy, angle, r, fill, accent) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    const tip   =  r;
    const rear  = -r * 0.7;
    const wing  =  r * 0.55;
    const notch = -r * 0.2;

    ctx.beginPath();
    ctx.moveTo(tip, 0);
    ctx.lineTo(rear, -wing);
    ctx.lineTo(notch, 0);
    ctx.lineTo(rear,  wing);
    ctx.closePath();

    if (accent) {
      ctx.save();
      ctx.strokeStyle = accent;
      ctx.lineWidth = Math.max(2, r * 0.32);
      ctx.lineJoin  = 'round';
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  /** Distinct user ship silhouette with canopy + fins. */
  function drawUserShip(ctx, sx, sy, angle, r, fill, accent) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    const nose = r * 1.05;
    const tail = -r * 0.88;
    const bodyTop = -r * 0.36;
    const bodyBottom = r * 0.36;
    const finX = -r * 0.38;
    const finY = r * 0.66;
    const tailInset = -r * 0.08;

    if (accent) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(nose, 0);
      ctx.lineTo(finX, -finY);
      ctx.lineTo(tailInset, -bodyTop);
      ctx.lineTo(tail, -bodyTop * 0.9);
      ctx.quadraticCurveTo(tail - r * 0.08, 0, tail, bodyTop * 0.9);
      ctx.lineTo(tailInset, bodyTop);
      ctx.lineTo(finX, finY);
      ctx.closePath();
      ctx.strokeStyle = accent;
      ctx.lineWidth = Math.max(2, r * 0.26);
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.moveTo(nose, 0);
    ctx.lineTo(finX, -finY);
    ctx.lineTo(tailInset, -bodyTop);
    ctx.lineTo(tail, -bodyTop * 0.9);
    ctx.quadraticCurveTo(tail - r * 0.08, 0, tail, bodyTop * 0.9);
    ctx.lineTo(tailInset, bodyTop);
    ctx.lineTo(finX, finY);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(finX * 0.12, -r * 0.2);
    ctx.quadraticCurveTo(r * 0.18, -r * 0.32, r * 0.46, 0);
    ctx.quadraticCurveTo(r * 0.18, r * 0.32, finX * 0.12, r * 0.2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(235, 246, 255, 0.82)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-r * 0.12, -r * 0.1);
    ctx.lineTo(-r * 0.5, -r * 0.42);
    ctx.lineTo(-r * 0.16, -r * 0.02);
    ctx.closePath();
    ctx.moveTo(-r * 0.12, r * 0.1);
    ctx.lineTo(-r * 0.5, r * 0.42);
    ctx.lineTo(-r * 0.16, r * 0.02);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(tail - r * 0.04, -r * 0.11);
    ctx.lineTo(tail - r * 0.3, 0);
    ctx.lineTo(tail - r * 0.04, r * 0.11);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 214, 138, 0.8)';
    ctx.fill();

    ctx.restore();
  }

  function renderMinimap() {
    const mm   = document.getElementById('minimap');
    const mctx = mm.getContext('2d');
    const mpx  = CONFIG.MINIMAP_PX;
    const N    = CONFIG.MAP_CELLS;
    const sc   = mpx / N;

    mctx.fillStyle = '#111826';
    mctx.fillRect(0, 0, mpx, mpx);

    for (let cy = 0; cy < N; cy++) {
      for (let cx = 0; cx < N; cx++) {
        const owner = G.ownershipGrid[cellIdx(cx, cy)];
        if (owner < 0) continue;
        mctx.fillStyle = toRgba(CONFIG.PALETTE[owner].base, 0.75);
        mctx.fillRect(cx * sc, cy * sc, sc + 0.5, sc + 0.5);
      }
    }

    for (const p of G.players) {
      if (!p.alive) continue;
      const mx = p.wx / WORLD_SIZE * mpx;
      const my = p.wy / WORLD_SIZE * mpx;
      mctx.beginPath();
      mctx.arc(mx, my, p.type === 'user' ? 3 : 2, 0, Math.PI * 2);
      mctx.fillStyle = p.type === 'user' ? CONFIG.USER_ACCENT : p.color;
      mctx.fill();
    }

    const vx = camera.wx / WORLD_SIZE * mpx;
    const vy = camera.wy / WORLD_SIZE * mpx;
    const vw = camera.vw / WORLD_SIZE * mpx;
    const vh = camera.vh / WORLD_SIZE * mpx;
    mctx.strokeStyle = 'rgba(255,255,255,0.5)';
    mctx.lineWidth = 1;
    mctx.strokeRect(vx, vy, vw, vh);
  }

  // ─────────────────────────────────────────────────────────────────
  // 10. CPU LOGIC
  // ─────────────────────────────────────────────────────────────────
  function normalize2(x, y) {
    const m = Math.hypot(x, y) || 1;
    return { x: x / m, y: y / m };
  }

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function cpuRoleProfile(cpu, diff) {
    const totalCells = CONFIG.MAP_CELLS * CONFIG.MAP_CELLS;
    const areas = G.players.map(p => p.currentArea || p.capturedArea || 0);
    const myArea = areas[cpu.id] || 0;
    const leaderArea = Math.max(...areas);
    let bestOther = 0;
    for (const p of G.players) {
      if (p.id === cpu.id) continue;
      const a = areas[p.id] || 0;
      if (a > bestOther) bestOther = a;
    }

    const trailingGap = leaderArea - myArea;
    const leadingGap = myArea - bestOther;
    const behind = trailingGap > totalCells * 0.08;
    const ahead = leadingGap > totalCells * 0.05;

    if (behind) {
      return {
        mode: 'behind',
        aggro: diff.behindAggro,
        safety: 0.88,
      };
    }
    if (ahead) {
      return {
        mode: 'ahead',
        aggro: diff.aheadSafety,
        safety: 1.24,
      };
    }
    return {
      mode: 'neutral',
      aggro: 1,
      safety: 1,
    };
  }

  function findPredictedTailIntercept(cpu, leadTicks) {
    let best = null;
    let bestScore = Infinity;
    for (const other of G.players) {
      if (!other.alive || other.id === cpu.id || !other.tailActive) continue;
      const od = DIRECTIONS[other.headingIndex];
      const predWx = clamp(other.wx + od.dx * other.speed * leadTicks, 0, WORLD_SIZE);
      const predWy = clamp(other.wy + od.dy * other.speed * leadTicks, 0, WORLD_SIZE);
      const dist = Math.hypot(predWx - cpu.wx, predWy - cpu.wy);
      const tailBonus = Math.min(140, other.tailPath.length * 0.8);
      const score = dist - tailBonus;
      if (score < bestScore) {
        bestScore = score;
        best = { wx: predWx, wy: predWy, enemyId: other.id };
      }
    }
    return best;
  }

  function chooseContestTarget(cpu, sampleStep) {
    const N = CONFIG.MAP_CELLS;
    const step = Math.max(4, sampleStep * 2);
    let best = null;
    let bestScore = -Infinity;

    for (let cy = 0; cy < N; cy += step) {
      for (let cx = 0; cx < N; cx += step) {
        if (G.ownershipGrid[cellIdx(cx, cy)] !== -1) continue;
        const w = cellToWorld(cx, cy);
        const dSelf = Math.hypot(w.wx - cpu.wx, w.wy - cpu.wy);

        let dOpp = Infinity;
        for (const other of G.players) {
          if (!other.alive || other.id === cpu.id) continue;
          const d = Math.hypot(w.wx - other.wx, w.wy - other.wy);
          if (d < dOpp) dOpp = d;
        }
        if (!isFinite(dOpp)) continue;

        const parity = -Math.abs(dSelf - dOpp);
        const nearby = -dSelf * 0.25;
        const contest = dOpp < 260 ? 55 : 0;
        const centerPull = -Math.hypot(w.wx - WORLD_SIZE / 2, w.wy - WORLD_SIZE / 2) * 0.02;
        const score = parity + nearby + contest + centerPull;
        if (score > bestScore) {
          bestScore = score;
          best = { wx: w.wx, wy: w.wy };
        }
      }
    }
    return best;
  }

  function cpuTick(cpu) {
    if (!cpu.alive) return;
    const diffKey = currentDifficultyKey();
    const diff = currentDifficulty();
    const role = cpuRoleProfile(cpu, diff);
    const user = G.players[0];

    const N    = CONFIG.MAP_CELLS;
    const step = Math.max(1, Math.floor(N / 20));

    let sx = 0, sy = 0, cnt = 0;
    let bestDist = Infinity, nearWx = cpu.wx, nearWy = cpu.wy;

    for (let cy = 0; cy < N; cy += step) {
      for (let cx = 0; cx < N; cx += step) {
        if (G.ownershipGrid[cellIdx(cx, cy)] !== cpu.id) continue;
        const w = cellToWorld(cx, cy);
        sx += w.wx; sy += w.wy; cnt++;
        const d = Math.hypot(w.wx - cpu.wx, w.wy - cpu.wy);
        if (d < bestDist) { bestDist = d; nearWx = w.wx; nearWy = w.wy; }
      }
    }

    const centroidWx = cnt > 0 ? sx / cnt : cpu.wx;
    const centroidWy = cnt > 0 ? sy / cnt : cpu.wy;
    const outward = normalize2(cpu.wx - centroidWx, cpu.wy - centroidWy);

    let targetWx, targetWy;
    if (!cpu.tailActive) {
      cpu.aiTailStartTick = -1;
      cpu.aiCommitUntilTick = 0;
      cpu.aiSegment = 0;
      cpu.aiSegmentEndTick = 0;

      // Expand: move away from centroid
      const tx = -outward.y * cpu.aiLoopSign;
      const ty = outward.x * cpu.aiLoopSign;
      targetWx = cpu.wx + (outward.x + tx * diff.flankBias) * 120 * diff.expandScale;
      targetWy = cpu.wy + (outward.y + ty * diff.flankBias) * 120 * diff.expandScale;

      // Contest-aware expansion: stronger levels push toward neutral contested zones.
      const contestTarget = chooseContestTarget(cpu, step);
      if (contestTarget) {
        const bias = clamp01(diff.contestBias * role.aggro);
        targetWx = targetWx * (1 - bias) + contestTarget.wx * bias;
        targetWy = targetWy * (1 - bias) + contestTarget.wy * bias;
      }

      // Rookie/Easy stay more centered and conservative to feel distinctly safer.
      if (diffKey === 'rookie' || diffKey === 'easy') {
        const centerBlend = diffKey === 'rookie' ? 0.28 : 0.16;
        targetWx = targetWx * (1 - centerBlend) + (WORLD_SIZE / 2) * centerBlend;
        targetWy = targetWy * (1 - centerBlend) + (WORLD_SIZE / 2) * centerBlend;
      }

      // Opportunistic predictive interception of vulnerable tails.
      const interceptChance = clamp01(diff.interceptChance * role.aggro);
      if (Math.random() < interceptChance) {
        const intercept = findPredictedTailIntercept(cpu, diff.interceptLeadTicks);
        if (intercept) {
          targetWx = intercept.wx;
          targetWy = intercept.wy;
        }
      }

      // Higher levels actively deny the user when the user is vulnerable.
      if (user.alive && user.tailActive) {
        const userDist = Math.hypot(user.wx - cpu.wx, user.wy - cpu.wy);
        const denyChance = clamp01(diff.denyUserChance * role.aggro);
        if (userDist < diff.denyUserRadius && Math.random() < denyChance) {
          const ud = DIRECTIONS[user.headingIndex];
          targetWx = clamp(user.wx + ud.dx * user.speed * (diff.interceptLeadTicks + 4), 0, WORLD_SIZE);
          targetWy = clamp(user.wy + ud.dy * user.speed * (diff.interceptLeadTicks + 4), 0, WORLD_SIZE);
        }
      }
    } else {
      if (cpu.aiTailStartTick < 0) {
        cpu.aiTailStartTick = G.tick;
        cpu.aiCommitUntilTick = G.tick + randInt(
          Math.max(8, Math.floor(diff.commitMin * role.aggro)),
          Math.max(12, Math.floor(diff.commitMax * role.aggro))
        );
        cpu.aiLoopSign = Math.random() < 0.5 ? -1 : 1;
        cpu.aiSegment = 0;
        cpu.aiSegmentEndTick = G.tick + randInt(diff.segmentMin, diff.segmentMax);
      }

      const edgeDist = Math.min(cpu.wx, cpu.wy, WORLD_SIZE - cpu.wx, WORLD_SIZE - cpu.wy);
      let nearestThreat = Infinity;
      for (const other of G.players) {
        if (!other.alive || other.id === cpu.id) continue;
        const d = Math.hypot(other.wx - cpu.wx, other.wy - cpu.wy);
        if (d < nearestThreat) nearestThreat = d;
      }

      const edgeBuffer = diff.edgeBuffer * role.safety;
      const threatReturnDist = diff.threatReturnDist * role.safety;
      const shouldReturn = (G.tick >= cpu.aiCommitUntilTick) ||
        (edgeDist < edgeBuffer) ||
        (nearestThreat < threatReturnDist) ||
        (cpu.tailPath.length > 220);

      if (shouldReturn) {
        targetWx = nearWx;
        targetWy = nearWy;
      } else {
        if (G.tick >= cpu.aiSegmentEndTick) {
          cpu.aiSegment = (cpu.aiSegment + 1) % diff.segmentCount;
          if (Math.random() < diff.loopFlipChance) cpu.aiLoopSign *= -1;
          cpu.aiSegmentEndTick = G.tick + randInt(diff.segmentMin, diff.segmentMax);
        }

        const dir = DIRECTIONS[cpu.headingIndex];
        const perpX = -dir.dy * cpu.aiLoopSign;
        const perpY = dir.dx * cpu.aiLoopSign;
        const toHome = normalize2(nearWx - cpu.wx, nearWy - cpu.wy);

        let vx = dir.dx;
        let vy = dir.dy;
        if (cpu.aiSegment === 0) {
          vx = dir.dx + perpX * diff.flankBias * 0.8;
          vy = dir.dy + perpY * diff.flankBias * 0.8;
        } else if (cpu.aiSegment === 1) {
          vx = perpX * (1.15 + diff.flankBias * 0.35) + outward.x * 0.25;
          vy = perpY * (1.15 + diff.flankBias * 0.35) + outward.y * 0.25;
        } else if (cpu.aiSegment === 2) {
          vx = toHome.x * 0.75 + dir.dx * 0.45 - perpX * 0.2;
          vy = toHome.y * 0.75 + dir.dy * 0.45 - perpY * 0.2;
        } else {
          const userVec = normalize2(user.wx - cpu.wx, user.wy - cpu.wy);
          vx = userVec.x * 0.95 + perpX * 0.5;
          vy = userVec.y * 0.95 + perpY * 0.5;
        }
        const v = normalize2(vx, vy);
        targetWx = cpu.wx + v.x * 170;
        targetWy = cpu.wy + v.y * 170;
      }
    }

    if (G.tick >= cpu.aiNextThinkTick || cpu.aiTargetHeading === null) {
      const angle = Math.atan2(targetWy - cpu.wy, targetWx - cpu.wx);
      let desired = angleToHeadingIndex(angle);

      if (Math.random() < diff.jitterChance) {
        desired = (desired + randInt(-diff.jitterSteps, diff.jitterSteps) + 16) % 16;
      }

      cpu.aiTargetHeading = desired;
      cpu.aiNextThinkTick = G.tick + randInt(diff.thinkMin, diff.thinkMax);
      debugLog('CPU', 'cpu think', {
        cpuId: cpu.id,
        targetHeading: cpu.aiTargetHeading,
        nextThinkTick: cpu.aiNextThinkTick,
        tailActive: cpu.tailActive,
        commitUntilTick: cpu.aiCommitUntilTick,
        mode: role.mode,
        segment: cpu.aiSegment,
        diff: diffKey,
      });
    }

    if (cpu.aiTargetHeading !== null && !isOppositeHeading(cpu.headingIndex, cpu.aiTargetHeading)) {
      cpu.headingIndex = stepHeadingToward(cpu.headingIndex, cpu.aiTargetHeading, diff.turnStep);
    }
  }

  // ─────────────────────────────────────────────────────────────────
  // 11. GAME LOOP
  // ─────────────────────────────────────────────────────────────────
  let loopId = null, lastTs = 0, accumulator = 0;

  function simTick() {
    G.tick++;

    if (debugState.enabled && (G.tick % CONFIG.DEBUG_TICK_SNAPSHOT_INTERVAL === 0)) {
      debugLog('TICK', 'snapshot', {
        players: G.players.map(p => ({
          id: p.id,
          alive: p.alive,
          wx: Number(p.wx.toFixed(1)),
          wy: Number(p.wy.toFixed(1)),
          h: p.headingIndex,
          tail: p.tailPath.length,
          area: p.capturedArea,
        })),
      });
    }

    const user = G.players[0];
    if (user.alive && input.targetHeading !== null) {
      user.headingIndex = stepHeadingToward(user.headingIndex, input.targetHeading, CONFIG.USER_TURN_STEP);
      if (user.headingIndex === input.targetHeading) input.targetHeading = null;
    }

    for (const p of G.players) if (p.type === 'cpu') cpuTick(p);
    for (const p of G.players) if (p.alive) movePlayer(p);
    for (const p of G.players) if (p.alive) updateTail(p);
    for (const p of G.players) {
      if (p.alive && p.tailActive && p.tailPath.length > 1) captureLoop(p);
    }
    checkEliminations();
    checkMatchEnd();
  }

  function gameLoop(ts) {
    if (!G || G.phase !== 'running') return;
    const delta = ts - lastTs; lastTs = ts;
    accumulator += delta;
    while (accumulator >= CONFIG.TICK_MS && G.phase === 'running') {
      simTick(); accumulator -= CONFIG.TICK_MS;
    }
    cameraUpdate();
    render();
    if (G.phase === 'running') {
      loopId = requestAnimationFrame(gameLoop);
    } else if (G.phase === 'ended') {
      render();
      showEndScreen();
    }
  }

  function startLoop() {
    if (loopId) cancelAnimationFrame(loopId);
    accumulator = 0;
    loopId = requestAnimationFrame(ts => { lastTs = ts; loopId = requestAnimationFrame(gameLoop); });
  }

  // ─────────────────────────────────────────────────────────────────
  // 12. BOOTSTRAP
  // ─────────────────────────────────────────────────────────────────
  function syncShellHeights() {
    const root = document.documentElement;
    const hdr = document.getElementById('site-header');
    const ftr = document.getElementById('site-footer');
    const hh = hdr && hdr.style.display !== 'none' ? hdr.offsetHeight : 0;
    const fh = ftr && ftr.style.display !== 'none' ? ftr.offsetHeight : 0;
    root.style.setProperty('--header-height', hh + 'px');
    root.style.setProperty('--footer-height', fh + 'px');
  }

  function observeShellHeights() {
    const opts = { childList: true, subtree: true };
    let rafId = 0;
    const onMutate = () => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        syncShellHeights();
        if (G) { resizeCamera(); initCamera(); render(); }
      });
    };
    const hdr = document.getElementById('site-header');
    const ftr = document.getElementById('site-footer');
    if (hdr) new MutationObserver(onMutate).observe(hdr, opts);
    if (ftr) new MutationObserver(onMutate).observe(ftr, opts);
    window.addEventListener('load', onMutate);
  }

  function showStartScreen() {
    document.getElementById('overlay-title').textContent = 'Loopfront';
    document.getElementById('overlay-msg').textContent =
      'Arrow keys to steer  \u2022  Loop back to your territory to capture land  \u2022  Cut enemy tails to eliminate them';
    document.getElementById('overlay-stats').style.display = 'none';
    document.getElementById('overlay-btn').textContent = 'Start';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function showPauseScreen() {
    document.getElementById('overlay-title').textContent = 'Paused';
    document.getElementById('overlay-msg').textContent =
      'Game is paused. Resume when ready. In debug mode, use Export Log to save diagnostics.';
    document.getElementById('overlay-stats').style.display = 'none';
    document.getElementById('overlay-btn').textContent = 'Resume';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function showEndScreen() {
    const winner = G.players.find(p => p.id === G.winnerId);
    const userWon = G.winnerId === 0;
    document.getElementById('overlay-title').textContent =
      userWon ? '\ud83c\udfc6 You Win!' : 'Game Over';
    document.getElementById('overlay-msg').textContent = userWon
      ? 'You claimed the most territory!'
      : `${winner ? winner.name : 'CPU'} claimed the most territory.`;

    if (G.endReason === 'majority-control') {
      document.getElementById('overlay-msg').textContent =
        `${winner ? winner.name : 'CPU'} secured majority control.`;
    } else if (G.endReason === 'unreachable-lead') {
      document.getElementById('overlay-msg').textContent =
        `${winner ? winner.name : 'CPU'} built an unreachable lead.`;
    }

    const statsDiv = document.getElementById('overlay-stats');
    const total = CONFIG.MAP_CELLS * CONFIG.MAP_CELLS;
    statsDiv.style.display = 'grid';
    statsDiv.innerHTML = G.players.map(p =>
      `<span class="lbl" style="color:${p.color}">${p.name}</span>` +
      `<span>${Math.round(((p.currentArea || 0) / total) * 100)}%${p.alive ? '' : ' \u2620'}</span>`
    ).join('');

    document.getElementById('overlay-btn').textContent = 'Restart';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function initCamera() {
    const user = G.players[0];
    camera.wx = clamp(user.wx - camera.vw / 2, 0, WORLD_SIZE - camera.vw);
    camera.wy = clamp(user.wy - camera.vh / 2, 0, WORLD_SIZE - camera.vh);
  }

  function startGame() {
    if (loopId) cancelAnimationFrame(loopId);
    G = initState();
    G.phase = 'running';
    beginDebugSession();
    initCamera();
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('btn-stop').textContent = 'Pause';
    startLoop();
  }

  function togglePauseResume() {
    if (!G) return;
    if (G.phase === 'running') {
      G.phase = 'paused';
      if (loopId) cancelAnimationFrame(loopId);
      loopId = null;
      document.getElementById('btn-stop').textContent = 'Resume';
      showPauseScreen();
      debugLog('GAME', 'paused by user');
      return;
    }
    if (G.phase === 'paused') {
      G.phase = 'running';
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('btn-stop').textContent = 'Pause';
      debugLog('GAME', 'resumed by user');
      startLoop();
    }
  }

  document.getElementById('btn-restart').addEventListener('click', () => {
    if (loopId) cancelAnimationFrame(loopId);
    G = initState(); resizeCamera(); initCamera(); render(); showStartScreen();
    document.getElementById('btn-stop').textContent = 'Pause';
  });
  document.getElementById('btn-debug').addEventListener('click', () => {
    setDebugEnabled(!debugState.enabled);
  });
  document.getElementById('btn-export-log').addEventListener('click', exportDebugLog);
  document.getElementById('btn-stop').addEventListener('click', togglePauseResume);
  document.getElementById('btn-difficulty').addEventListener('click', cycleDifficulty);
  document.getElementById('overlay-btn').addEventListener('click', () => {
    if (G && G.phase === 'paused') {
      togglePauseResume();
    } else {
      startGame();
    }
  });
  document.getElementById('btn-expand').addEventListener('click', () => {
    const hdr = document.getElementById('site-header');
    const ftr = document.getElementById('site-footer');
    const btn = document.getElementById('btn-expand');
    const hidden = hdr.style.display === 'none';
    hdr.style.display = hidden ? '' : 'none';
    ftr.style.display = hidden ? '' : 'none';
    btn.textContent   = hidden ? '\u26f6' : '\u2715';
    resizeCamera();
    if (G && G.phase === 'running') render();
  });

  window.addEventListener('resize', () => {
    syncShellHeights();
    resizeCamera();
    if (G) { initCamera(); render(); }
  });

  // Initial render
  setDebugEnabled(readInitialDebugEnabled());
  G = initState();
  updateDifficultyUI();
  syncShellHeights();
  observeShellHeights();
  resizeCamera();
  initCamera();
  render();
  showStartScreen();
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loopfront — Test Runner</title>
  <style>
    body { background:#1b2030; color:#c8d0e0; font-family:system-ui,sans-serif; padding:20px; }
    h1 { color:#e0d0b0; margin-bottom:16px; }
    h2 { color:#9ab0c8; margin:20px 0 8px; font-size:15px; border-bottom:1px solid #27364f; padding-bottom:4px; }
    .pass { color:#74b87e; }
    .fail { color:#c0856a; font-weight:600; }
    .row  { font-size:13px; margin:3px 0; padding:2px 6px; border-radius:3px; }
    .row.fail { background:rgba(192,133,106,0.12); }
    #summary { margin:0 0 16px 0; font-size:16px; font-weight:600; }
    #summary.allpass { color:#74b87e; }
    #summary.hasfail { color:#c0856a; }
  </style>
</head>
<body>
<h1>Loopfront — Test Runner</h1>

<script>
/* ───────────────────────────────────────────────────────────────────────
   Inline the logic under test.
   We replicate only pure-logic functions (no DOM, no canvas) so tests
   can run immediately in any browser with no build step.
─────────────────────────────────────────────────────────────────────── */

// ── Config (mirrors index.html) ──────────────────────────────────────
const CONFIG = Object.freeze({
  MAP_CELLS:          400,
  CELL_SIZE:          4,
  PLAYER_SPEED:       1.6,
  PLAYER_RADIUS:      6,
  TAIL_WIDTH:         4,
  TAIL_SAMPLE_DIST:   2,
  TAIL_CAPTURE_RADIUS_CELLS: 1,
  SEED_HALF:          20,
  CPU_COUNT:          3,
  TICK_MS:            30,
  allowSelfTailDeath: false,
  DEAD_ZONE_FRAC:     0.25,
  LOOK_AHEAD:         80,
  PAN_LERP:           0.08,
  MINIMAP_PX:         140,
  PALETTE: [
    { base:'#5b9bd5', name:'Blue'  },
    { base:'#c0856a', name:'Terra' },
    { base:'#74b87e', name:'Sage'  },
    { base:'#a87ab4', name:'Plum'  },
  ],
  USER_ACCENT: '#ffffff',
});
const WORLD_SIZE = CONFIG.MAP_CELLS * CONFIG.CELL_SIZE;

// ── Direction system ─────────────────────────────────────────────────
const DIRECTIONS = Array.from({ length: 16 }, (_, i) => {
  const a = i * (2 * Math.PI / 16);
  return { dx: Math.cos(a), dy: Math.sin(a) };
});

function angleToHeadingIndex(angle) {
  const norm = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  return Math.round(norm / (2 * Math.PI) * 16) % 16;
}

function isOppositeHeading(a, b) { return ((a - b + 16) % 16) === 8; }

// ── State helpers ────────────────────────────────────────────────────
function cellXY(wx, wy) {
  return { cx: Math.floor(wx / CONFIG.CELL_SIZE), cy: Math.floor(wy / CONFIG.CELL_SIZE) };
}
function cellToWorld(cx, cy) {
  return { wx: cx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
           wy: cy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
}
function cellIdx(cx, cy)  { return cy * CONFIG.MAP_CELLS + cx; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function seedCorner(grid, playerId, cx0, cy0) {
  const h = CONFIG.SEED_HALF;
  const lx = Math.max(0, cx0 - h), hx = Math.min(CONFIG.MAP_CELLS - 1, cx0 + h);
  const ly = Math.max(0, cy0 - h), hy = Math.min(CONFIG.MAP_CELLS - 1, cy0 + h);
  for (let cy = ly; cy <= hy; cy++)
    for (let cx = lx; cx <= hx; cx++)
      grid[cellIdx(cx, cy)] = playerId;
}

function headingTowardCenter(wx, wy) {
  const angle = Math.atan2(WORLD_SIZE / 2 - wy, WORLD_SIZE / 2 - wx);
  return angleToHeadingIndex(angle);
}

function initState() {
  const N = CONFIG.MAP_CELLS;
  const ownershipGrid = new Int8Array(N * N).fill(-1);
  const tailGrid      = new Uint8Array(N * N);
  const margin = CONFIG.SEED_HALF * CONFIG.CELL_SIZE + CONFIG.PLAYER_RADIUS * 2;
  const corners = [
    { wx: margin,              wy: margin              },
    { wx: WORLD_SIZE - margin, wy: margin              },
    { wx: margin,              wy: WORLD_SIZE - margin },
    { wx: WORLD_SIZE - margin, wy: WORLD_SIZE - margin },
  ];
  const seedArea = (2 * CONFIG.SEED_HALF + 1) * (2 * CONFIG.SEED_HALF + 1);
  const players = corners.map((pos, i) => {
    const { cx, cy } = cellXY(pos.wx, pos.wy);
    seedCorner(ownershipGrid, i, cx, cy);
    return {
      id: i, type: i === 0 ? 'user' : 'cpu', alive: true,
      color: CONFIG.PALETTE[i].base, name: CONFIG.PALETTE[i].name,
      wx: pos.wx, wy: pos.wy,
      headingIndex: headingTowardCenter(pos.wx, pos.wy),
      speed: CONFIG.PLAYER_SPEED, tailActive: false, tailPath: [], capturedArea: seedArea,
    };
  });
  return { phase:'start', tick:0, winnerId:null, players, ownershipGrid, tailGrid };
}

// ── Simulation helpers ───────────────────────────────────────────────
function isInsideOwnTerritory(player, ownershipGrid) {
  const { cx, cy } = cellXY(player.wx, player.wy);
  if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) return false;
  return ownershipGrid[cellIdx(cx, cy)] === player.id;
}

function stampTailCell(player, tailGrid) {
  const { cx, cy } = cellXY(player.wx, player.wy);
  if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) return;
  tailGrid[cellIdx(cx, cy)] |= (1 << player.id);
}

function movePlayer(player) {
  const dir = DIRECTIONS[player.headingIndex];
  player.wx = clamp(player.wx + dir.dx * player.speed, 0, WORLD_SIZE - 0.01);
  player.wy = clamp(player.wy + dir.dy * player.speed, 0, WORLD_SIZE - 0.01);
}

function updateTail(player, ownershipGrid, tailGrid) {
  const inside = isInsideOwnTerritory(player, ownershipGrid);
  if (inside) return; // closure handled by captureLoop
  if (!player.tailActive) { player.tailActive = true; player.tailPath = []; }
  const last = player.tailPath[player.tailPath.length - 1];
  const dist = last ? Math.hypot(player.wx - last.wx, player.wy - last.wy) : Infinity;
  if (dist >= CONFIG.TAIL_SAMPLE_DIST || player.tailPath.length === 0) {
    player.tailPath.push({ wx: player.wx, wy: player.wy });
    stampTailCell(player, tailGrid);
  }
}

function captureLoop(player, ownershipGrid, tailGrid) {
  if (player.tailPath.length < 2) return;  // guard: need a real path
  if (!isInsideOwnTerritory(player, ownershipGrid)) return;

  const N = CONFIG.MAP_CELLS;
  const tempBoundary = new Uint8Array(N * N);
  const tailBoundary = new Uint8Array(N * N);
  for (const pt of player.tailPath) {
    const { cx, cy } = cellXY(pt.wx, pt.wy);
    if (cx >= 0 && cx < N && cy >= 0 && cy < N) {
      const i = cellIdx(cx, cy);
      tempBoundary[i] = 1;
      tailBoundary[i] = 1;
    }
  }
  for (let i = 0; i < ownershipGrid.length; i++) {
    if (ownershipGrid[i] === player.id) tempBoundary[i] = 1;
  }

  // Diagonal sealing: close checkerboard gaps involving tail cells
  let minCx = N, maxCx = 0, minCy = N, maxCy = 0;
  for (const pt of player.tailPath) {
    const { cx, cy } = cellXY(pt.wx, pt.wy);
    if (cx < minCx) minCx = cx; if (cx > maxCx) maxCx = cx;
    if (cy < minCy) minCy = cy; if (cy > maxCy) maxCy = cy;
  }
  const boundaryPad = CONFIG.TAIL_CAPTURE_RADIUS_CELLS + 2;
  minCx = Math.max(0, minCx - boundaryPad); minCy = Math.max(0, minCy - boundaryPad);
  maxCx = Math.min(N - 1, maxCx + boundaryPad); maxCy = Math.min(N - 1, maxCy + boundaryPad);
  if (maxCx < minCx || maxCy < minCy) return;

  for (let cy = minCy; cy < maxCy; cy++) {
    for (let cx = minCx; cx < maxCx; cx++) {
      const a = cellIdx(cx, cy), b = cellIdx(cx+1, cy+1);
      const c = cellIdx(cx+1, cy), d = cellIdx(cx, cy+1);
      if (tempBoundary[a] && tempBoundary[b] && (tailBoundary[a] || tailBoundary[b])) {
        if (!tempBoundary[c]) tempBoundary[c] = 1;
        if (!tempBoundary[d]) tempBoundary[d] = 1;
      }
      const e = cellIdx(cx+1, cy), f = cellIdx(cx, cy+1);
      const g = cellIdx(cx, cy), h = cellIdx(cx+1, cy+1);
      if (tempBoundary[e] && tempBoundary[f] && (tailBoundary[e] || tailBoundary[f])) {
        if (!tempBoundary[g]) tempBoundary[g] = 1;
        if (!tempBoundary[h]) tempBoundary[h] = 1;
      }
    }
  }

  // Global flood-fill from map edges
  const outside = new Uint8Array(N * N);
  const queue = [];
  const tryAdd = (cx, cy) => {
    if (cx < 0 || cx >= N || cy < 0 || cy >= N) return;
    const gi = cellIdx(cx, cy);
    if (outside[gi] || tempBoundary[gi]) return;
    outside[gi] = 1; queue.push(cx, cy);
  };
  for (let cx = 0; cx < N; cx++) { tryAdd(cx, 0); tryAdd(cx, N - 1); }
  for (let cy = 1; cy < N - 1; cy++) { tryAdd(0, cy); tryAdd(N - 1, cy); }

  const dx4 = [1,-1,0,0], dy4 = [0,0,1,-1];
  let qi = 0;
  while (qi < queue.length) {
    const cx = queue[qi++], cy = queue[qi++];
    for (let d = 0; d < 4; d++) tryAdd(cx + dx4[d], cy + dy4[d]);
  }

  let newCells = 0;
  for (let gi = 0; gi < N * N; gi++) {
    if (!outside[gi] && ownershipGrid[gi] !== player.id) {
      ownershipGrid[gi] = player.id; newCells++;
    }
  }
  player.capturedArea += newCells;

  for (const pt of player.tailPath) {
    const { cx, cy } = cellXY(pt.wx, pt.wy);
    if (cx >= 0 && cx < N && cy >= 0 && cy < N) tailGrid[cellIdx(cx, cy)] &= ~(1 << player.id);
  }
  player.tailPath = []; player.tailActive = false;
}

function checkEliminations(players, tailGrid, ownershipGrid, cfgOverride) {
  const cfg = cfgOverride || CONFIG;
  for (const mover of players) {
    if (!mover.alive) continue;
    const { cx, cy } = cellXY(mover.wx, mover.wy);
    if (cx < 0 || cx >= CONFIG.MAP_CELLS || cy < 0 || cy >= CONFIG.MAP_CELLS) continue;
    const bits = tailGrid[cellIdx(cx, cy)];
    if (!bits) continue;
    for (const victim of players) {
      if (!victim.alive || !victim.tailActive) continue;
      if (!(bits & (1 << victim.id))) continue;
      if (mover.id === victim.id && !cfg.allowSelfTailDeath) continue;
      victim.alive = false; victim.tailActive = false;
      for (const pt of victim.tailPath) {
        const { cx: tx, cy: ty } = cellXY(pt.wx, pt.wy);
        if (tx >= 0 && tx < CONFIG.MAP_CELLS && ty >= 0 && ty < CONFIG.MAP_CELLS)
          tailGrid[cellIdx(tx, ty)] &= ~(1 << victim.id);
      }
      victim.tailPath = [];
    }
  }
}

// ── Camera helpers ───────────────────────────────────────────────────
function worldToScreen(wx, wy, camera) {
  const scale = camera.screenW / camera.vw;
  return { sx: (wx - camera.wx) * scale, sy: (wy - camera.wy) * scale };
}

/* ===================================================================
   TEST HARNESS
=================================================================== */
const results = [];
let passCount = 0, failCount = 0;

function assert(label, condition) {
  const ok = !!condition;
  results.push({ label, ok });
  if (ok) passCount++; else failCount++;
}

function approx(a, b, eps = 1e-9) { return Math.abs(a - b) < eps; }

/* ===================================================================
   SECTION B — Config, State, Spawn
=================================================================== */
(function testB() {
  // B1: All 16 direction vectors have unit length
  for (let i = 0; i < 16; i++) {
    const { dx, dy } = DIRECTIONS[i];
    assert(`B1: DIRECTIONS[${i}] has unit length`, approx(Math.hypot(dx, dy), 1, 1e-10));
  }

  // B2: Opposite pairs sum to zero
  for (let i = 0; i < 16; i++) {
    const a = DIRECTIONS[i], b = DIRECTIONS[(i + 8) % 16];
    assert(`B2: DIRECTIONS[${i}] and [${(i+8)%16}] are exact opposites`,
      approx(a.dx + b.dx, 0, 1e-9) && approx(a.dy + b.dy, 0, 1e-9));
  }

  // B3: initState returns 4 players all alive and tailActive=false
  const s = initState();
  assert('B3: initState returns 4 players', s.players.length === 4);
  assert('B3: all players alive',           s.players.every(p => p.alive));
  assert('B3: all players tailActive=false', s.players.every(p => !p.tailActive));

  // B4: All player positions within map bounds
  for (const p of s.players) {
    assert(`B4: player ${p.id} pos in bounds`,
      p.wx >= 0 && p.wx <= WORLD_SIZE && p.wy >= 0 && p.wy <= WORLD_SIZE);
  }

  // B5: Each player's initial heading points toward center
  for (const p of s.players) {
    const dir = DIRECTIONS[p.headingIndex];
    const toCx = WORLD_SIZE / 2 - p.wx;
    const toCy = WORLD_SIZE / 2 - p.wy;
    const dot = dir.dx * toCx + dir.dy * toCy;
    assert(`B5: player ${p.id} heading toward center (dot > 0)`, dot > 0);
  }

  // B6: Seeded cells owned by correct player
  for (const p of s.players) {
    const { cx, cy } = cellXY(p.wx, p.wy);
    assert(`B6: player ${p.id} spawn cell is owned by them`,
      s.ownershipGrid[cellIdx(cx, cy)] === p.id);
  }

  // B7: Total seeded cells — corners must not overlap
  const seedCount = [0, 0, 0, 0];
  for (let i = 0; i < s.ownershipGrid.length; i++) {
    const id = s.ownershipGrid[i];
    if (id >= 0) seedCount[id]++;
  }
  const expectedSeed = (2 * CONFIG.SEED_HALF + 1) * (2 * CONFIG.SEED_HALF + 1);
  for (let i = 0; i < 4; i++) {
    assert(`B7: player ${i} seeded exactly ${expectedSeed} cells`, seedCount[i] === expectedSeed);
  }
})();

/* ===================================================================
   SECTION C — Direction / Input logic
=================================================================== */
(function testC() {
  // C1: 16 exact angles map to correct index
  for (let i = 0; i < 16; i++) {
    const a = i * (2 * Math.PI / 16);
    assert(`C1: angleToHeadingIndex for heading ${i}`, angleToHeadingIndex(a) === i);
  }

  // C2: Midpoint angles round to nearest index
  for (let i = 0; i < 16; i++) {
    const mid = (i + 0.5) * (2 * Math.PI / 16);
    const result = angleToHeadingIndex(mid);
    // should round to i or i+1 (either is acceptable at exact midpoint due to float rounding)
    assert(`C2: midpoint angle between ${i} and ${(i+1)%16} gives adjacent index`,
      result === i || result === (i + 1) % 16);
  }

  // C3: Double-back guard
  for (let cur = 0; cur < 16; cur++) {
    const opp = (cur + 8) % 16;
    assert(`C3: isOppositeHeading(${cur}, ${opp})`, isOppositeHeading(cur, opp));
    assert(`C3: NOT isOppositeHeading(${cur}, ${(cur+1)%16})`, !isOppositeHeading(cur, (cur + 1) % 16));
  }

  // C4: Cardinal angles map to correct indices (East=0, South=4, West=8, North=12)
  assert('C4: East  (0°)    → index 0',  angleToHeadingIndex(0)               === 0);
  assert('C4: South (90°)   → index 4',  angleToHeadingIndex(Math.PI / 2)     === 4);
  assert('C4: West  (180°)  → index 8',  angleToHeadingIndex(Math.PI)         === 8);
  assert('C4: North (270°)  → index 12', angleToHeadingIndex(3 * Math.PI / 2) === 12);

  // C5: 45° (SE diagonal) → index 2
  assert('C5: SE diagonal (45°) → index 2', angleToHeadingIndex(Math.PI / 4) === 2);

  // C6: Negative angle normalises correctly (−90° == 270° → index 12)
  assert('C6: −90° normalises to index 12', angleToHeadingIndex(-Math.PI / 2) === 12);
})();

/* ===================================================================
   SECTION D — Simulation core
=================================================================== */
(function testD() {
  const s = initState();

  // D1: Movement magnitude equals PLAYER_SPEED
  const p = s.players[0];
  const wx0 = p.wx, wy0 = p.wy;
  movePlayer(p);
  const moved = Math.hypot(p.wx - wx0, p.wy - wy0);
  assert('D1: player moves exactly PLAYER_SPEED per tick',
    approx(moved, CONFIG.PLAYER_SPEED, 0.001));

  // D2: Position clamped at edge
  const edgePlayer = { wx: WORLD_SIZE - 0.1, wy: WORLD_SIZE / 2,
                        headingIndex: 0, speed: CONFIG.PLAYER_SPEED, id: 0 };
  for (let i = 0; i < 5; i++) movePlayer(edgePlayer);
  assert('D2: position clamped at right map edge', edgePlayer.wx <= WORLD_SIZE);

  // D3: isInsideOwnTerritory checks
  const s2 = initState();
  const user = s2.players[0];
  assert('D3: player inside seed territory → returns true',
    isInsideOwnTerritory(user, s2.ownershipGrid));

  // Move player well outside territory
  user.wx = WORLD_SIZE / 2;
  user.wy = WORLD_SIZE / 2;
  assert('D3: player at map center → not inside own territory (center is unowned)',
    !isInsideOwnTerritory(user, s2.ownershipGrid));

  // D4: tailActive becomes true after stepping outside
  const s3 = initState();
  const u3 = s3.players[0];
  u3.wx = WORLD_SIZE / 2; u3.wy = WORLD_SIZE / 2; // outside territory
  updateTail(u3, s3.ownershipGrid, s3.tailGrid);
  assert('D4: tailActive=true after stepping outside own territory', u3.tailActive);

  // D5: tailActive becomes false when re-entering territory
  const s4 = initState();
  const u4 = s4.players[0];
  // Force tail active
  u4.tailActive = true;
  u4.tailPath = [{ wx: u4.wx, wy: u4.wy }];
  // Player is already inside territory; updateTail should see inside = true → leave state unchanged
  // captureLoop checks the inside condition; updateTail just won't grow the tail
  updateTail(u4, s4.ownershipGrid, s4.tailGrid);
  // tailActive stays true until captureLoop runs; seed state: player is inside
  // updateTail returns early without clearing (capture does that). Test that it doesn't grow path.
  const pathLenBefore = u4.tailPath.length;
  updateTail(u4, s4.ownershipGrid, s4.tailGrid);
  assert('D5: tail path does not grow while player inside own territory', u4.tailPath.length === pathLenBefore);

  // D6: Tail path grows while outside
  const s5 = initState();
  const u5 = s5.players[0];
  u5.wx = WORLD_SIZE / 2; u5.wy = WORLD_SIZE / 2;
  for (let i = 0; i < 20; i++) {
    movePlayer(u5);
    updateTail(u5, s5.ownershipGrid, s5.tailGrid);
  }
  assert('D6: tail path accumulates points while outside territory', u5.tailPath.length > 1);

  // D7: No tail path accumulation inside territory
  const s6 = initState();
  const u6 = s6.players[0]; // starts inside own territory
  for (let i = 0; i < 5; i++) {
    updateTail(u6, s6.ownershipGrid, s6.tailGrid);
  }
  assert('D7: no tail path while inside territory', u6.tailPath.length === 0 && !u6.tailActive);
})();

/* ===================================================================
   SECTION E — Capture system
=================================================================== */
(function testE() {
  // E1: Straight exit then straight return closes loop
  const s = initState();
  const u = s.players[0];
  // User starts in top-left corner territory; move them right until outside, then return
  // Find right boundary of seeded region
  const { cx: cx0, cy: cy0 } = cellXY(u.wx, u.wy);
  const seedRight = (cx0 + CONFIG.SEED_HALF + 2) * CONFIG.CELL_SIZE; // just outside seed

  u.wx = seedRight; // now outside territory
  u.tailActive = true;
  u.tailPath = [];

  // Simulate moving diagonally to form a small loop and return
  // Build a square loop: go right 20 cells, down 20 cells, left 20 cells, back to boundary
  const C = CONFIG.CELL_SIZE;
  const startX = u.wx, startY = u.wy;

  // Manually construct a fully-closed rectangular tail path (all 4 sides)
  // A complete closed loop is self-sufficient; no gap to territory needed.
  const path = [];
  for (let i = 0; i <= 20; i++) path.push({ wx: startX + i * C, wy: startY });           // top
  for (let i = 1; i <= 20; i++) path.push({ wx: startX + 20 * C, wy: startY + i * C }); // right
  for (let i = 19; i >= 0; i--) path.push({ wx: startX + i * C, wy: startY + 20 * C }); // bottom
  for (let i = 19; i >= 1; i--) path.push({ wx: startX, wy: startY + i * C });           // left

  u.tailPath = path;
  // Stamp all tail cells
  for (const pt of path) {
    const { cx, cy } = cellXY(pt.wx, pt.wy);
    if (cx >= 0 && cx < CONFIG.MAP_CELLS && cy >= 0 && cy < CONFIG.MAP_CELLS)
      s.tailGrid[cellIdx(cx, cy)] |= (1 << u.id);
  }

  // Place player back inside own territory to trigger closure
  u.wx = u.wy = CONFIG.SEED_HALF * C; // inside seed corner

  assert('E1: closure detected (player inside territory with active tail)', isInsideOwnTerritory(u, s.ownershipGrid));
  captureLoop(u, s.ownershipGrid, s.tailGrid);
  assert('E1: tailActive cleared after capture', !u.tailActive);
  assert('E1: tailPath cleared after capture', u.tailPath.length === 0);

  // E2: Interior cells of rectangular tail are captured
  // Check some interior cells of the rectangle we drew
  const checkCx = Math.floor((startX + 10 * C) / C);
  const checkCy = Math.floor((startY + 10 * C) / C);
  if (checkCx >= 0 && checkCx < CONFIG.MAP_CELLS && checkCy >= 0 && checkCy < CONFIG.MAP_CELLS) {
    assert('E2: interior cells of rectangular loop are owned', s.ownershipGrid[cellIdx(checkCx, checkCy)] === u.id);
  } else {
    assert('E2: interior cell coords in bounds (skipped)', true);
  }

  // E3: capturedArea incremented
  const seedArea = (2 * CONFIG.SEED_HALF + 1) * (2 * CONFIG.SEED_HALF + 1);
  assert('E3: capturedArea > seedArea after capture', u.capturedArea > seedArea);

  // E4: Flood-fill does not overwrite cells already owned by player
  // All cells that were already owned should still be owned by same player
  const s7 = initState();
  const u7 = s7.players[0];
  const ownedBefore = [];
  for (let i = 0; i < s7.ownershipGrid.length; i++) {
    if (s7.ownershipGrid[i] === 0) ownedBefore.push(i);
  }
  // Run a capture that doesn't touch those cells
  u7.tailPath = [{ wx: 300, wy: 300 }, { wx: 320, wy: 300 }]; // minimal 2-point path, no valid closure
  captureLoop(u7, s7.ownershipGrid, s7.tailGrid); // should do nothing (player not inside territory at 300,300)

  let ownedAfterUnchanged = true;
  for (const gi of ownedBefore) {
    if (s7.ownershipGrid[gi] !== 0) { ownedAfterUnchanged = false; break; }
  }
  assert('E4: previously owned cells not overwritten during failed capture', ownedAfterUnchanged);

  // E5: Loop with a U-shaped turn still captures enclosed area
  const s8 = initState();
  const u8 = s8.players[0];
  const { cx: sx0 } = cellXY(u8.wx, u8.wy);
  const startUx = (sx0 + CONFIG.SEED_HALF + 4) * C; // outside own seed
  const startUy = u8.wy;

  const uPath = [];
  const pushH = (x0, x1, y) => {
    const step = x1 >= x0 ? 1 : -1;
    for (let i = x0; i !== x1 + step; i += step) uPath.push({ wx: i * C, wy: y * C });
  };
  const pushV = (x, y0, y1) => {
    const step = y1 >= y0 ? 1 : -1;
    for (let i = y0; i !== y1 + step; i += step) uPath.push({ wx: x * C, wy: i * C });
  };

  const ux = Math.floor(startUx / C);
  const uy = Math.floor(startUy / C);
  // Outer rectangle with an inward U-turn notch on the left wall.
  pushH(ux, ux + 28, uy);          // top
  pushV(ux + 28, uy + 1, uy + 20); // right
  pushH(ux + 27, ux, uy + 20);     // bottom
  pushV(ux, uy + 19, uy + 8);      // up left wall
  pushH(ux + 1, ux + 6, uy + 8);   // notch inward
  pushV(ux + 6, uy + 9, uy + 13);  // notch down
  pushH(ux + 5, ux, uy + 13);      // notch back left
  pushV(ux, uy + 12, uy);          // close back to start

  u8.tailActive = true;
  u8.tailPath = uPath;
  for (const pt of uPath) {
    const { cx, cy } = cellXY(pt.wx, pt.wy);
    if (cx >= 0 && cx < CONFIG.MAP_CELLS && cy >= 0 && cy < CONFIG.MAP_CELLS)
      s8.tailGrid[cellIdx(cx, cy)] |= (1 << u8.id);
  }

  // Re-enter own territory to trigger capture resolution.
  u8.wx = u8.wy = CONFIG.SEED_HALF * C;
  captureLoop(u8, s8.ownershipGrid, s8.tailGrid);

  const interiorCx = ux + 14;
  const interiorCy = uy + 10;
  assert('E5: interior cell of U-turn loop captured', s8.ownershipGrid[cellIdx(interiorCx, interiorCy)] === u8.id);

  // E6: Tight diagonal-adjacent notch does not leak fill to outside
  const notchNearCx = ux + 2;
  const notchNearCy = uy + 11;
  assert('E6: cells near tight U-notch are still captured', s8.ownershipGrid[cellIdx(notchNearCx, notchNearCy)] === u8.id);
})();

// E7: Pocket enclosed progressively by two separate captures is filled
// Reproduces the real-world bug where a strip between two adjacent loops
// was never captured because each individual loop's bbox excluded the gap.
(function testE7() {
  const s = initState();
  const u = s.players[0];
  const CS = CONFIG.CELL_SIZE;
  const N = CONFIG.MAP_CELLS;

  // Build a rectangular territory block at cx=10..30, cy=20..40
  for (let cx = 10; cx <= 30; cx++)
    for (let cy = 20; cy <= 40; cy++)
      s.ownershipGrid[cellIdx(cx, cy)] = u.id;

  // First loop: extends south from cy=40 to cy=50, cx=10..20
  // Gap row at cy=41..43, cx=21..29 should end up enclosed after both loops
  for (let cx = 21; cx <= 29; cx++)
    for (let cy = 41; cy <= 43; cy++)
      s.ownershipGrid[cellIdx(cx, cy)] = -1; // explicitly unowned gap

  // Simulate the first loop: player traces a path that closes on the south side
  // Path: start inside at (20,40), go south to (20,50), east to (30,50), north to (30,40), back inside
  u.tailActive = true;
  u.tailPath = [];
  for (let cy = 40; cy <= 50; cy++) u.tailPath.push({ wx: 20 * CS, wy: cy * CS });
  for (let cx = 20; cx <= 30; cx++) u.tailPath.push({ wx: cx * CS, wy: 50 * CS });
  for (let cy = 50; cy >= 40; cy--) u.tailPath.push({ wx: 30 * CS, wy: cy * CS });
  u.tailPath.push({ wx: 25 * CS, wy: 40 * CS }); // return to territory
  u.wx = 25 * CS; u.wy = 40 * CS;
  captureLoop(u, s.ownershipGrid, s.tailGrid);

  // Now the gap cx=21..29, cy=41..43 should be enclosed by:
  //   north: cy=40 (original territory + new south strip cx=20..30,cy=40)
  //   south: cy=50 row just captured
  //   west:  cx=20 column just captured
  //   east:  cx=30 column just captured
  // Global flood-fill must fill it; bbox-based fill would miss it
  // because the gap was never INSIDE the single capture's bbox interior.
  const gapCx = 25, gapCy = 42;
  assert('E7: pocket enclosed by single loop is captured', s.ownershipGrid[cellIdx(gapCx, gapCy)] === u.id);

  // Also verify cells well outside the territory are still unowned
  assert('E7: cells outside territory not incorrectly captured', s.ownershipGrid[cellIdx(300, 300)] !== u.id);
})();

/* ===================================================================
   SECTION F — Elimination & match end
=================================================================== */
(function testF() {
  // F1: Player B with tail eliminated when mover steps on B's tail cell
  const s = initState();
  const [userP, cpu1] = s.players;

  // Give cpu1 a tail at a specific cell
  const tailWx = 200, tailWy = 200;
  cpu1.tailActive = true;
  cpu1.tailPath = [{ wx: tailWx, wy: tailWy }];
  s.tailGrid[cellIdx(Math.floor(tailWx / CONFIG.CELL_SIZE), Math.floor(tailWy / CONFIG.CELL_SIZE))] |= (1 << cpu1.id);

  // Place user on that cell
  userP.wx = tailWx; userP.wy = tailWy;

  checkEliminations(s.players, s.tailGrid, s.ownershipGrid);
  assert('F1: cpu1 eliminated when user steps on its tail', !cpu1.alive);
  assert('F1: user remains alive', userP.alive);

  // F2: Player with NO tail not eliminated when mover overlaps position
  const s2 = initState();
  const [u2, c2] = s2.players;
  c2.tailActive = false; // no tail
  u2.wx = c2.wx; u2.wy = c2.wy; // overlap position
  checkEliminations(s2.players, s2.tailGrid, s2.ownershipGrid);
  assert('F2: cpu with no tail not eliminated on position overlap', c2.alive);

  // F3: Self-tail death disabled by default
  const s3 = initState();
  const u3 = s3.players[0];
  u3.tailActive = true;
  u3.tailPath = [{ wx: u3.wx, wy: u3.wy }];
  s3.tailGrid[cellIdx(Math.floor(u3.wx / CONFIG.CELL_SIZE), Math.floor(u3.wy / CONFIG.CELL_SIZE))] |= (1 << u3.id);
  checkEliminations(s3.players, s3.tailGrid, s3.ownershipGrid, { allowSelfTailDeath: false });
  assert('F3: self-tail death disabled → user not eliminated', u3.alive);

  // F4: Self-tail death enabled
  const s4 = initState();
  const u4 = s4.players[0];
  u4.tailActive = true;
  u4.tailPath = [{ wx: u4.wx + 10, wy: u4.wy }]; // tail at adjacent cell
  const { cx: tx, cy: ty } = cellXY(u4.wx + 10, u4.wy);
  if (tx >= 0 && tx < CONFIG.MAP_CELLS && ty >= 0 && ty < CONFIG.MAP_CELLS) {
    s4.tailGrid[cellIdx(tx, ty)] |= (1 << u4.id);
    u4.wx = (tx * CONFIG.CELL_SIZE) + 1; u4.wy = ty * CONFIG.CELL_SIZE + 1;
    checkEliminations(s4.players, s4.tailGrid, s4.ownershipGrid, { allowSelfTailDeath: true });
    assert('F4: self-tail death enabled → user eliminated', !u4.alive);
  } else {
    assert('F4: self-tail coords in bounds (skipped)', true);
  }

  // F5: End condition — user eliminated
  const s5 = initState();
  s5.phase = 'running';
  s5.players[0].alive = false;
  // checkMatchEnd inline equivalent
  const user5 = s5.players[0];
  const allCpuDead5 = s5.players.filter(p => p.type === 'cpu').every(p => !p.alive);
  if (!user5.alive || allCpuDead5) {
    s5.phase = 'ended';
    let best5 = s5.players.reduce((a, b) => b.capturedArea > a.capturedArea ? b : a);
    s5.winnerId = best5.id;
  }
  assert('F5: phase=ended when user eliminated', s5.phase === 'ended');

  // F6: End condition — all CPUs dead
  const s6 = initState();
  s6.phase = 'running';
  for (const p of s6.players) if (p.type === 'cpu') p.alive = false;
  const user6 = s6.players[0];
  const allCpuDead6 = s6.players.filter(p => p.type === 'cpu').every(p => !p.alive);
  if (!user6.alive || allCpuDead6) { s6.phase = 'ended'; }
  assert('F6: phase=ended when all CPUs eliminated', s6.phase === 'ended');
  assert('F6: user still alive when CPUs all die', user6.alive);

  // F7: Winner computed correctly (most territory)
  const s7 = initState();
  s7.players[0].capturedArea = 500;
  s7.players[1].capturedArea = 100;
  s7.players[2].capturedArea = 200;
  s7.players[3].capturedArea = 50;
  const winner7 = s7.players.reduce((a, b) => b.capturedArea > a.capturedArea ? b : a);
  assert('F7: winner is player with most territory', winner7.id === 0);
})();

/* ===================================================================
   SECTION G — Camera helpers
=================================================================== */
(function testG() {
  const cam = { wx: 100, wy: 200, vw: 400, vh: 300, screenW: 800, screenH: 600 };

  // G1: worldToScreen — camera origin maps to (0,0)
  const pt0 = worldToScreen(100, 200, cam);
  assert('G1: worldToScreen — camera origin → (0,0)',
    approx(pt0.sx, 0) && approx(pt0.sy, 0));

  // G2: worldToScreen — one vw to the right maps to (screenW, 0)
  const pt1 = worldToScreen(100 + 400, 200, cam);
  assert('G2: worldToScreen — one vw right → (screenW, 0)',
    approx(pt1.sx, 800) && approx(pt1.sy, 0));

  // G3: Camera dead-zone — user within dead-zone, camera does not move
  const cam2 = { wx: 0, wy: 0, vw: 800, vh: 600, screenW: 800, screenH: 600 };
  const player = {
    wx: 400, wy: 300, // center of viewport
    headingIndex: 0, alive: true, speed: CONFIG.PLAYER_SPEED,
  };
  const cam2Wx0 = cam2.wx, cam2Wy0 = cam2.wy;
  // Manually run the dead-zone check (same logic as cameraUpdate without G)
  function testCameraUpdate(cam, user) {
    const dw = cam.vw * CONFIG.DEAD_ZONE_FRAC;
    const dh = cam.vh * CONFIG.DEAD_ZONE_FRAC;
    const dzL = cam.wx + (cam.vw - dw) / 2;
    const dzR = dzL + dw;
    const dzT = cam.wy + (cam.vh - dh) / 2;
    const dzB = dzT + dh;
    if (user.wx < dzL || user.wx > dzR || user.wy < dzT || user.wy > dzB) {
      const dir = DIRECTIONS[user.headingIndex];
      const tWx = user.wx + dir.dx * CONFIG.LOOK_AHEAD - cam.vw / 2;
      const tWy = user.wy + dir.dy * CONFIG.LOOK_AHEAD - cam.vh / 2;
      cam.wx += (tWx - cam.wx) * CONFIG.PAN_LERP;
      cam.wy += (tWy - cam.wy) * CONFIG.PAN_LERP;
    }
  }
  for (let i = 0; i < 10; i++) testCameraUpdate(cam2, player);
  assert('G3: camera does not move when user inside dead-zone',
    approx(cam2.wx, cam2Wx0) && approx(cam2.wy, cam2Wy0));

  // G4: Camera pans when user exits dead-zone
  const cam3 = { wx: 0, wy: 0, vw: 800, vh: 600, screenW: 800, screenH: 600 };
  const panPlayer = { wx: 50, wy: 300, headingIndex: 0, alive: true }; // near left edge (outside dead-zone)
  for (let i = 0; i < 5; i++) testCameraUpdate(cam3, panPlayer);
  assert('G4: camera wx shifts when user is outside dead-zone leftward',
    cam3.wx !== 0);
})();

/* ===================================================================
   SECTION H — CPU logic
=================================================================== */
(function testH() {
  const s = initState();

  // H1: CPU expanding (no tail) → heading has component away from own centroid
  const cpu = s.players[1]; // top-right corner
  // Compute centroid of cpu's seeded cells (approximate)
  const seedCx = Math.floor((WORLD_SIZE - (CONFIG.SEED_HALF * CONFIG.CELL_SIZE + CONFIG.PLAYER_RADIUS * 2)) / CONFIG.CELL_SIZE);
  const seedCy = Math.floor(CONFIG.SEED_HALF); // approximate
  const centW = cellToWorld(seedCx, seedCy);
  const awayAngle = Math.atan2(cpu.wy - centW.wy, cpu.wx - centW.wx);
  const awayIdx = angleToHeadingIndex(awayAngle);
  // The CPU's heading should align reasonably with "away from centroid"
  // We just check that the initial heading toward center is valid (not opposite to center)
  assert('H1: CPU initial heading is valid (not reverse of itself)', !isOppositeHeading(cpu.headingIndex, cpu.headingIndex));

  // H2: All players have identical speed
  const speeds = s.players.map(p => p.speed);
  assert('H2: all players have same speed', speeds.every(sp => sp === speeds[0]));

  // H3: CPU elimination uses same logic as user
  const s2 = initState();
  const u2 = s2.players[0];
  const c2 = s2.players[1];
  const tailWx = 200, tailWy = 200;
  u2.tailActive = true;
  u2.tailPath = [{ wx: tailWx, wy: tailWy }];
  s2.tailGrid[cellIdx(Math.floor(tailWx / CONFIG.CELL_SIZE), Math.floor(tailWy / CONFIG.CELL_SIZE))] |= (1 << u2.id);
  c2.wx = tailWx; c2.wy = tailWy;
  checkEliminations(s2.players, s2.tailGrid, s2.ownershipGrid);
  assert('H3: user with tail eliminated by CPU stepping on user tail', !u2.alive);
  assert('H3: CPU remains alive in scenario', c2.alive);

  // H4: CPU can capture territory in simulated run (functional/integration check)
  // Run 500 ticks of pure simulation to verify CPU can actually make a capture
  const s3 = initState();
  s3.phase = 'running';
  const initialArea = s3.players[1].capturedArea;

  function cpuTickTest(cpu) {
    if (!cpu.alive) return;
    const N = CONFIG.MAP_CELLS;
    const step = Math.max(1, Math.floor(N / 20));
    let sumX = 0, sumY = 0, cnt = 0, bestDist = Infinity, nearWx = cpu.wx, nearWy = cpu.wy;
    for (let cy = 0; cy < N; cy += step) {
      for (let cx = 0; cx < N; cx += step) {
        if (s3.ownershipGrid[cellIdx(cx, cy)] !== cpu.id) continue;
        const w = cellToWorld(cx, cy);
        sumX += w.wx; sumY += w.wy; cnt++;
        const d = Math.hypot(w.wx - cpu.wx, w.wy - cpu.wy);
        if (d < bestDist) { bestDist = d; nearWx = w.wx; nearWy = w.wy; }
      }
    }
    let tx, ty;
    if (!cpu.tailActive) {
      if (cnt > 0) { tx = cpu.wx + (cpu.wx - sumX/cnt)*2; ty = cpu.wy + (cpu.wy - sumY/cnt)*2; }
      else { tx = WORLD_SIZE/2; ty = WORLD_SIZE/2; }
    } else { tx = nearWx; ty = nearWy; }
    const angle = Math.atan2(ty - cpu.wy, tx - cpu.wx);
    const desired = angleToHeadingIndex(angle);
    if (!isOppositeHeading(cpu.headingIndex, desired)) cpu.headingIndex = desired;
  }

  for (let t = 0; t < 500; t++) {
    for (const p of s3.players) if (p.type === 'cpu') cpuTickTest(p);
    for (const p of s3.players) if (p.alive) movePlayer(p);
    for (const p of s3.players) if (p.alive) updateTail(p, s3.ownershipGrid, s3.tailGrid);
    for (const p of s3.players) {
      if (p.alive && p.tailActive && p.tailPath.length > 1) captureLoop(p, s3.ownershipGrid, s3.tailGrid);
    }
    checkEliminations(s3.players, s3.tailGrid, s3.ownershipGrid);
  }
  const anyCapture = s3.players.filter(p => p.type === 'cpu').some(p => p.capturedArea > initialArea);
  assert('H4: at least one CPU captured territory in 500-tick run', anyCapture);
})();

      ${r.label}

});

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkgrid tests</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    #results { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    #summary { font-weight: 700; margin: 10px 0; font-size: 15px; }
    .ok { color: #2f6b48; }
    .bad { color: #a33b28; }
    .row { padding: 2px 0; }
    .detail { color: #777; }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <h2>Linkgrid tests</h2>
    <p class="note">
      The same suite the Node runner uses (<code>node test/run.js</code>), minus the
      solver pass, which is Node-only because it is slow.
    </p>
    <div id="summary">Running…</div>
    <div id="results"></div>
  </main>
  <div id="site-footer"></div>

  <script src="/inc/include.js"></script>
  <script src="./engine.js?v=3"></script>
  <script src="./tools/quality.js?v=3"></script>
  <script src="./tools/routes.js?v=3"></script>
  <script src="./puzzles/index.js?v=3"></script>
  <script src="./puzzles/5.js?v=3"></script>
  <script src="./puzzles/6.js?v=3"></script>
  <script src="./puzzles/7.js?v=3"></script>
  <script src="./puzzles/8.js?v=3"></script>
  <script src="./puzzles/9.js?v=3"></script>
  <script src="./puzzles/10.js?v=3"></script>
  <script src="./solutions/5.js?v=3"></script>
  <script src="./solutions/6.js?v=3"></script>
  <script src="./solutions/7.js?v=3"></script>
  <script src="./solutions/8.js?v=3"></script>
  <script src="./solutions/9.js?v=3"></script>
  <script src="./solutions/10.js?v=3"></script>
  <script src="./test/suite.js?v=3"></script>
  <script>
    (function () {
      var outcome = LinkgridTests.run({
        Engine: LinkgridEngine,
        Quality: LinkgridQuality,
        Routes: LinkgridRoutes,
        puzzles: LINKGRID_PUZZLES,
        solutions: LINKGRID_SOLUTIONS,
        packs: LINKGRID_PACKS,
      });

      var summary = document.getElementById('summary');
      summary.textContent = outcome.passed + ' passed, ' + outcome.failed + ' failed';
      summary.className = outcome.failed ? 'bad' : 'ok';

      document.getElementById('results').innerHTML = outcome.results.map(function (result) {
        return '<div class="row ' + (result.ok ? 'ok' : 'bad') + '">' +
          (result.ok ? '✓' : '✗') + ' ' + result.label +
          (result.detail ? ' <span class="detail">— ' + result.detail + '</span>' : '') +
          '</div>';
      }).join('');
    })();
  </script>
</body>
</html>

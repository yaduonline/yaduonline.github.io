<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linkgrid Puzzle Solver</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #e0e0e0; padding: 20px; }
    h1 { color: #4ec9b0; }
    .ok { color: #6a9955; }
    .bad { color: #f48771; }
    .row { margin: 4px 0; font-size: 12px; }
  </style>
</head>
<body>
    <div id="site-header"></div>
  <h1>Linkgrid Puzzle Validator</h1>
  <div id="log"></div>
  <script>
    const log = (msg, type='') => {
      const el = document.getElementById('log');
      const cls = type === 'ok' ? 'ok' : type === 'bad' ? 'bad' : '';
      el.innerHTML += `<div class="row ${cls}">${msg}</div>`;
    };

    // Core puzzle helpers
    function neighbors(a, b) {
      return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
    }

    function solvePuzzle(puzzleConfig) {
      const n = puzzleConfig.size;
      const endpoints = new Map();
      const owner = Array.from({ length: n }, () => Array(n).fill(-1));
      const paths = new Map();
      
      for (const e of puzzleConfig.endpoints) {
        endpoints.set(e.color, [e.a, e.b]);
        owner[e.a[0]][e.a[1]] = e.color;
        owner[e.b[0]][e.b[1]] = e.color;
        paths.set(e.color, [e.a.slice()]);
      }

      function isEndpoint(color, r, c) {
        const pair = endpoints.get(color);
        if (!pair) return false;
        return (pair[0][0] === r && pair[0][1] === c) || (pair[1][0] === r && pair[1][1] === c);
      }

      function canStep(color, r, c) {
        if (r < 0 || r >= n || c < 0 || c >= n) return false;
        const path = paths.get(color) || [];
        const last = path[path.length - 1];
        if (!last) return false;
        if (!neighbors(last, [r, c])) return false;

        // Check if already in path
        const idx = path.findIndex(([pr, pc]) => pr === r && pc === c);
        if (idx >= 0) return idx === path.length - 2; // can only backtrack one

        // Check endpoint closure rule
        if (isEndpoint(color, last[0], last[1]) && path.length > 1) return false;

        // Check occupancy
        const occ = owner[r][c];
        return occ === -1 || occ === color;
      }

      function step(color, r, c) {
        const path = paths.get(color) || [];
        const last = path[path.length - 1];
        if (!neighbors(last, [r, c])) return false;

        const idx = path.findIndex(([pr, pc]) => pr === r && pc === c);
        if (idx >= 0) {
          for (let i = path.length - 1; i > idx; i--) {
            const [rr, cc] = path[i];
            if (!isEndpoint(color, rr, cc)) owner[rr][cc] = -1;
            path.pop();
          }
          return true;
        }

        if (isEndpoint(color, last[0], last[1]) && path.length > 1) return false;

        const occ = owner[r][c];
        if (occ !== -1 && occ !== color) return false;

        path.push([r, c]);
        owner[r][c] = color;
        return true;
      }

      function undo(color) {
        const path = paths.get(color) || [];
        if (path.length <= 1) return false;
        const [r, c] = path.pop();
        if (!isEndpoint(color, r, c)) owner[r][c] = -1;
        return true;
      }

      function isSolved() {
        for (const [color, pair] of endpoints.entries()) {
          const path = paths.get(color) || [];
          if (path.length < 2) return false;
          const [ar, ac] = pair[0], [br, bc] = pair[1];
          const first = path[0], last = path[path.length - 1];
          const match = (first[0] === ar && first[1] === ac && last[0] === br && last[1] === bc) ||
                        (first[0] === br && first[1] === bc && last[0] === ar && last[1] === ac);
          if (!match) return false;
        }
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (owner[r][c] < 0) return false;
        return true;
      }

      function solve(colors, colorIdx = 0) {
        if (colorIdx === colors.length) return isSolved();
        const color = colors[colorIdx];
        const pair = endpoints.get(color);
        if (!pair) return false;

        function dfs(depth = 0) {
          if (depth > 200) return false; // Prevent infinite loops
          const path = paths.get(color);
          const last = path[path.length - 1];
          const [targetR, targetC] = path[0][0] === pair[0][0] && path[0][1] === pair[0][1] ? pair[1] : pair[0];

          if (last[0] === targetR && last[1] === targetC && path.length > 1) {
            return solve(colors, colorIdx + 1);
          }

          // Try all 4 neighbors
          const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
          for (const [dr, dc] of dirs) {
            const nr = last[0] + dr, nc = last[1] + dc;
            if (canStep(color, nr, nc)) {
              step(color, nr, nc);
              if (dfs(depth + 1)) return true;
              undo(color);
            }
          }
          return false;
        }

        return dfs();
      }

      const colors = Array.from(endpoints.keys()).sort((a, b) => a - b);
      return solve(colors);
    }

    // Test puzzles from index.html
    const PUZZLES = {
      5: [
        {size:5,tier:1,endpoints:[{color:0,a:[0,0],b:[4,4]},{color:1,a:[0,4],b:[4,0]},{color:2,a:[2,0],b:[2,4]}]},
        {size:5,tier:1,endpoints:[{color:0,a:[0,1],b:[4,3]},{color:1,a:[0,3],b:[4,1]},{color:2,a:[1,0],b:[3,4]}]},
        {size:5,tier:1,endpoints:[{color:0,a:[0,0],b:[4,2]},{color:1,a:[0,4],b:[4,2]},{color:2,a:[2,1],b:[2,3]}]},
      ]
    };

    log('Testing 5x5 puzzles...', 'ok');
    for (const puzzle of PUZZLES[5]) {
      const solvable = solvePuzzle(puzzle);
      const status = solvable ? '✓' : '✗';
      log(`${status} Puzzle with colors ${puzzle.endpoints.map(e => e.color).join(',')}: ${solvable ? 'SOLVABLE' : 'UNSOLVABLE'}`, solvable ? 'ok' : 'bad');
    }
  </script>
    <div id="site-footer"></div>
    <script src="/inc/include.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — Unit Tests</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #b8dde8;
            padding: 2rem;
            margin: 0;
        }
        h1 { color: #4ade80; margin-bottom: 0.25rem; }
        h2 { color: #6aabbb; margin: 1.5rem 0 0.5rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .suite { margin-bottom: 1rem; }
        .result {
            font-size: 0.9rem;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            margin: 2px 0;
            font-family: monospace;
        }
        .pass { background: rgba(74,222,128,0.1); color: #4ade80; }
        .fail { background: rgba(239,68,68,0.15); color: #f87171; }
        #summary {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 6px;
        }
        .summary-pass { background: rgba(74,222,128,0.15); color: #4ade80; }
        .summary-fail { background: rgba(239,68,68,0.15); color: #f87171; }
    </style>
</head>
<body>
<h1>Snake — Unit Tests</h1>
<p style="color:#6aabbb;margin-top:0">Iteration 1 — Core Logic</p>
<div id="output"></div>
<div id="summary"></div>

<script>
// ─────────────────────────────────────────────────────────────
//  LOGIC UNDER TEST  (copy of pure functions from index.html)
//  Keep these in sync whenever index.html logic changes.
// ─────────────────────────────────────────────────────────────
const GRID_SIZE = 20;

function wrapCoord(val, max) {
    return ((val % max) + max) % max;
}

function isOppositeDir(a, b) {
    return a.dx === -b.dx && a.dy === -b.dy;
}

function nextHead(head, dir) {
    return {
        x: wrapCoord(head.x + dir.dx, GRID_SIZE),
        y: wrapCoord(head.y + dir.dy, GRID_SIZE),
    };
}

function isSelfCollision(candidate, snake) {
    for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === candidate.x && snake[i].y === candidate.y) return true;
    }
    return false;
}

function spawnFood(snake, exclusions) {
    const excList = Array.isArray(exclusions) ? exclusions.filter(Boolean)
                    : (exclusions ? [exclusions] : []);
    let cell;
    let attempts = 0;
    do {
        cell = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE),
        };
        attempts++;
        if (attempts > GRID_SIZE * GRID_SIZE * 2) {
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const c = { x: col, y: row };
                    const blocked = snake.some(s => s.x === c.x && s.y === c.y) ||
                                    excList.some(e => e.x === c.x && e.y === c.y);
                    if (!blocked) return c;
                }
            }
        }
    } while (
        snake.some(s => s.x === cell.x && s.y === cell.y) ||
        excList.some(e => e.x === cell.x && e.y === cell.y)
    );
    return cell;
}

const SPEED_TABLE = [
    { minLen: 31, tickMs:  95 },
    { minLen: 21, tickMs: 110 },
    { minLen: 16, tickMs: 125 },
    { minLen: 11, tickMs: 145 },
    { minLen:  6, tickMs: 170 },
    { minLen:  3, tickMs: 200 },
];

function getTickMs(length) {
    for (const entry of SPEED_TABLE) {
        if (length >= entry.minLen) return entry.tickMs;
    }
    return 200;
}

function initState() {
    const cx = Math.floor(GRID_SIZE / 2);
    const cy = Math.floor(GRID_SIZE / 2);
    const snake = [
        { x: cx,     y: cy },
        { x: cx - 1, y: cy },
        { x: cx - 2, y: cy },
    ];
    return {
        snake,
        direction:   { dx: 1, dy: 0 },
        nextDir:     null,
        food:        spawnFood(snake, []),
        score:       0,
        status:      'idle',
        applesEaten: 0,
        cherry:      null,
        goldenApple: null,
    };
}

function tick(state) {
    let { snake, direction, nextDir, food, score, status,
          applesEaten, cherry, goldenApple } = state;
    snake = snake.slice();

    if (nextDir && !isOppositeDir(direction, nextDir)) {
        direction = nextDir;
    }
    nextDir = null;

    const now = Date.now();
    if (cherry      && now > cherry.expiresAt)      cherry      = null;
    if (goldenApple && now > goldenApple.expiresAt) goldenApple = null;

    const head = nextHead(snake[0], direction);

    if (isSelfCollision(head, snake)) {
        return { snake, direction, nextDir, food, score, status: 'game-over',
                 applesEaten, cherry, goldenApple };
    }

    snake.unshift(head);
    let grew = false;
    let ateType = null;

    const CHERRY_APPLE_INTERVAL = 5;
    const CHERRY_DURATION_MS    = 10000;
    const GOLDEN_DURATION_MS    = 7000;
    const GOLDEN_SPAWN_CHANCE   = 0.15;

    if (head.x === food.x && head.y === food.y) {
        grew = true;
        ateType = 'apple';
        score += 1;
        applesEaten += 1;
        food = spawnFood(snake, [cherry, goldenApple]);
        if (applesEaten % CHERRY_APPLE_INTERVAL === 0 && !cherry) {
            const pos = spawnFood(snake, [food, goldenApple]);
            cherry = { x: pos.x, y: pos.y, expiresAt: now + CHERRY_DURATION_MS };
        }
        if (!goldenApple && Math.random() < GOLDEN_SPAWN_CHANCE) {
            const pos = spawnFood(snake, [food, cherry]);
            goldenApple = { x: pos.x, y: pos.y, expiresAt: now + GOLDEN_DURATION_MS };
        }
    } else if (cherry && head.x === cherry.x && head.y === cherry.y) {
        grew = true;
        ateType = 'cherry';
        score += 3;
        cherry = null;
    } else if (goldenApple && head.x === goldenApple.x && head.y === goldenApple.y) {
        grew = true;
        ateType = 'golden';
        score += 5;
        goldenApple = null;
    }

    if (!grew) snake.pop();

    return { snake, direction, nextDir, food, score, status,
             applesEaten, cherry, goldenApple, _ate: ateType };
}

// ─────────────────────────────────────────────────────────────
//  MICRO TEST FRAMEWORK
// ─────────────────────────────────────────────────────────────
let passed = 0;
let failed = 0;
const output = document.getElementById('output');

function suite(name) {
    const h = document.createElement('h2');
    h.textContent = name;
    output.appendChild(h);
}

function assert(label, actual, expected) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    const div = document.createElement('div');
    div.className = 'result ' + (ok ? 'pass' : 'fail');
    if (ok) {
        div.textContent = `✅ ${label}`;
        passed++;
    } else {
        div.textContent = `❌ ${label}  →  expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
        failed++;
    }
    output.appendChild(div);
}

function assertCond(label, condition, description) {
    const div = document.createElement('div');
    div.className = 'result ' + (condition ? 'pass' : 'fail');
    if (condition) {
        div.textContent = `✅ ${label}`;
        passed++;
    } else {
        div.textContent = `❌ ${label}  →  ${description}`;
        failed++;
    }
    output.appendChild(div);
}

// ─────────────────────────────────────────────────────────────
//  TESTS
// ─────────────────────────────────────────────────────────────

// W: wrapCoord
suite('wrapCoord(val, max)');
assert('W1 — exit right edge wraps to 0',         wrapCoord(20, 20),  0);
assert('W2 — exit left edge wraps to max-1',      wrapCoord(-1, 20),  19);
assert('W3 — zero stays zero',                    wrapCoord(0, 20),   0);
assert('W4 — max-1 stays max-1',                  wrapCoord(19, 20),  19);
assert('W5 — two cells past right wraps to 1',    wrapCoord(21, 20),  1);

// D: isOppositeDir
suite('isOppositeDir(a, b)');
assert('D1 — right vs left is opposite',    isOppositeDir({dx:1,dy:0},  {dx:-1,dy:0}),  true);
assert('D2 — right vs up is not opposite',  isOppositeDir({dx:1,dy:0},  {dx:0,dy:-1}),  false);
assert('D3 — up vs down is opposite',       isOppositeDir({dx:0,dy:-1}, {dx:0,dy:1}),   true);
assert('D4 — up vs right is not opposite',  isOppositeDir({dx:0,dy:-1}, {dx:1,dy:0}),   false);
assert('D5 — down vs up is opposite',       isOppositeDir({dx:0,dy:1},  {dx:0,dy:-1}),  true);
assert('D6 — left vs right is opposite',    isOppositeDir({dx:-1,dy:0}, {dx:1,dy:0}),   true);

// N: nextHead
suite('nextHead(head, dir)');
assert('N1 — normal move right',                         nextHead({x:10,y:10}, {dx:1,dy:0}),   {x:11,y:10});
assert('N2 — wrap right edge to left',                   nextHead({x:19,y:10}, {dx:1,dy:0}),   {x:0, y:10});
assert('N3 — wrap top edge to bottom',                   nextHead({x:0, y:0},  {dx:0,dy:-1}),  {x:0, y:19});
assert('N4 — wrap bottom edge to top',                   nextHead({x:0, y:19}, {dx:0,dy:1}),   {x:0, y:0});
assert('N5 — wrap left edge to right',                   nextHead({x:0, y:5},  {dx:-1,dy:0}),  {x:19,y:5});
assert('N6 — normal move up',                            nextHead({x:5, y:5},  {dx:0,dy:-1}),  {x:5, y:4});

// C: isSelfCollision
suite('isSelfCollision(candidate, snake)');
assert('C1 — head position itself is not a collision',
    isSelfCollision({x:5,y:5}, [{x:5,y:5},{x:4,y:5},{x:3,y:5}]),  false);
assert('C2 — moving into neck is a collision',
    isSelfCollision({x:4,y:5}, [{x:5,y:5},{x:4,y:5},{x:3,y:5}]),  true);
assert('C3 — unrelated cell is not a collision',
    isSelfCollision({x:9,y:9}, [{x:5,y:5},{x:4,y:5}]),             false);
assert('C4 — moving into middle of body is a collision',
    isSelfCollision({x:3,y:5}, [{x:5,y:5},{x:4,y:5},{x:3,y:5},{x:2,y:5}]),  true);

// T: tick — movement and growth
suite('tick(state) — movement');
const baseState = (overrides) => ({
    snake: [{x:5,y:5},{x:4,y:5},{x:3,y:5}],
    direction: {dx:1,dy:0},
    nextDir: null,
    food: {x:0,y:0},
    score: 0,
    status: 'playing',
    applesEaten: 0,
    cherry: null,
    goldenApple: null,
    ...overrides,
});
{
    // T1: normal move, no food ahead
    const s2 = tick(baseState({}));
    assert('T1 — head advances right',          s2.snake[0],       {x:6,y:5});
    assert('T1 — length unchanged after move',  s2.snake.length,   3);
    assert('T1 — score unchanged',              s2.score,          0);
}
{
    // T2: eating food
    const s2 = tick(baseState({ food: {x:6,y:5} }));
    assert('T2 — head on food cell',                s2.snake[0],      {x:6,y:5});
    assert('T2 — snake grew by 1',                  s2.snake.length,  4);
    assert('T2 — score incremented',                s2.score,         1);
    assertCond('T2 — new food not on snake',
        !s2.snake.some(seg => seg.x === s2.food.x && seg.y === s2.food.y),
        'food spawned on snake body');
}
{
    // T3: wrap-around during tick
    const s2 = tick(baseState({ snake: [{x:19,y:5},{x:18,y:5},{x:17,y:5}] }));
    assert('T3 — head wraps to left edge', s2.snake[0], {x:0,y:5});
}
{
    // T4: self-collision — U-shape, head steps into body
    const s2 = tick(baseState({
        snake: [{x:5,y:5},{x:5,y:6},{x:4,y:6},{x:4,y:5},{x:4,y:4}],
        direction: {dx:-1,dy:0},
    }));
    assert('T4 — status is game-over after self-collision', s2.status, 'game-over');
    assert('T4 — snake unchanged on game-over',             s2.snake.length, 5);
}
{
    // T5: opposite direction input is ignored
    const s2 = tick(baseState({ nextDir: {dx:-1,dy:0} }));
    assert('T5 — still moves right when opposite queued', s2.snake[0], {x:6,y:5});
    assert('T5 — status still playing',                   s2.status,   'playing');
}
{
    // T6: valid perpendicular direction applied
    const s2 = tick(baseState({ nextDir: {dx:0,dy:-1} }));
    assert('T6 — turns up when up queued', s2.snake[0], {x:5,y:4});
    assert('T6 — new direction is up',     s2.direction, {dx:0,dy:-1});
}

// F: spawnFood
suite('spawnFood(snake, exclusions)');
{
    // F1: food not on snake (array exclusion form)
    const snake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    let ok = true;
    for (let i = 0; i < 200; i++) {
        const f = spawnFood(snake, []);
        if (snake.some(s => s.x === f.x && s.y === f.y)) { ok = false; break; }
    }
    assertCond('F1 — food never spawns on snake (200 trials)', ok, 'spawned on snake body at least once');
}
{
    // F2: board almost full
    const snake = [];
    for (let row = 0; row < GRID_SIZE; row++) {
        for (let col = 0; col < GRID_SIZE; col++) {
            if (!(row === GRID_SIZE - 1 && col === GRID_SIZE - 1)) {
                snake.push({ x: col, y: row });
            }
        }
    }
    const f = spawnFood(snake, []);
    assert('F2 — finds last free cell when board almost full', f, {x: GRID_SIZE-1, y: GRID_SIZE-1});
}
{
    // F3: respects array exclusions
    const snake = [{x:0,y:0}];
    const excl  = [{x:1,y:0},{x:2,y:0},{x:3,y:0}];
    let ok = true;
    for (let i = 0; i < 200; i++) {
        const f = spawnFood(snake, excl);
        if (excl.some(e => e.x === f.x && e.y === f.y)) { ok = false; break; }
        if (snake.some(s => s.x === f.x && s.y === f.y)) { ok = false; break; }
    }
    assertCond('F3 — food never spawns on exclusion cells (200 trials)', ok, 'spawned on excluded cell at least once');
}

// SP: speed progression
suite('getTickMs(length)');
assert('SP1 — length 3 gives 200ms',   getTickMs(3),  200);
assert('SP2 — length 5 gives 200ms',   getTickMs(5),  200);
assert('SP3 — length 6 gives 170ms',   getTickMs(6),  170);
assert('SP4 — length 11 gives 145ms',  getTickMs(11), 145);
assert('SP5 — length 16 gives 125ms',  getTickMs(16), 125);
assert('SP6 — length 21 gives 110ms',  getTickMs(21), 110);
assert('SP7 — length 31 gives 95ms',   getTickMs(31),  95);
assert('SP8 — length 50 still 95ms',   getTickMs(50),  95);

// SF: special food via tick
suite('tick — cherry and golden apple');
{
    // SF1: eating apple increments applesEaten and score
    const s = {
        snake: [{x:5,y:5},{x:4,y:5},{x:3,y:5}],
        direction: {dx:1,dy:0}, nextDir: null,
        food: {x:6,y:5}, score: 0, status: 'playing',
        applesEaten: 0, cherry: null, goldenApple: null,
    };
    const s2 = tick(s);
    assert('SF1 — applesEaten increments on apple eat', s2.applesEaten, 1);
    assert('SF1 — score +1 on apple', s2.score, 1);
    assert('SF1 — _ate is apple', s2._ate, 'apple');
}
{
    // SF2: eating cherry gives +3, clears cherry slot
    const cherry = { x:6,y:5, expiresAt: Date.now() + 10000 };
    const s = {
        snake: [{x:5,y:5},{x:4,y:5},{x:3,y:5}],
        direction: {dx:1,dy:0}, nextDir: null,
        food: {x:0,y:0}, score: 0, status: 'playing',
        applesEaten: 0, cherry, goldenApple: null,
    };
    const s2 = tick(s);
    assert('SF2 — score +3 on cherry', s2.score, 3);
    assert('SF2 — cherry cleared after eating', s2.cherry, null);
    assert('SF2 — _ate is cherry', s2._ate, 'cherry');
    assert('SF2 — snake grew on cherry', s2.snake.length, 4);
}
{
    // SF3: eating golden apple gives +5, clears golden slot
    const goldenApple = { x:6,y:5, expiresAt: Date.now() + 10000 };
    const s = {
        snake: [{x:5,y:5},{x:4,y:5},{x:3,y:5}],
        direction: {dx:1,dy:0}, nextDir: null,
        food: {x:0,y:0}, score: 0, status: 'playing',
        applesEaten: 0, cherry: null, goldenApple,
    };
    const s2 = tick(s);
    assert('SF3 — score +5 on golden apple', s2.score, 5);
    assert('SF3 — goldenApple cleared after eating', s2.goldenApple, null);
    assert('SF3 — _ate is golden', s2._ate, 'golden');
}
{
    // SF4: expired cherry is removed during tick
    const cherry = { x:6,y:5, expiresAt: Date.now() - 1 }; // already expired
    const s = {
        snake: [{x:5,y:5},{x:4,y:5},{x:3,y:5}],
        direction: {dx:1,dy:0}, nextDir: null,
        food: {x:0,y:0}, score: 0, status: 'playing',
        applesEaten: 0, cherry, goldenApple: null,
    };
    const s2 = tick(s);
    assert('SF4 — expired cherry cleared in tick', s2.cherry, null);
    assert('SF4 — score unchanged when cherry expired', s2.score, 0);
}

// LS: localStorage helpers
suite('loadBest() and saveBest(n)');
{
    const LS_KEY = 'snake_highscore';
    // These must match the implementations in index.html exactly
    function loadBest() {
        const v = parseInt(localStorage.getItem(LS_KEY), 10);
        return isNaN(v) ? 0 : v;
    }
    function saveBest(score) {
        if (score > loadBest()) localStorage.setItem(LS_KEY, String(score));
    }

    // Clear before tests so previous runs don't interfere
    localStorage.removeItem(LS_KEY);

    assert('LS1 — loadBest returns 0 when key absent', loadBest(), 0);

    saveBest(10);
    assert('LS2 — loadBest returns saved score', loadBest(), 10);

    saveBest(5);
    assert('LS3 — lower score does not overwrite best', loadBest(), 10);

    saveBest(15);
    assert('LS4 — higher score overwrites best', loadBest(), 15);

    // Clean up
    localStorage.removeItem(LS_KEY);
}

// ─────────────────────────────────────────────────────────────
//  WRAP-BEND RENDERING HELPERS
//  (gridDir, isGridBend, alignAnchorToTile)
//  These are the pure functions underlying the fix for the
//  "line across canvas" artifact when a bend corner crosses a
//  grid wrap boundary.
// ─────────────────────────────────────────────────────────────
function gridDir(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    if (dx >  GRID_SIZE / 2) dx -= GRID_SIZE;
    if (dx < -GRID_SIZE / 2) dx += GRID_SIZE;
    if (dy >  GRID_SIZE / 2) dy -= GRID_SIZE;
    if (dy < -GRID_SIZE / 2) dy += GRID_SIZE;
    return { dx, dy };
}

function isGridBend(snake, i) {
    if (i < 1 || i >= snake.length - 1) return false;
    const d1 = gridDir(snake[i - 1], snake[i]);
    const d2 = gridDir(snake[i], snake[i + 1]);
    return (d1.dx * d2.dx + d1.dy * d2.dy) === 0;
}

// Pure version of the anchor tile-alignment fix from buildUnwrappedSpine.
// Shifts sp so it is in the same unwrapped tile as ref (both in pixel space).
function alignAnchorToTile(sp, ref, GW) {
    const out = { x: sp.x, y: sp.y };
    if      (out.x - ref.x >  GW / 2) out.x -= GW;
    else if (ref.x - out.x >  GW / 2) out.x += GW;
    if      (out.y - ref.y >  GW / 2) out.y -= GW;
    else if (ref.y - out.y >  GW / 2) out.y += GW;
    return out;
}

suite('gridDir — wrap-aware direction vector');
{
    // No wrap needed – normal adjacent cells
    assert('GD1 — right step',        gridDir({x:5,y:5},{x:6,y:5}), {dx:1,dy:0});
    assert('GD2 — left step',         gridDir({x:5,y:5},{x:4,y:5}), {dx:-1,dy:0});
    assert('GD3 — down step',         gridDir({x:5,y:5},{x:5,y:6}), {dx:0,dy:1});
    assert('GD4 — up step',           gridDir({x:5,y:5},{x:5,y:4}), {dx:0,dy:-1});

    // Wrap crossing – right edge to left edge (x: 19 → 0)
    assert('GD5 — right-wall wrap',   gridDir({x:19,y:5},{x:0,y:5}), {dx:1,dy:0});
    // Wrap crossing – left edge to right edge (x: 0 → 19)
    assert('GD6 — left-wall wrap',    gridDir({x:0,y:5},{x:19,y:5}), {dx:-1,dy:0});
    // Wrap crossing – bottom edge to top edge (y: 19 → 0)
    assert('GD7 — bottom-wall wrap',  gridDir({x:5,y:19},{x:5,y:0}), {dx:0,dy:1});
    // Wrap crossing – top edge to bottom edge (y: 0 → 19)
    assert('GD8 — top-wall wrap',     gridDir({x:5,y:0},{x:5,y:19}), {dx:0,dy:-1});
}

suite('isGridBend — detect turns in snake body');
{
    // Straight horizontal — no bend
    const straight = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    assertCond('GB1 — straight body, middle cell is not a bend',
        !isGridBend(straight, 1), 'should return false for straight run');

    // Right-then-down: segments (5,5)→(5,4)→(4,4) — bend at index 1
    const bend = [{x:5,y:5},{x:5,y:4},{x:4,y:4}];
    assertCond('GB2 — right-then-down, middle cell is a bend',
        isGridBend(bend, 1), 'should return true for 90° turn');

    // Head (index 0) is never a bend
    assertCond('GB3 — head (i=0) is never a bend',
        !isGridBend(bend, 0), 'should return false for head');

    // Tail (last index) is never a bend
    assertCond('GB4 — tail last index is never a bend',
        !isGridBend(bend, bend.length - 1), 'should return false for tail');

    // Bend crossing wrap: segments going right reach x=19, then turn down at x=0
    // Incoming dir: (18,5)→(19,5) = dx+1; outgoing: (19,5)→(19,6) = dy+1  → bend
    const wrapTurn = [{x:18,y:5},{x:19,y:5},{x:19,y:6}];
    assertCond('GB5 — bend at right-edge cell (no wrap crossing here)',
        isGridBend(wrapTurn, 1), 'turn at x=19 should be detected');

    // Wrap-crossing segment into a bend: e.g. (19,5)→(0,5)→(0,6)
    // incoming wrap-dir dx+1, outgoing dy+1 → bend
    const wrapBend = [{x:19,y:5},{x:0,y:5},{x:0,y:6}];
    assertCond('GB6 — bend where one segment crosses the right→left wrap edge',
        isGridBend(wrapBend, 1), 'bend with wrap crossing must be detected');
}

suite('alignAnchorToTile — fix for wrap-bend line artifact');
{
    const GW = 400; // 20 cells × 20px hypothetical

    // Anchor already in same tile — should be unchanged
    const sp1 = {x:100,y:100}, ref1 = {x:110,y:110};
    const r1 = alignAnchorToTile(sp1, ref1, GW);
    assertCond('BA1 — anchor already close, no shift',
        r1.x === 100 && r1.y === 100,
        `got x=${r1.x} y=${r1.y}`);

    // Anchor is exactly GW to the right of ref (the bug scenario for x)
    const sp2 = {x:410,y:100}, ref2 = {x:10,y:100};
    const r2 = alignAnchorToTile(sp2, ref2, GW);
    assertCond('BA2 — anchor GW ahead on x axis → shift left by GW',
        r2.x === 10 && r2.y === 100,
        `got x=${r2.x} y=${r2.y}`);

    // Anchor is GW to the left of ref (opposite wrap)
    const sp3 = {x:-10,y:100}, ref3 = {x:390,y:100};
    const r3 = alignAnchorToTile(sp3, ref3, GW);
    assertCond('BA3 — anchor GW behind on x axis → shift right by GW',
        r3.x === 390 && r3.y === 100,
        `got x=${r3.x} y=${r3.y}`);

    // Anchor is GW below ref (y axis wrap)
    const sp4 = {x:100,y:410}, ref4 = {x:100,y:10};
    const r4 = alignAnchorToTile(sp4, ref4, GW);
    assertCond('BA4 — anchor GW below on y axis → shift up by GW',
        r4.x === 100 && r4.y === 10,
        `got x=${r4.x} y=${r4.y}`);

    // Anchor is GW above ref (y axis wrap)
    const sp5 = {x:100,y:-10}, ref5 = {x:100,y:390};
    const r5 = alignAnchorToTile(sp5, ref5, GW);
    assertCond('BA5 — anchor GW above on y axis → shift down by GW',
        r5.x === 100 && r5.y === 390,
        `got x=${r5.x} y=${r5.y}`);

    // After alignment the anchor should always be within GW/2 of the ref
    const cases = [
        { sp:{x:405,y:205}, ref:{x:5,y:5} },    // both axes wrapped
        { sp:{x:-5,y:-5},   ref:{x:395,y:395} }, // both axes other direction
    ];
    cases.forEach(({sp, ref}, ci) => {
        const aligned = alignAnchorToTile(sp, ref, GW);
        const dx = Math.abs(aligned.x - ref.x), dy = Math.abs(aligned.y - ref.y);
        assertCond(`BA${6+ci} — aligned anchor within GW/2 of ref (case ${ci+1})`,
            dx <= GW / 2 && dy <= GW / 2,
            `distance after alignment: dx=${dx} dy=${dy}`);
    });
}

// ─────────────────────────────────────────────────────────────
//  ESTABLISHED-CORNER STUTTER FIX
//
//  Tests for the logic that detects an "established corner" (one
//  that existed in the previous tick) and snaps the slot just
//  ahead of it to its fully-arrived grid position (snapped[i-1]),
//  preventing the two coincident spine points that caused a sharp
//  kink at t=0 each tick.
//
//  Pure helper under test:
//    isEstablishedCorner(prevSnake, curSnake, i)
//      → true when prevSnake[i-1] === curSnake[i]  (cell equality)
// ─────────────────────────────────────────────────────────────
function isEstablishedCorner(prevSnake, curSnake, i) {
    if (!prevSnake) return false;
    if (i < 1 || i - 1 >= prevSnake.length) return false;
    return prevSnake[i - 1].x === curSnake[i].x &&
           prevSnake[i - 1].y === curSnake[i].y;
}

suite('isEstablishedCorner — stutter-free bend detection');
{
    // Scenario: snake moves right then turns down.
    //   Before tick:  prevSnake = [A={6,5}, C={5,5}, B={4,5}]
    //   After tick:   curSnake  = [A2={7,5}, A={6,5}, C={5,5}, B={4,5}]
    //   Bend corner is at index 2 (cell C={5,5}).
    //   prevSnake[2-1] = prevSnake[1] = C={5,5} === curSnake[2] ✔ established
    const prevSnake = [{x:6,y:5},{x:5,y:5},{x:4,y:5}];
    const curSnake  = [{x:7,y:5},{x:6,y:5},{x:5,y:5},{x:4,y:5}];

    assertCond('EC1 — established corner detected at index 2',
        isEstablishedCorner(prevSnake, curSnake, 2),
        'prevSnake[1] should equal curSnake[2]');

    // Index 1 is NOT an established corner (prevSnake[0]={6,5} ≠ curSnake[1]={6,5} — wait, they ARE equal here)
    // Actually: prevSnake[0]={6,5} === curSnake[1]={6,5} → this would also be true.
    // That's correct: index 1 (cell A={6,5}) was at prevSnake[0] — it was the head, not a bend.
    // isGridBend guards which indices we actually apply this to, so test the condition in isolation:
    assertCond('EC2 — condition also true at index 1 (guarded by isGridBend in real code)',
        isEstablishedCorner(prevSnake, curSnake, 1),
        'prevSnake[0]={6,5} should equal curSnake[1]={6,5}');

    // Index 3: prevSnake[2]={4,5} vs curSnake[3]={4,5} → true (tail cell shifted)
    assertCond('EC3 — tail slot: condition true (only applied at bend by isGridBend)',
        isEstablishedCorner(prevSnake, curSnake, 3),
        'prevSnake[2] should equal curSnake[3]');

    // Fresh corner — snake just turned this tick.
    // Before tick: prevSnake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}]  (straight)
    // After tick:  curSnake  = [{x:5,y:6},{x:5,y:5},{x:4,y:5},{x:3,y:5}]
    // Bend at index 1 (cell {5,5}).  prevSnake[0]={5,5} === curSnake[1]={5,5} → true?
    // Yes — this is the one-tick-after-turn case, which IS established (the corner cell
    // was the head last tick, now it's slot 1). The condition correctly fires.
    const prevStraight = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    const curJustTurned = [{x:5,y:6},{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    assertCond('EC4 — one-tick-after-turn: corner cell was head, now slot 1 → established',
        isEstablishedCorner(prevStraight, curJustTurned, 1),
        'first tick after a turn should be treated as established');

    // Brand-new corner (second tick after turn, new head arrived):
    // prevSnake = [{x:5,y:6},{x:5,y:5},{x:4,y:5},{x:3,y:5}]  (just-turned)
    // curSnake  = [{x:5,y:7},{x:5,y:6},{x:5,y:5},{x:4,y:5}]
    // Bend at index 2 (cell {5,5}).  prevSnake[1]={5,y:5}? No, prevSnake[1]={5,5} === curSnake[2]={5,5} → true
    // This is still established — the corner persists.
    const prevJustTurned = [{x:5,y:6},{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    const curContinued   = [{x:5,y:7},{x:5,y:6},{x:5,y:5},{x:4,y:5}];
    assertCond('EC5 — persistent corner remains established on subsequent ticks',
        isEstablishedCorner(prevJustTurned, curContinued, 2),
        'corner at index 2 should be established');

    // No prevSnake (start of game) → must return false, not throw
    assertCond('EC6 — null prevSnake returns false safely',
        !isEstablishedCorner(null, curSnake, 2),
        'null prevSnake must return false');

    // i=0 (head) — out of range for i-1 check
    assertCond('EC7 — i=0 (head) returns false',
        !isEstablishedCorner(prevSnake, curSnake, 0),
        'i=0 is out of range');

    // i-1 beyond prevSnake length — safe boundary
    const shortPrev = [{x:5,y:5}];
    assertCond('EC8 — i-1 beyond prevSnake length returns false',
        !isEstablishedCorner(shortPrev, curSnake, 3),
        'i-1=2 is beyond shortPrev.length=1');
}

const summary = document.getElementById('summary');
summary.textContent = `${passed + failed} tests — ${passed} passed, ${failed} failed`;
summary.className = 'summary-' + (failed === 0 ? 'pass' : 'fail');

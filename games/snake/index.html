<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            margin: 0;
            background: #ede9e0;  /* light mode default */
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.fullscreen #site-header,
        body.fullscreen #site-footer {
            display: none;
        }

        body.fullscreen #game-view {
            height: 100vh;
        }

        #game-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-height: 0;
        }

        /* ── Meta bar ── */
        #meta-bar {
            height: 48px;
            flex-shrink: 0;
            background: #3d4e5c;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 4px;
            user-select: none;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }

        .meta-label {
            font-size: 10px;
            color: #8a9aaa;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-value {
            font-size: 15px;
            font-weight: 600;
            color: #d8e0e8;
            font-variant-numeric: tabular-nums;
        }

        .meta-sep {
            width: 1px;
            height: 28px;
            background: #4e6070;
            flex-shrink: 0;
        }

        #sound-btn, #theme-btn, #restart-btn {
            margin-left: auto;
            background: #314252;
            color: #d8e0e8;
            border: 1px solid #4a5e6e;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        #sound-btn {
            margin-left: auto;
            font-size: 16px;
            padding: 2px 8px;
        }

        #theme-btn, #restart-btn {
            margin-left: 6px;
        }

        #sound-btn:hover, #theme-btn:hover, #restart-btn:hover {
            background: #4a5e6e;
        }

        /* ── Canvas area ── */
        #game-canvas-wrap {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e0d4;  /* light mode: warm linen edge */
            min-height: 0;
        }

        canvas#game-canvas {
            display: block;
        }

        /* ── Expand button ── */
        #expand-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(49,66,82,0.85);
            color: #d8e0e8;
            border: 1px solid #4a5e6e;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        #expand-btn:hover { background: rgba(74,94,110,0.9); }

        /* ── Dark mode overrides ── */
        body.dark { background: #1a1e28; }
        body.dark #meta-bar { background: #27364f; }
        body.dark .meta-label { color: #7a8fa8; }
        body.dark .meta-value { color: #c8d0e0; }
        body.dark .meta-sep { background: #3a4d68; }
        body.dark #sound-btn,
        body.dark #theme-btn,
        body.dark #restart-btn { background: #2f4260; color: #c8d0e0; border-color: #3d5478; }
        body.dark #sound-btn:hover,
        body.dark #theme-btn:hover,
        body.dark #restart-btn:hover { background: #3d5478; }
        body.dark #game-canvas-wrap { background: #141820; }
        body.dark #expand-btn { background: rgba(39,54,79,0.85); color: #c8d0e0; border-color: #3d5478; }
        body.dark #expand-btn:hover { background: rgba(61,84,120,0.9); }
    </style>
</head>
<body>
    <script>
        // Inline site header (matches /inc/header.html pattern used by other pages)
        fetch('/inc/header.html').then(r => r.text()).then(h => {
            const el = document.createElement('div');
            el.id = 'site-header';
            el.innerHTML = h;
            document.body.insertBefore(el, document.body.firstChild);
        }).catch(() => {});
        fetch('/inc/footer.html').then(r => r.text()).then(f => {
            const el = document.createElement('div');
            el.id = 'site-footer';
            el.innerHTML = f;
            document.body.appendChild(el);
        }).catch(() => {});
    </script>

    <div id="game-view">
        <div id="meta-bar">
            <div class="meta-item">
                <span class="meta-label">Score</span>
                <span class="meta-value" id="score-display">0</span>
            </div>
            <div class="meta-sep"></div>
            <div class="meta-item">
                <span class="meta-label">Best</span>
                <span class="meta-value" id="best-display">--</span>
            </div>
            <div class="meta-sep"></div>
            <div class="meta-item">
                <span class="meta-label">Length</span>
                <span class="meta-value" id="length-display">3</span>
            </div>
            <div class="meta-sep"></div>
            <button id="sound-btn" title="Toggle sound">🔇</button>
            <button id="theme-btn" title="Toggle light/dark mode">🌙</button>
            <button id="restart-btn" title="Restart game">Restart</button>
        </div>
        <div id="game-canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <button id="expand-btn" title="Toggle fullscreen">⛶</button>
        </div>
    </div>

    <script>
    // ─────────────────────────────────────────────
    //  CONSTANTS
    // ─────────────────────────────────────────────
    const GRID_SIZE = 20;
    const LS_KEY    = 'snake_highscore';

    // Speed progression: tick interval in ms by minimum snake length
    const SPEED_TABLE = [
        { minLen: 31, tickMs:  95 },
        { minLen: 21, tickMs: 110 },
        { minLen: 16, tickMs: 125 },
        { minLen: 11, tickMs: 145 },
        { minLen:  6, tickMs: 170 },
        { minLen:  3, tickMs: 200 },
    ];

    // Special food durations
    const CHERRY_DURATION_MS      = 10000;
    const GOLDEN_DURATION_MS      =  7000;
    const GOLDEN_SPAWN_CHANCE     = 0.15;
    const CHERRY_APPLE_INTERVAL   = 5;    // every Nth apple eaten

    // ── Colour palettes (light default, dark optional) ──────────────
    const LS_THEME_KEY = 'snake_theme';
    const PALETTES = {
        light: {
            BG:      '#f0ece4',           // warm linen canvas
            GRID:    '#e4ddd4',           // barely-visible warm lines
            HEAD:    '#2e7d60',           // deep sage-teal
            BODY:    '#4a9e82',           // medium sage
            FOOD:    '#bf5a3a',           // earthy terracotta
            CHERRY:  '#9e3a58',           // muted rose
            GOLDEN:  '#a87020',           // warm amber
            OVERLAY: 'rgba(50,40,30,0.65)',
            TEXT:    '#3a3530',           // warm near-black
            LABEL:   '#8a7a68',           // warm mid-brown
            DANGER:  '#bf4040',           // soft red
            EYE:     '#f0ece4',           // light dots on dark head
        },
        dark: {
            BG:      '#1c2030',           // warm dark slate
            GRID:    '#232840',           // barely-lighter grid lines
            HEAD:    '#6ec6a2',           // muted sage-teal
            BODY:    '#9ad4bf',           // soft mint
            FOOD:    '#e0856a',           // warm terracotta
            CHERRY:  '#c47088',           // soft rose-mauve
            GOLDEN:  '#d4a855',           // warm muted amber
            OVERLAY: 'rgba(12,14,26,0.68)',
            TEXT:    '#c8d0e0',           // warm off-white
            LABEL:   '#7a8fa8',           // muted slate
            DANGER:  '#e07070',           // soft warm red
            EYE:     '#1c2030',           // dark dots on light head
        },
    };

    let theme = 'light';
    let pal   = PALETTES.light;

    // ─────────────────────────────────────────────
    //  PURE LOGIC (shared with test.html)
    // ─────────────────────────────────────────────

    /**
     * Wrap a single coordinate within [0, max).
     * @param {number} val
     * @param {number} max
     * @returns {number}
     */
    function wrapCoord(val, max) {
        return ((val % max) + max) % max;
    }

    /**
     * Returns true if direction b is the exact reverse of direction a.
     * @param {{dx:number,dy:number}} a
     * @param {{dx:number,dy:number}} b
     * @returns {boolean}
     */
    function isOppositeDir(a, b) {
        return a.dx === -b.dx && a.dy === -b.dy;
    }

    /**
     * Returns the grid cell the head will occupy after one step.
     * Wrap-around is applied.
     * @param {{x:number,y:number}} head  snake[0]
     * @param {{dx:number,dy:number}} dir
     * @returns {{x:number,y:number}}
     */
    function nextHead(head, dir) {
        return {
            x: wrapCoord(head.x + dir.dx, GRID_SIZE),
            y: wrapCoord(head.y + dir.dy, GRID_SIZE),
        };
    }

    /**
     * Returns true if candidate cell collides with any body segment
     * (snake[1..end] — the current head at index 0 is excluded because it
     * is about to move away).
     * @param {{x:number,y:number}} candidate
     * @param {Array<{x:number,y:number}>} snake
     * @returns {boolean}
     */
    function isSelfCollision(candidate, snake) {
        for (let i = 1; i < snake.length; i++) {
            if (snake[i].x === candidate.x && snake[i].y === candidate.y) return true;
        }
        return false;
    }

    /**
     * Returns the tick interval in ms for the current snake length.
     * Sorted descending so first match wins.
     * @param {number} length
     * @returns {number}
     */
    function getTickMs(length) {
        for (const entry of SPEED_TABLE) {
            if (length >= entry.minLen) return entry.tickMs;
        }
        return 200;
    }

    /**
     * Returns a random grid cell not occupied by snake or any of the given exclusions.
     * @param {Array<{x,y}>} snake
     * @param {Array<{x,y}|null>} exclusions  array of cells to avoid (nulls are skipped)
     * @returns {{x:number,y:number}}
     */
    function spawnFood(snake, exclusions) {
        // exclusions is now an array of cells to avoid (or a single cell for backward compat)
        const excList = Array.isArray(exclusions) ? exclusions.filter(Boolean)
                        : (exclusions ? [exclusions] : []);
        let cell;
        let attempts = 0;
        do {
            cell = {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE),
            };
            attempts++;
            if (attempts > GRID_SIZE * GRID_SIZE * 2) {
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        const c = { x: col, y: row };
                        const blocked = snake.some(s => s.x === c.x && s.y === c.y) ||
                                        excList.some(e => e.x === c.x && e.y === c.y);
                        if (!blocked) return c;
                    }
                }
                // Board completely full — return the food's current position unchanged
                // (practically unreachable: collision ends the game before this)
                return snake[0];
            }
        } while (
            snake.some(s => s.x === cell.x && s.y === cell.y) ||
            excList.some(e => e.x === cell.x && e.y === cell.y)
        );
        return cell;
    }

    /**
     * Returns a fresh initial game state.
     * Snake at center, length 3, facing right.
     * @returns {object} gameState
     */
    function initState() {
        const cx = Math.floor(GRID_SIZE / 2);
        const cy = Math.floor(GRID_SIZE / 2);
        const snake = [
            { x: cx,     y: cy },
            { x: cx - 1, y: cy },
            { x: cx - 2, y: cy },
        ];
        return {
            snake,
            direction:   { dx: 1, dy: 0 },
            nextDir:     [],           // up to 2 queued direction changes
            food:        spawnFood(snake, []),
            score:       0,
            status:      'idle',   // 'idle' | 'playing' | 'paused' | 'game-over'
            applesEaten: 0,
            cherry:      null,     // {x, y, expiresAt} | null
            goldenApple: null,     // {x, y, expiresAt} | null
        };
    }

    /**
     * Advances the game by one tick. Returns a new state object.
     * Mutates nothing in the passed-in state.
     * @param {object} state
     * @returns {object} new state
     */
    function tick(state) {
        let { snake, direction, nextDir, food, score, status,
              applesEaten, cherry, goldenApple } = state;
        snake   = snake.slice();
        nextDir = nextDir.slice();   // shallow copy so we never mutate state

        // 1. Apply queued direction (dequeue first entry if valid)
        if (nextDir.length > 0) {
            const candidate = nextDir[0];
            if (!isOppositeDir(direction, candidate)) {
                direction = candidate;
            }
            nextDir.shift();
        }

        // 2. Expire timed food
        const now = Date.now();
        if (cherry      && now > cherry.expiresAt)      cherry      = null;
        if (goldenApple && now > goldenApple.expiresAt) goldenApple = null;

        // 3. Compute new head
        const head = nextHead(snake[0], direction);

        // 4. Self-collision check
        if (isSelfCollision(head, snake)) {
            return { snake, direction, nextDir: [], food, score, status: 'game-over',
                     applesEaten, cherry, goldenApple };
        }

        // 5. Move snake
        snake.unshift(head);
        let grew = false;
        let ateType = null;

        if (head.x === food.x && head.y === food.y) {
            // Ate apple
            grew = true;
            ateType = 'apple';
            score += 1;
            applesEaten += 1;
            food = spawnFood(snake, [cherry, goldenApple]);
            // Maybe spawn cherry (every CHERRY_APPLE_INTERVAL apples)
            if (applesEaten % CHERRY_APPLE_INTERVAL === 0 && !cherry) {
                const pos = spawnFood(snake, [food, goldenApple]);
                cherry = { x: pos.x, y: pos.y, expiresAt: now + CHERRY_DURATION_MS };
            }
            // Maybe spawn golden apple (random chance, max 1)
            if (!goldenApple && Math.random() < GOLDEN_SPAWN_CHANCE) {
                const pos = spawnFood(snake, [food, cherry]);
                goldenApple = { x: pos.x, y: pos.y, expiresAt: now + GOLDEN_DURATION_MS };
            }
        } else if (cherry && head.x === cherry.x && head.y === cherry.y) {
            grew = true;
            ateType = 'cherry';
            score += 3;
            cherry = null;
        } else if (goldenApple && head.x === goldenApple.x && head.y === goldenApple.y) {
            grew = true;
            ateType = 'golden';
            score += 5;
            goldenApple = null;
        }

        if (!grew) snake.pop();

        return { snake, direction, nextDir, food, score, status,
                 applesEaten, cherry, goldenApple, _ate: ateType };
    }

    // ─────────────────────────────────────────────
    //  SOUND SYSTEM
    // ─────────────────────────────────────────────
    let audioCtx = null;
    let soundEnabled = false;

    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    // Play a sequence of {freq, duration, type} notes
    function playTone(notes, waveType = 'sine') {
        if (!soundEnabled) return;
        const ctx = getAudioCtx();
        let t = ctx.currentTime;
        notes.forEach(({ freq, dur }) => {
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + dur);
            t += dur;
        });
    }

    function playSound(type) {
        switch (type) {
            case 'eat-apple':
                playTone([{ freq: 440, dur: 0.04 }, { freq: 880, dur: 0.04 }]);
                break;
            case 'eat-cherry':
                playTone([{ freq: 440, dur: 0.05 }, { freq: 660, dur: 0.05 }, { freq: 880, dur: 0.05 }]);
                break;
            case 'eat-golden':
                playTone([{ freq: 440, dur: 0.05 }, { freq: 660, dur: 0.05 },
                          { freq: 880, dur: 0.05 }, { freq: 1100, dur: 0.07 }]);
                break;
            case 'game-over':
                playTone([{ freq: 440, dur: 0.1 }, { freq: 330, dur: 0.1 },
                          { freq: 220, dur: 0.12 }, { freq: 110, dur: 0.18 }], 'sawtooth');
                break;
            case 'pause':
                playTone([{ freq: 330, dur: 0.05 }]);
                break;
        }
    }

    // ─────────────────────────────────────────────
    //  LOCALSTORAGE
    // ─────────────────────────────────────────────
    function loadBest() {
        const v = parseInt(localStorage.getItem(LS_KEY), 10);
        return isNaN(v) ? 0 : v;
    }

    function saveBest(score) {
        if (score > loadBest()) {
            localStorage.setItem(LS_KEY, String(score));
        }
    }

    function applyTheme(t) {
        theme = t;
        pal   = PALETTES[t];
        document.body.classList.toggle('dark', t === 'dark');
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
        localStorage.setItem(LS_THEME_KEY, t);
    }

    // ─────────────────────────────────────────────
    //  RENDERER
    // ─────────────────────────────────────────────
    const canvas  = document.getElementById('game-canvas');
    const ctx     = canvas.getContext('2d');
    let   cellSize = 0;

    function resizeCanvas() {
        const wrap    = document.getElementById('game-canvas-wrap');
        const dpr     = window.devicePixelRatio || 1;
        const cssSize = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) / GRID_SIZE) * GRID_SIZE;
        canvas.style.width  = cssSize + 'px';
        canvas.style.height = cssSize + 'px';
        canvas.width  = cssSize * dpr;
        canvas.height = cssSize * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // reset + scale in one call
        cellSize = cssSize / GRID_SIZE;
        render(state, 0);
    }

    // Wrap-aware direction vector from grid cell a → b
    function gridDir(a, b) {
        let dx = b.x - a.x, dy = b.y - a.y;
        if (dx >  GRID_SIZE / 2) dx -= GRID_SIZE;
        if (dx < -GRID_SIZE / 2) dx += GRID_SIZE;
        if (dy >  GRID_SIZE / 2) dy -= GRID_SIZE;
        if (dy < -GRID_SIZE / 2) dy += GRID_SIZE;
        return { dx, dy };
    }

    // True if segment i is a turning cell: the incoming and outgoing
    // directions are perpendicular (dot-product == 0).
    function isGridBend(snake, i) {
        if (i < 1 || i >= snake.length - 1) return false;
        const d1 = gridDir(snake[i - 1], snake[i]);
        const d2 = gridDir(snake[i], snake[i + 1]);
        return (d1.dx * d2.dx + d1.dy * d2.dy) === 0;
    }

    // True if the bend corner at index i was already a corner in the previous
    // tick.  Every tick the snake array shifts by one slot (new head prepended,
    // tail popped), so prevSnake[i-1] holds the cell that is now at curSnake[i].
    // When that cell is the corner cell, the corner has been stable for ≥1 tick.
    function isEstablishedCorner(prevSnake, curSnake, i) {
        if (!prevSnake) return false;
        if (i < 1 || i - 1 >= prevSnake.length) return false;
        return prevSnake[i - 1].x === curSnake[i].x &&
               prevSnake[i - 1].y === curSnake[i].y;
    }

    /**
     * Builds the snake's spine in "unwrapped" pixel space.
     *
     * Every segment is sub-frame interpolated (prevSnake[i] → snake[i], t)
     * so the whole body slides smoothly each frame.
     *
     * Bend cells (turning corners of the snake) are additionally pinned to
     * their post-tick grid-snapped position.  This keeps the corner anchor
     * fixed while the approach/departure segments still interpolate, so the
     * bezier arc at a bend is stable and doesn't pulse in width.
     */
    function buildUnwrappedSpine(s, t, cs) {
        const n       = s.snake.length;
        const pts     = [];   // interpolated pixel positions
        const snapped = [];   // grid-snapped (t=1) pixel positions, same unwrap
        let px, py;           // running unwrapped interpolated grid coords
        let qx, qy;           // running unwrapped snapped grid coords

        for (let i = 0; i < n; i++) {
            const cur  = s.snake[i];
            const prev = (prevSnake && i < prevSnake.length) ? prevSnake[i] : cur;

            // Delta cur − prev, wrap-corrected to shortest path
            let gdx = cur.x - prev.x;
            let gdy = cur.y - prev.y;
            if (gdx >  GRID_SIZE / 2) gdx -= GRID_SIZE;
            if (gdx < -GRID_SIZE / 2) gdx += GRID_SIZE;
            if (gdy >  GRID_SIZE / 2) gdy -= GRID_SIZE;
            if (gdy < -GRID_SIZE / 2) gdy += GRID_SIZE;

            const igx = prev.x + gdx * t;  // interpolated grid x
            const igy = prev.y + gdy * t;  // interpolated grid y

            if (i === 0) {
                px = igx; py = igy;
                qx = cur.x; qy = cur.y;
            } else {
                // Unwrap interpolated point relative to previous
                let rx = igx - px, ry = igy - py;
                if (rx >  GRID_SIZE / 2) rx -= GRID_SIZE;
                if (rx < -GRID_SIZE / 2) rx += GRID_SIZE;
                if (ry >  GRID_SIZE / 2) ry -= GRID_SIZE;
                if (ry < -GRID_SIZE / 2) ry += GRID_SIZE;
                px += rx; py += ry;

                // Unwrap snapped point identically
                let sx = cur.x - qx, sy = cur.y - qy;
                if (sx >  GRID_SIZE / 2) sx -= GRID_SIZE;
                if (sx < -GRID_SIZE / 2) sx += GRID_SIZE;
                if (sy >  GRID_SIZE / 2) sy -= GRID_SIZE;
                if (sy < -GRID_SIZE / 2) sy += GRID_SIZE;
                qx += sx; qy += sy;
            }

            pts.push({ x: (px + 0.5) * cs, y: (py + 0.5) * cs });
            snapped.push({ x: (qx + 0.5) * cs, y: (qy + 0.5) * cs });
        }

        // Replace every interpolated bend-corner with its fixed grid-snapped
        // anchor so the bezier control point is stable during animation.
        // Wrap-align each snapped anchor to the same unwrapped "tile" as its
        // corresponding pts[i]: when a bend falls exactly on the wrap cell the
        // two accumulation paths (interpolated vs snapped) start from different
        // sides of the grid, putting snapped[i] exactly GW away from pts[i].
        // Without the correction strokeSmooth draws a long line across the canvas.
        const GW = GRID_SIZE * cs;
        for (let i = 1; i < n - 1; i++) {
            if (isGridBend(s.snake, i)) {
                let sp = { x: snapped[i].x, y: snapped[i].y };
                if      (sp.x - pts[i].x >  GW / 2) sp.x -= GW;
                else if (pts[i].x - sp.x >  GW / 2) sp.x += GW;
                if      (sp.y - pts[i].y >  GW / 2) sp.y -= GW;
                else if (pts[i].y - sp.y >  GW / 2) sp.y += GW;
                pts[i] = sp;

                // Fix corner-stutter: snap the slot just ahead of an established
                // corner to its fully-arrived grid position so the two adjacent
                // spine points are already separated at t=0 and the bezier arc
                // is clean for the whole tick (no kink-then-open animation).
                // Guard: never snap pts[0] (the head) — it must always interpolate
                // smoothly so direction changes don't look jerky.
                if (i - 1 > 0 && isEstablishedCorner(prevSnake, s.snake, i)) {
                    let ap = { x: snapped[i - 1].x, y: snapped[i - 1].y };
                    if      (ap.x - pts[i - 1].x >  GW / 2) ap.x -= GW;
                    else if (pts[i - 1].x - ap.x >  GW / 2) ap.x += GW;
                    if      (ap.y - pts[i - 1].y >  GW / 2) ap.y -= GW;
                    else if (pts[i - 1].y - ap.y >  GW / 2) ap.y += GW;
                    pts[i - 1] = ap;
                }
            }
        }

        return pts;
    }

    function render(s, t = 0) {
        const cs = cellSize;
        const W  = GRID_SIZE * cs;   // CSS-pixel canvas extent
        const H  = GRID_SIZE * cs;

        // Background
        ctx.fillStyle = pal.BG;
        ctx.fillRect(0, 0, W, H);

        // Grid lines
        ctx.strokeStyle = pal.GRID;
        ctx.lineWidth = 0.5;
        for (let i = 1; i < GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * cs, 0);
            ctx.lineTo(i * cs, H);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * cs);
            ctx.lineTo(W, i * cs);
            ctx.stroke();
        }

        // Food (apple)
        drawFoodItem(s.food.x, s.food.y, pal.FOOD, null, cs);

        // Cherry (timed)
        if (s.cherry) {
            const msLeft = Math.max(0, s.cherry.expiresAt - Date.now());
            drawFoodItem(s.cherry.x, s.cherry.y, pal.CHERRY, msLeft, cs);
        }

        // Golden apple (timed)
        if (s.goldenApple) {
            const msLeft = Math.max(0, s.goldenApple.expiresAt - Date.now());
            drawFoodItem(s.goldenApple.x, s.goldenApple.y, pal.GOLDEN, msLeft, cs);
        }

        // ── Smooth snake tube ──────────────────────────────────────────
        {
            const tubeR = cs * 0.375;   // radius = ¾ cell ÷ 2
            const tubeD = tubeR * 2;    // stroke width = ¾ cell
            const GW    = GRID_SIZE * cs;
            const pts   = buildUnwrappedSpine(s, t, cs);

            // Bezier-smoothed tube: at each interior corner, replace the sharp
            // vertex with a quadratic arc from mid-prev→corner→mid-next.
            // This gives organic bend curves instead of hard kinks.
            const strokeSmooth = (points) => {
                if (points.length === 0) return;
                ctx.lineWidth = tubeD;
                ctx.lineJoin  = 'round';
                ctx.lineCap   = 'round';
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length - 1; i++) {
                    const pr = points[i - 1], cu = points[i], nx = points[i + 1];
                    const mx1 = (pr.x + cu.x) * 0.5, my1 = (pr.y + cu.y) * 0.5;
                    const mx2 = (cu.x + nx.x) * 0.5, my2 = (cu.y + nx.y) * 0.5;
                    ctx.lineTo(mx1, my1);
                    ctx.quadraticCurveTo(cu.x, cu.y, mx2, my2);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
            };

            // Draw main path + 4 axial ghost copies for wrap-around.
            // Canvas clip [0,0,GW,GW] ensures only the parts of each ghost
            // that re-enter the visible area are drawn — no stray circles.
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, GW, GW); ctx.clip();

            ctx.strokeStyle = pal.BODY;
            strokeSmooth(pts);
            strokeSmooth(pts.map(p => ({ x: p.x - GW, y: p.y })));
            strokeSmooth(pts.map(p => ({ x: p.x + GW, y: p.y })));
            strokeSmooth(pts.map(p => ({ x: p.x, y: p.y - GW })));
            strokeSmooth(pts.map(p => ({ x: p.x, y: p.y + GW })));

            // Head cap — overdraw in head colour; ghost caps for wrap edges
            const hx = pts[0].x, hy = pts[0].y;
            const drawHeadCap = (x, y) => {
                ctx.fillStyle = pal.HEAD;
                ctx.beginPath();
                ctx.arc(x, y, tubeR, 0, Math.PI * 2);
                ctx.fill();
            };
            drawHeadCap(hx, hy);
            if (hx < tubeR)       drawHeadCap(hx + GW, hy);
            if (hx > GW - tubeR)  drawHeadCap(hx - GW, hy);
            if (hy < tubeR)       drawHeadCap(hx, hy + GW);
            if (hy > GW - tubeR)  drawHeadCap(hx, hy - GW);

            ctx.restore();

            // Eyes — drawn after restore so they sit on top
            {
                const d       = s.direction;
                const eyeR    = tubeR * 0.26;
                const fwdOff  = tubeR * 0.5;
                const sideOff = tubeR * 0.5;
                const epx = d.dy, epy = -d.dx;
                const drawEyes = (x, y) => {
                    ctx.fillStyle = pal.EYE;
                    ctx.beginPath();
                    ctx.arc(x + d.dx * fwdOff + epx * sideOff,
                            y + d.dy * fwdOff + epy * sideOff, eyeR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + d.dx * fwdOff - epx * sideOff,
                            y + d.dy * fwdOff - epy * sideOff, eyeR, 0, Math.PI * 2);
                    ctx.fill();
                };
                drawEyes(hx, hy);
                if (hx < tubeR)       drawEyes(hx + GW, hy);
                if (hx > GW - tubeR)  drawEyes(hx - GW, hy);
                if (hy < tubeR)       drawEyes(hx, hy + GW);
                if (hy > GW - tubeR)  drawEyes(hx, hy - GW);
            }
        }

        // Idle overlay
        if (s.status === 'idle') {
            ctx.fillStyle = pal.OVERLAY;
            ctx.fillRect(0, 0, W, H);
            drawCenteredText('Snake', W / 2, H / 2 - cs * 1.6, Math.round(cs * 1.2), pal.HEAD, true);
            drawCenteredText('Press any arrow key or swipe to start', W / 2, H / 2, Math.round(cs * 0.46), pal.TEXT, false);
        }

        // Paused overlay
        if (s.status === 'paused') {
            ctx.fillStyle = pal.OVERLAY;
            ctx.fillRect(0, 0, W, H);
            drawCenteredText('PAUSED', W / 2, H / 2, Math.round(cs * 1.1), pal.TEXT, true);
            drawCenteredText('Press Space or tap to resume', W / 2, H / 2 + cs * 1.2, Math.round(cs * 0.46), pal.LABEL, false);
        }

        // Game-over overlay
        if (s.status === 'game-over') {
            ctx.fillStyle = pal.OVERLAY;
            ctx.fillRect(0, 0, W, H);
            drawCenteredText('Game Over', W / 2, H / 2 - cs * 1.4, Math.round(cs * 1.1), pal.DANGER, true);
            drawCenteredText(`Score: ${s.score}`, W / 2, H / 2 - cs * 0.1, Math.round(cs * 0.65), pal.TEXT, false);
            const best = loadBest();
            if (s.score > 0 && s.score === best) {
                drawCenteredText('New Best!', W / 2, H / 2 + cs * 0.75, Math.round(cs * 0.55), pal.GOLDEN, true);
            }
            drawCenteredText('Press any key or Restart to play again', W / 2, H / 2 + cs * 1.55, Math.round(cs * 0.44), pal.LABEL, false);
        }
    }

    function drawFoodItem(gx, gy, color, msLeft, cs) {
        const fx = gx * cs + cs / 2;
        const fy = gy * cs + cs / 2;
        const fr = cs * 0.38;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();
        // Countdown timer above the cell for timed items
        if (msLeft !== null) {
            const secs = Math.ceil(msLeft / 1000);
            const fontSize = Math.max(9, Math.round(cs * 0.38));
            ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillText(secs, fx - ctx.measureText(secs).width / 2 + 1, gy * cs + 1);
            ctx.fillStyle = color;
            ctx.fillText(secs, fx - ctx.measureText(secs).width / 2, gy * cs);
        }
    }

    function drawCenteredText(text, x, y, size, color, bold) {
        ctx.font = `${bold ? 'bold ' : ''}${size}px system-ui, sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillText(text, x - ctx.measureText(text).width / 2 + 1, y + 1);
        ctx.fillStyle = color;
        ctx.fillText(text, x - ctx.measureText(text).width / 2, y);
    }

    // ─────────────────────────────────────────────
    //  META BAR UPDATE
    // ─────────────────────────────────────────────
    const scoreDisplay  = document.getElementById('score-display');
    const bestDisplay   = document.getElementById('best-display');
    const lengthDisplay = document.getElementById('length-display');

    function updateMetaBar(s) {
        scoreDisplay.textContent  = s.score;
        lengthDisplay.textContent = s.snake.length;
        const best = loadBest();
        bestDisplay.textContent   = best > 0 ? best : '--';
    }

    // ─────────────────────────────────────────────
    //  GAME LOOP
    // ─────────────────────────────────────────────
    let state       = initState();
    let prevSnake   = null;   // segment positions before the last tick (for interpolation)
    let lastTs      = null;
    let lastT       = 0;      // most recent interpolation fraction, for one-off renders
    let accumulator = 0;
    let rafId       = null;

    function loop(ts) {
        if (lastTs === null) lastTs = ts;
        accumulator += ts - lastTs;
        lastTs = ts;

        const tickMs = getTickMs(state.snake.length);
        // Cap accumulator to prevent a burst of ticks after the tab was backgrounded
        if (accumulator > tickMs * 3) accumulator = tickMs * 3;
        while (accumulator >= tickMs) {
            prevSnake = state.snake;                   // snapshot before advancing
            const newState = tick(state);
            // Trigger sounds based on what happened this tick
            if (newState._ate === 'apple')  playSound('eat-apple');
            if (newState._ate === 'cherry') playSound('eat-cherry');
            if (newState._ate === 'golden') playSound('eat-golden');
            if (newState.status === 'game-over' && state.status !== 'game-over') {
                playSound('game-over');
            }
            state = newState;
            accumulator -= tickMs;
            if (state.status === 'game-over') break;  // don't tick a dead snake
        }

        // Fractional progress through the current tick — drives smooth interpolation
        const t = accumulator / tickMs;
        lastT = t;
        render(state, t);
        updateMetaBar(state);

        if (state.status === 'playing') {
            rafId = requestAnimationFrame(loop);
        } else if (state.status === 'game-over') {
            saveBest(state.score);
            updateMetaBar(state);  // refresh best display
        }
    }

    function startLoop() {
        prevSnake   = state.snake;  // ensure first tick can interpolate from idle positions
        lastTs      = null;
        accumulator = 0;
        rafId       = requestAnimationFrame(loop);
    }

    function stopLoop() {
        if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    function resetGame() {
        stopLoop();
        state     = initState();
        prevSnake = null;
        render(state, 0);
        updateMetaBar(state);
    }

    function togglePause() {
        if (state.status === 'playing') {
            state.status = 'paused';
            stopLoop();
            render(state, lastT);
            playSound('pause');
        } else if (state.status === 'paused') {
            state.status = 'playing';
            startLoop();
            playSound('pause');
        }
    }

    // ─────────────────────────────────────────────
    //  INPUT HANDLER
    // ─────────────────────────────────────────────
    const DIR_MAP = {
        ArrowUp:    { dx: 0,  dy: -1 },
        ArrowDown:  { dx: 0,  dy:  1 },
        ArrowLeft:  { dx: -1, dy:  0 },
        ArrowRight: { dx: 1,  dy:  0 },
        w: { dx: 0,  dy: -1 },
        s: { dx: 0,  dy:  1 },
        a: { dx: -1, dy:  0 },
        d: { dx: 1,  dy:  0 },
        W: { dx: 0,  dy: -1 },
        S: { dx: 0,  dy:  1 },
        A: { dx: -1, dy:  0 },
        D: { dx: 1,  dy:  0 },
    };

    document.addEventListener('keydown', (e) => {
        // Game-over: any key resets
        if (state.status === 'game-over') {
            resetGame();
            return;
        }

        // Space: toggle pause
        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            togglePause();
            return;
        }

        const newDir = DIR_MAP[e.key];
        if (!newDir) return;

        // Prevent page scroll
        e.preventDefault();

        // Queue the direction if not opposite to the last queued (or current) direction
        const lastQueued = state.nextDir.length > 0 ? state.nextDir[state.nextDir.length - 1] : state.direction;
        if (isOppositeDir(lastQueued, newDir)) return;
        if (state.nextDir.length < 2) state.nextDir.push(newDir);

        // Idle: first direction key starts the loop
        if (state.status === 'idle') {
            state.status = 'playing';
            startLoop();
        }
    });

    // ─────────────────────────────────────────────
    //  TOUCH CONTROLS
    // ─────────────────────────────────────────────
    let touchStartX = 0, touchStartY = 0;
    const MIN_SWIPE = 20;

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Tap: toggle pause
        if (dist < MIN_SWIPE) {
            if (state.status === 'game-over') { resetGame(); return; }
            togglePause();
            return;
        }

        // Swipe: determine direction
        let newDir;
        if (Math.abs(dx) >= Math.abs(dy)) {
            newDir = dx > 0 ? { dx: 1, dy: 0 } : { dx: -1, dy: 0 };
        } else {
            newDir = dy > 0 ? { dx: 0, dy: 1 } : { dx: 0, dy: -1 };
        }

        const lastQueued = state.nextDir.length > 0 ? state.nextDir[state.nextDir.length - 1] : state.direction;
        if (isOppositeDir(lastQueued, newDir)) return;
        if (state.nextDir.length < 2) state.nextDir.push(newDir);

        if (state.status === 'idle') {
            state.status = 'playing';
            startLoop();
        } else if (state.status === 'paused') {
            // swipe while paused: queue direction but don't resume automatically
        }
    }, { passive: false });

    // ─────────────────────────────────────────────
    //  BUTTON WIRING
    // ─────────────────────────────────────────────
    document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
        // Warm up AudioContext on first interaction (browser autoplay policy)
        getAudioCtx();
    });

    document.getElementById('theme-btn').addEventListener('click', () => {
        applyTheme(theme === 'light' ? 'dark' : 'light');
        render(state, lastT);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        resetGame();
    });

    document.getElementById('expand-btn').addEventListener('click', () => {
        document.body.classList.toggle('fullscreen');
        setTimeout(resizeCanvas, 50);
    });

    // ─────────────────────────────────────────────
    //  INIT
    // ─────────────────────────────────────────────
    window.addEventListener('resize', resizeCanvas);
    applyTheme(localStorage.getItem(LS_THEME_KEY) || 'light');
    // Small delay so header/footer fetch has time to affect layout
    setTimeout(resizeCanvas, 50);
    // Load best score into meta bar on init
    updateMetaBar(state);
    </script>
</body>
</html>

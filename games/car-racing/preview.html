<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle preview</title>
  <style>
    body { margin:0; background:#4b4f55; color:#eee; font-family:system-ui,sans-serif; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px; padding:10px; }
    figure { margin:0; text-align:center; }
    figcaption { font-size:11px; color:#cfd6dd; padding-top:4px; }
    canvas { display:block; background:#4b4f55; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script src="./vehicles.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const types = Object.keys(RacingVehicles.VEHICLES);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    for (const t of types) {
      const spec = RacingVehicles.VEHICLES[t];
      const fig = document.createElement('figure');
      const c = document.createElement('canvas');
      const cw = 150, ch = 230;
      c.style.width = cw + 'px'; c.style.height = ch + 'px';
      c.width = cw * dpr; c.height = ch * dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const s = Math.min(cw * 0.62 / spec.width, ch * 0.82 / spec.length);
      RacingVehicles.drawVehicle(ctx, t, cw / 2, ch / 2, s, { blink: 0.2 });
      const cap = document.createElement('figcaption');
      cap.textContent = t + '  ' + spec.width + '×' + spec.length;
      fig.appendChild(c); fig.appendChild(cap); grid.appendChild(fig);
    }
  </script>
</body>
</html>

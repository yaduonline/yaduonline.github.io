<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Car Racing</title>
  <meta name="description" content="Top-down racing: pick a track, pass the traffic, beat three opponents." />
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root {
      --ink: #eef2f6;
      --ink-dim: #9fb0bf;
      --panel: #1b2028;
      --panel-2: #232a34;
      --edge: #333d4a;
      --accent: #2aa79b;
      --accent-ink: #08282a;
    }

    /* Full screen is the default now rather than a button: the road wants the
       whole viewport, and the bar keeps a way back to the site. */
    #site-header, #site-footer { display: none !important; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    /* The shared stylesheet centres body in 800px with 20px padding. Both fight
       a full-viewport game, so they are reset here. */
    body {
      margin: 0;
      padding: 0;
      max-width: none;
      background: #10141a;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;   /* the result panel is laid over the road */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ---------------- HUD ---------------- */

    #hud {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--edge);
    }
    #hud[hidden] { display: none; }

    .readout { display: flex; flex-direction: column; line-height: 1.15; }
    .readout-label {
      font-size: 9px; letter-spacing: 0.11em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    .readout-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .readout-value .unit { font-size: 10px; font-weight: 500; color: var(--ink-dim); }

    #trackName {
      flex: 1;
      min-width: 0;
      text-align: right;
      font-size: 12px;
      color: var(--ink-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #progress {
      flex: none;
      height: 4px;
      background: var(--panel-2);
    }
    #progressFill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.12s linear;
    }

    /* ---------------- stage ---------------- */

    #stage {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #stage[hidden] { display: none; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(56px, 18vw, 128px);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }
    #countdown[hidden] { display: none; }

    /* ---------------- controls ---------------- */

    #controls {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      padding: 8px 10px 10px;
      background: var(--panel);
      border-top: 1px solid var(--edge);
    }
    #controls[hidden] { display: none; }

    #app button {
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      background: var(--panel-2);
      border: 1px solid var(--edge);
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #app button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #app button:active { transform: scale(0.97); }
    @media (hover: hover) and (pointer: fine) {
      #app button:hover { background: #2c3540; }
    }

    #controls button {
      height: 60px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btnAccel { background: #17564f; border-color: #1f7c71; }
    #btnBrake { background: #5a2a2a; border-color: #7c3a3a; }

    /* A keyboard is likely: hide the touch pad and explain the keys instead. */
    #hints { display: none; }
    /* Higher specificity than the `display: block` below, so hiding the hints
       from script works on a keyboard device too. */
    #hints[hidden] { display: none; }
    @media (hover: hover) and (pointer: fine) {
      #controls { display: none; }
      #hints {
        display: block;
        flex: none;
        padding: 7px 12px 10px;
        text-align: center;
        font-size: 11px;
        color: var(--ink-dim);
        background: var(--panel);
        border-top: 1px solid var(--edge);
      }
    }

    /* ---------------- menu and result ---------------- */

    .sheet {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sheet[hidden] { display: none; }

    .sheet h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.01em; }
    .sheet .lede { margin: 0; color: var(--ink-dim); font-size: 0.9rem; }

    .back {
      color: var(--ink-dim);
      text-decoration: none;
      font-size: 0.85rem;
    }

    #trackList { display: flex; flex-direction: column; gap: 10px; }
    .track {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
      text-align: left;
      padding: 13px 14px;
    }
    .track-name { font-size: 1.02rem; font-weight: 700; }
    .track-desc { font-size: 0.82rem; color: var(--ink-dim); font-weight: 500; }
    .track-best { font-size: 0.75rem; color: var(--accent); font-weight: 600; }

    /* The result is laid over the bottom of the road rather than taking a share
       of the column. Making it a flex sibling halves the stage the moment the
       player crosses the line, which pushes the finish itself off screen -
       exactly the thing you want to look at. */
    #result {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      flex: none;
      overflow: visible;
      gap: 10px;
      padding: 44px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(16, 20, 26, 0.97) 58%, rgba(16, 20, 26, 0));
      align-items: center;
      justify-content: flex-end;
      text-align: center;
    }
    #resultPlace { font-size: 3rem; font-weight: 800; margin: 0; color: var(--accent); }
    #resultDetail { margin: 0; color: var(--ink-dim); }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .result-actions button { padding: 11px 18px; font-size: 0.95rem; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div id="app">
    <div id="hud" hidden>
      <div class="readout">
        <span class="readout-label">Speed</span>
        <span class="readout-value"><span id="speed">0</span> <span class="unit">km/h</span></span>
      </div>
      <div class="readout">
        <span class="readout-label">Pos</span>
        <span class="readout-value" id="position">1/4</span>
      </div>
      <div class="readout">
        <span class="readout-label">Time</span>
        <span class="readout-value" id="time">--</span>
      </div>
      <div id="trackName"></div>
    </div>
    <div id="progress"><div id="progressFill"></div></div>

    <div id="stage" hidden>
      <canvas id="canvas"></canvas>
      <div id="countdown" hidden>3</div>
    </div>

    <section class="sheet" id="menu">
      <a class="back" href="/games/">← Games</a>
      <h1>Car Racing</h1>
      <p class="lede">Four lanes, three rivals and traffic that will not move for you.
        Pick a track — the bends matter, so lift off before you reach them.</p>
      <div id="trackList"></div>
    </section>

    <section class="sheet" id="result" hidden>
      <p id="resultPlace">P1</p>
      <p id="resultDetail"></p>
      <div class="result-actions">
        <button id="btnAgain" type="button">Race again</button>
        <button id="btnMenu" type="button">Change track</button>
      </div>
    </section>

    <p id="hints">Arrows or WASD — left/right change lane, up accelerates, down brakes</p>

    <div id="controls" hidden>
      <button id="btnLeft" type="button" aria-label="Move left">←</button>
      <button id="btnRight" type="button" aria-label="Move right">→</button>
      <button id="btnBrake" type="button" aria-label="Brake">BRAKE</button>
      <button id="btnAccel" type="button" aria-label="Accelerate">GO</button>
    </div>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  </div>

  <div id="site-footer"></div>

  <script src="/inc/include.js"></script>
  <script src="./engine.js?v=7"></script>
  <script src="./vehicles.js?v=7"></script>
  <script src="./tracks.js?v=7"></script>
  <script src="./game.js?v=7"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing - Step 1</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --road-color: #555; /* Lightened for better contrast */
            --grass-color: #3a5a3a;
            --grass-light: #4c6e4c;
            --grass-dark: #2a3f2a;
            --dirt-color: #5d4037;
            --lane-line: #fff;
            --car-main: #34495e; /* Distinct Sober Blue */
            --car-window: #1a1a1a;
            --sunroof: #111;
            --tail-light-off: #4a0000;
            --tail-light-on: #ff1a1a;
        }

        body {
            margin: 0;
            background: #f0f0f0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #game-view {
            position: relative;
            width: 100%;
            flex: 1;
            background: #87ceeb; /* Sky */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Terrain with more natural varying texture */
        #terrain {
            position: absolute;
            inset: 0;
            background: var(--grass-color);
            background-image: 
                radial-gradient(circle at 10% 20%, var(--grass-light) 1px, transparent 20%),
                radial-gradient(circle at 80% 40%, var(--grass-dark) 2px, transparent 15%),
                radial-gradient(circle at 40% 70%, var(--dirt-color) 1px, transparent 10%),
                linear-gradient(45deg, transparent 45%, rgba(0,0,0,0.05) 50%, transparent 55%);
            background-size: 150px 150px;
        }

        #road-container {
            position: relative;
            width: 320px;
            height: 100%;
            background: var(--road-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            display: flex;
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 2px dashed rgba(255,255,255,0.2);
        }
        .lane:last-child { border-right: none; }

        /* Moving markers */
        #markers-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(to bottom, 
                var(--lane-line) 0%, var(--lane-line) 30%, 
                transparent 30%, transparent 100%);
            background-size: 4px 80px;
            background-repeat: repeat-y;
            background-position: center;
            opacity: 0.5;
        }

        /* Sophisticated Car - Tapered Shape */
        #player-car {
            position: absolute;
            width: 56px;
            height: 100px;
            bottom: 180px; /* Moved up more */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            transition: left 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            perspective: 500px;
        }

        .car-body {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--car-main);
            /* Tapered shape - notably narrower at bottom (rear) */
            clip-path: polygon(15% 0, 85% 0, 100% 40%, 80% 100%, 20% 100%, 0 40%);
            border-radius: 15px 15px 12px 12px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            transform: rotateX(15deg);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.3) 0%, transparent 15%, 
                transparent 85%, rgba(0,0,0,0.3) 100%),
                var(--car-main);
        }

        /* Sunroof and Windows */
        .car-body::before {
            content: '';
            position: absolute;
            top: 15px; left: 8px; right: 8px; height: 50px;
            background: var(--car-window);
            border-radius: 8px 8px 4px 4px;
        }

        /* The Sunroof itself */
        .car-body::after {
            content: '';
            position: absolute;
            top: 25px; left: 16px; right: 16px; height: 18px;
            background: var(--sunroof);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.05);
            /* Tapered shape for sunroof */
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
        }

        .headlights {
            position: absolute;
            top: 2px; width: 100%;
            display: flex; justify-content: space-around;
        }
        .headlights::before, .headlights::after {
            content: ''; width: 14px; height: 5px;
            background: #fff9c4; border-radius: 4px;
            box-shadow: 0 -2px 12px #fff;
        }

        .tail-lights {
            position: absolute;
            bottom: 5px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .tail-lights::before, .tail-lights::after {
            content: ''; width: 16px; height: 5px;
            background: var(--tail-light-off);
            border-radius: 2px;
            transition: background 0.1s, box-shadow 0.1s;
        }
        #player-car.braking .tail-lights::before, 
        #player-car.braking .tail-lights::after {
            background: var(--tail-light-on);
            box-shadow: 0 2px 10px var(--tail-light-on);
        }

        .spoiler {
            position: absolute;
            bottom: 0px; left: 5px; right: 5px; height: 6px;
            background: rgba(0,0,0,0.3); border-radius: 2px;
        }

        

        /* Scenery Styles */
        .scenery {
            position: absolute;
            z-index: 5;
            pointer-events: none;
        }

        .tree {
            border-radius: 50%;
            background: #1b5e20;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3);
        }

        /* Varying tree details */
        .tree.flowering::after {
            content: ''; position: absolute; inset: 20%;
            background-image: radial-gradient(circle, #ff80ab 2px, transparent 3px);
            background-size: 10px 10px;
        }
        .tree.fruiting::after {
            content: ''; position: absolute; inset: 15%;
            background-image: radial-gradient(circle, #d32f2f 3px, transparent 4px);
            background-size: 15px 15px;
        }

        .rock {
            background: #757575;
            border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%;
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.4);
        }

        /* UI */
        #hud {
            position: absolute;
            top: 80px; left: 20px;
            background: #ffffff; /* White background */
            color: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* More classy font */
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <div id="game-view">
        <div id="terrain"></div>
        <div id="hud">
            <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 5px;">Speed</div>
            <div id="speed-meter" style="font-family: monospace; font-size: 1.5em;">0 km/h</div>
        </div>

        <div id="road-container">
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
            <div id="markers-layer"></div>
            
                        <div id="player-car">
                <div class="car-body">
                    <div class="headlights"></div>
                    <div class="tail-lights"></div>
                    <div class="spoiler"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="/inc/include.js"></script>
    <script>
        const car = document.getElementById('player-car');
        const markers = document.getElementById('markers-layer');
        const terrain = document.getElementById('terrain');
        const speedMeter = document.getElementById('speed-meter');
        const lanes = document.querySelectorAll('.lane');

        let currentLane = 1; // 0-3
        let speed = 0;
        let targetSpeed = 0;
        let offset = 0;
        let terrainOffset = 0;

        const maxSpeed = 160;
        const acceleration = 0.6; /* Lowered from 1.2 for more realistic buildup */
        const friction = 0.4;

        // Positioning
        function updateCarPos() {
            const laneRect = lanes[currentLane].getBoundingClientRect();
            const roadRect = document.getElementById('road-container').getBoundingClientRect();
            const relativeLeft = laneRect.left - roadRect.left + (laneRect.width / 2);
            car.style.left = `${relativeLeft}px`;
        }

        // Inputs
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'ArrowLeft') moveLane(-1);
            if (e.code === 'ArrowRight') moveLane(1);
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function moveLane(dir) {
            currentLane = Math.max(0, Math.min(3, currentLane + dir));
            updateCarPos();
        }

        // Touch
        let startX, startY;
        window.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            targetSpeed = maxSpeed;
        });
        window.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 40) moveLane(dx > 0 ? 1 : -1);
            targetSpeed = 0;
        });

        // Loop
        function loop() {
            // Speed logic
            if (keys['ArrowUp']) targetSpeed = maxSpeed;
            else if (keys['ArrowDown']) targetSpeed = 0;
            else if (!('ontouchstart' in window)) targetSpeed = Math.max(0, targetSpeed - friction);

            if (speed < targetSpeed) {
                speed = Math.min(targetSpeed, speed + acceleration);
                car.classList.remove('braking'); // Turn off tail lights when accelerating
            } else if (speed > targetSpeed) {
                speed = Math.max(targetSpeed, speed - friction * 2);
                car.classList.add('braking'); // Turn on tail lights when decelerating
            } else {
                car.classList.remove('braking'); // Turn off when at constant speed
            }

            // Animation
            if (speed > 0) {
                offset = (offset + speed / 8) % 80;
                terrainOffset = (terrainOffset + speed / 15) % 100;
                markers.style.transform = `translateY(${offset}px)`;
                terrain.style.backgroundPosition = `0 ${terrainOffset}px`;
            }

            speedMeter.innerText = `${Math.round(speed)} km/h`;
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', updateCarPos);
        updateCarPos();
        loop();
    </script>
</body>
</html>

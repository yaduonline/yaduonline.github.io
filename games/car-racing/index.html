<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Racing - Yadnyesh Joshi Games</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f6f9;
            color: #1d1f21;
        }
        main {
            max-width: 680px;
            margin: 12px auto;
            padding: 10px;
        }
        .topbar {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .status-card {
            background: #fff;
            border: 1px solid #dbdfe6;
            border-radius: 8px;
            padding: 8px 10px;
        }
        .status-card strong { display: block; font-size: 0.9rem; margin-bottom: 2px; }
        .state-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .state-row > * {
            flex: 1 1 120px;
            min-width: 120px;
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .controls select, .controls button {
            font-size: 0.95rem;
            border: 1px solid #9ca4b4;
            background: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        #track {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            min-height: 460px;
            background: linear-gradient(#607d8b 0%, #455a64 100%);
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;
        }
        .lane-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: rgba(255,255,255,0.45);
            z-index: 1;
        }
        .car {
            position: absolute;
            width: calc(18% - 10px);
            min-width: 48px;
            height: 72px;
            border-radius: 14px;
            border: 1px solid #222;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 2;
            transition: left 0.16s ease, top 0.16s ease, transform 0.15s ease;
        }
        .user-car { box-shadow: 0 0 18px rgba(25, 118, 210,0.8); border-width: 2px; }
        .opponent-car { border-style: dashed; transform: perspective(50px) rotateX(4deg); border-color: #fff; }
        .traffic-car { opacity: 0.92; filter: brightness(0.85); }
        .message {
            margin-top: 8px;
            min-height: 24px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .hint { font-size: 0.86rem; color: #565a66; margin-top: 4px; }
        .finish-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, #fff, transparent);
            top: 10%;
            z-index: 1;
        }
        @media (max-width: 600px) {
            main { margin: 6px; }
            .car { height: 54px; font-size: 0.82rem; }
            .controls select, .controls button { font-size: 0.9rem; padding: 8px; }
        }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <div class="topbar">
            <div class="status-card"><strong>Route</strong><span id="routeLabel">City</span></div>
            <div class="status-card"><strong>Difficulty</strong><span id="difficultyLabel">Beginner</span></div>
            <div class="status-card"><strong>Speed</strong><span id="speedLabel">0</span></div>
            <div class="status-card"><strong>Lane</strong><span id="laneLabel">1</span></div>
            <div class="status-card"><strong>Progress</strong><span id="progressLabel">0%</span></div>
            <div class="status-card"><strong>Remaining</strong><span id="remainingLabel">100%</span></div>
            <div class="status-card"><strong>Position</strong><span id="positionLabel">4/4</span></div>
        </div>

        <div class="controls">
            <select id="route"> <option value="city">City</option> <option value="highway">Highway</option> <option value="mountain">Mountain</option> </select>
            <select id="difficulty"> <option value="beginner">Beginner</option> <option value="intermediate">Intermediate</option> <option value="advanced">Advanced</option> <option value="expert">Expert</option> <option value="master">Master</option> </select>
            <select id="startLane"><option value="0">Lane 1</option><option value="1">Lane 2</option><option value="2">Lane 3</option><option value="3">Lane 4</option></select>
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div id="track" aria-label="Racing track"></div>
        <div id="finishLine" class="finish-line" aria-label="Finish line"></div>
        <div class="message" id="message">Use left/right/up/down keys or touch controls. Up to accelerate, down to decelerate.</div>
        <div class="hint">On touch, swipe left/right to change lanes, swipe down to slow; tap/hold anywhere to accelerate.</div>
    </main>
    <div id="site-footer"></div>

    <script src="/inc/include.js"></script>
    <script>
        const track = document.getElementById('track');
        const routeSelect = document.getElementById('route');
        const difficultySelect = document.getElementById('difficulty');
        const startLaneSelect = document.getElementById('startLane');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const routeLabel = document.getElementById('routeLabel');
        const difficultyLabel = document.getElementById('difficultyLabel');
        const speedLabel = document.getElementById('speedLabel');
        const laneLabel = document.getElementById('laneLabel');
        const message = document.getElementById('message');

        const lanes = 4;
        const carHeight = 44;
        let state = {
            route: 'city',
            difficulty: 'beginner',
            userLane: 0,
            speed: 0,
            stopped: false,
            accelerating: false,
            decelerating: false,
            running: false,
            finished: false,
            trackProgress: 0,
            score: 0,
            opponents: [],
            traffic: [],
            lastTimestamp: null,
            touchStart: null,
            touchMoved: false,
            spawnedSince: 0,
        };

        const routeConfig = {
            city: { color: '#37474f', density: 1.0 },
            highway: { color: '#263238', density: 1.2 },
            mountain: { color: '#1b2832', density: 0.85 }
        };

        const diffConfig = {
            beginner: { maxSpeed: 1.2, spawnRate: 0.5, aiFactor: 0.45 },
            intermediate: { maxSpeed: 2.6, spawnRate: 0.95, aiFactor: 0.78 },
            advanced: { maxSpeed: 3.4, spawnRate: 1.4, aiFactor: 0.98 },
            expert: { maxSpeed: 4.2, spawnRate: 1.9, aiFactor: 1.2 },
            master: { maxSpeed: 5.2, spawnRate: 2.4, aiFactor: 1.5 }
        };

        function laneX(lane) {
            const width = track.clientWidth;
            return (lane * width / lanes) + 6;
        }

        function yToPixels(y) {
            return (y * (track.clientHeight - carHeight));
        }

        function createCar({id, lane, y, color, symbol, type, speed = 1}) {
            const element = document.createElement('div');
            let className = 'car ';
            if (type === 'user') className += 'user-car';
            else if (type === 'opponent') className += 'opponent-car';
            else className += 'traffic-car';
            element.className = className;
            element.style.background = color;
            element.textContent = symbol || '';
            element.dataset.id = id;
            track.appendChild(element);
            return { id, lane, y, color, symbol, type, speed, element };
        }

        function setMessage(txt, autoClear = true) {
            message.textContent = txt;
            if (autoClear) setTimeout(() => { if (message.textContent === txt) message.textContent = 'Use left/right/up/down keys or touch controls. Up to accelerate, down to decelerate.'; }, 2200);
        }

        function updateOverlay() {
            routeLabel.textContent = state.route.charAt(0).toUpperCase() + state.route.slice(1);
            difficultyLabel.textContent = state.difficulty.charAt(0).toUpperCase() + state.difficulty.slice(1);
            speedLabel.textContent = state.speed.toFixed(1);
            laneLabel.textContent = (state.userLane + 1);
            const progress = Math.round(state.trackProgress * 100);
            document.getElementById('progressLabel').textContent = progress + '%';
            document.getElementById('remainingLabel').textContent = Math.max(0, 100 - progress) + '%';
            const ahead = state.opponents.filter(o => o.progress > state.trackProgress).length;
            const position = Math.min(4, 1 + ahead);
            document.getElementById('positionLabel').textContent = position + '/4';
        }

        function clearTrack() {
            [...track.querySelectorAll('.car')].forEach(c => c.remove());
            track.querySelectorAll('.lane-divider').forEach(d => d.remove());
        }

        function drawLaneDividers() {
            for (let i = 1; i < lanes; i++) {
                const div = document.createElement('div');
                div.className = 'lane-divider';
                div.style.left = `calc(${(i * 100 / lanes)}% - 1.5px)`;
                track.appendChild(div);
            }
        }

        function resetGame() {
            state.opponents = [];
            state.traffic = [];
            state.speed = 0;
            state.stopped = false;
            state.accelerating = false;
            state.decelerating = false;
            state.finished = false;
            state.trackProgress = 0;
            state.score = 0;
            state.spawnedSince = 0;
            startLaneSelect.value = state.userLane;
            routeSelect.value = state.route;
            difficultySelect.value = state.difficulty;
            routeLabel.textContent = state.route;
            difficultyLabel.textContent = state.difficulty;
            clearTrack();
            drawLaneDividers();
            track.style.background = `linear-gradient(${routeConfig[state.route].color} 0%, #455a64 100%)`;

            const userCar = createCar({ id: 'user', lane: state.userLane, y: 0.88, color: '#1976d2', symbol: '★', type: 'user', speed: 1 });
            userCar.progress = 0;
            state.userCar = userCar;

            const colors = ['#d32f2f', '#388e3c', '#f57c00'];
            const symbols = ['A', 'B', 'C'];
            for (let i = 0; i < 3; i++) {
                const lane = (i + 1) % lanes;
                const progress = 0.2 + Math.random() * 0.3;
                const y = 0.88 - progress * 0.7;
                const opp = createCar({ id: 'opp' + i, lane, y, color: colors[i], symbol: symbols[i], type: 'opponent', speed: 1.0 });
                opp.progress = progress;
                state.opponents.push(opp);
            }

            updateOverlay();
            renderAll();
        }

        function startGame() {
            state.route = routeSelect.value;
            state.difficulty = difficultySelect.value;
            state.userLane = parseInt(startLaneSelect.value, 10);
            state.stopped = false;
            state.running = true;
            state.lastTimestamp = null;
            resetGame();
            setMessage('Game started! Avoid collisions and survive longer.');
            requestAnimationFrame(gameLoop);
        }

        function setCarPosition(car) {
            const left = laneX(car.lane);
            car.element.style.left = left + 'px';
            car.element.style.top = (yToPixels(car.y)) + 'px';
        }

        function renderAll() {
            if (!state.userCar) return;
            setCarPosition(state.userCar);
            [...state.opponents, ...state.traffic].forEach(c => setCarPosition(c));
            updateOverlay();
        }

        function spawnTraffic(delta) {
            const cfg = diffConfig[state.difficulty];
            state.spawnedSince += delta * 60;
            const target = cfg.spawnRate;
            if (Math.random() < 0.015 * svg()) {
            }
            if (Math.random() < target * delta * routeConfig[state.route].density / 50) {
                const lane = Math.floor(Math.random() * lanes);
                const y = -0.15;
                const colors = ['#607d8b', '#546e7a', '#90a4ae', '#78909c'];
                state.traffic.push(createCar({ id: 't' + Date.now() + Math.random(), lane, y, color: colors[Math.floor(Math.random() * colors.length)], symbol: '', type: 'traffic', speed: 1 }));
            }
        }

        function svg() {
            return 1; // placeholder for future route/score random factors
        }

        function updateAI(delta, groundMotion) {
            const cfg = diffConfig[state.difficulty];
            state.opponents.forEach((car, index) => {
                if (!car.active) car.active = true;
                const free = Math.random() < Math.min(0.65, 0.2 + cfg.aiFactor * 0.05);
                if (free) {
                    const desiredLane = Math.floor((state.userLane + 1 + (index % 2 === 0 ? -1 : 1) * Math.ceil(Math.random() * 2) + lanes) % lanes);
                    car.lane = desiredLane;
                }
                const outrun = (0.65 + cfg.aiFactor * 0.25);
                car.progress = Math.min(1, (car.progress || 0) + outrun * delta * 0.12);
                car.y = 0.88 - car.progress * 0.75;
                if (car.progress >= 1) car.progress = 1;
            });
            if (state.userCar) state.userCar.progress = state.trackProgress;
        }

        function checkCollision() {
            if (state.finished || state.stopped) return;
            const u = state.userCar;
            const collisionBetween = [...state.opponents, ...state.traffic].some(car => {
                if (car.lane !== u.lane) return false;
                const dy = Math.abs(car.y - u.y);
                return dy < 0.07;
            });
            if (collisionBetween) {
                state.stopped = true;
                state.speed = 0;
                state.accelerating = false;
                state.decelerating = false;
                setMessage('Collision! Press up or tap to resume.', false);
            }
        }

        function cleanVanishedCars() {
            state.traffic = state.traffic.filter(c => c.y < 1.25);
        }

        function gameLoop(timestamp) {
            if (!state.running) return;
            if (!state.lastTimestamp) state.lastTimestamp = timestamp;
            const delta = Math.min(0.035, (timestamp - state.lastTimestamp) / 1000);
            state.lastTimestamp = timestamp;

            if (!state.stopped && !state.finished) {
                if (state.accelerating) state.speed = Math.min(diffConfig[state.difficulty].maxSpeed, state.speed + 3.1 * delta);
                if (state.decelerating) state.speed = Math.max(0, state.speed - 3.8 * delta);
                if (!state.accelerating && !state.decelerating) {
                    state.speed = Math.max(0, state.speed - 0.45 * delta);
                }

                const pace = (state.speed / diffConfig[state.difficulty].maxSpeed) * 1.2;
                state.trackProgress = Math.min(1, state.trackProgress + pace * delta / 38);

                if (state.trackProgress >= 1) {
                    state.finished = true;
                    state.running = false;
                    state.speed = 0;
                    setMessage('Finish line reached in about 45 seconds! Great job!', false);
                }
            }

            const groundMotion = state.speed * 0.15 + 0.35;

            state.traffic.forEach(car => {
                car.y += groundMotion * delta;
            });

            updateAI(delta, groundMotion);

            if (!state.stopped && !state.finished) {
                spawnTraffic(delta);
            }

            updateAI(delta);
            cleanVanishedCars();
            checkCollision();
            renderAll();

            if (state.running) requestAnimationFrame(gameLoop);
        }

        function onLaneChange(direction) {
            if (direction === 'left') state.userLane = Math.max(0, state.userLane - 1);
            if (direction === 'right') state.userLane = Math.min(lanes - 1, state.userLane + 1);
            if (state.userCar) state.userCar.lane = state.userLane;
            updateOverlay();
        }

        function resumeAfterStop() {
            if (state.stopped) {
                state.stopped = false;
                state.accelerating = true;
                setMessage('Resumed. Keep steering to avoid cars!', true);
            }
        }

        document.addEventListener('keydown', e => {
            if (!state.running) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                onLaneChange('left');
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                onLaneChange('right');
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                resumeAfterStop();
                state.accelerating = true;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.decelerating = true;
            }
        });

        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp') state.accelerating = false;
            if (e.key === 'ArrowDown') state.decelerating = false;
        });

        track.addEventListener('touchstart', e => {
            if (!state.running) return;
            if (e.touches.length !== 1) return;
            e.preventDefault();
            state.touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: performance.now() };
            state.touchMoved = false;
            resumeAfterStop();
            state.accelerating = true;
        }, { passive: false });

        track.addEventListener('touchmove', e => {
            if (!state.touchStart || e.touches.length !== 1) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - state.touchStart.x;
            const dy = e.touches[0].clientY - state.touchStart.y;
            if (Math.abs(dx) > 18 || Math.abs(dy) > 18) {
                state.touchMoved = true;
            }
        }, { passive: false });

        track.addEventListener('touchend', e => {
            if (!state.touchStart) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - state.touchStart.x;
            const dy = touch.clientY - state.touchStart.y;
            state.accelerating = false;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            const minSwipe = 30;

            if (absDx > minSwipe || absDy > minSwipe) {
                if (absDx > absDy) {
                    if (dx > 0) onLaneChange('right'); else onLaneChange('left');
                } else {
                    if (dy > 0) { state.decelerating = true; setTimeout(() => state.decelerating = false, 200); }
                    else { state.accelerating = true; setTimeout(() => state.accelerating = false, 200); }
                }
            } else {
                resumeAfterStop();
                state.accelerating = true;
                setTimeout(() => { state.accelerating = false; }, 220);
            }
            state.touchStart = null;
        }, { passive: false });

        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', () => {
            state.running = false;
            resetGame();
            setMessage('Game reset. Click Start to play.');
        });

        window.addEventListener('resize', renderAll);

        // initialize view
        drawLaneDividers();
        resetGame();
    </script>
</body>
</html>

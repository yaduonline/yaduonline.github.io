<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- No user-scalable=no: the page stays pinch-zoomable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tetris</title>
  <meta name="description" content="Tetris: fit the falling pieces together and clear rows." />
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --ink: #1f242b;
      --muted: #6b7480;
      --edge: #d8dce2;
      --btn: #eceff3;
      --btn-edge: #ccd2da;
      --accent: #3f5b56;
    }

    /* The board wants every vertical pixel: a phone was giving roughly a third
       of the screen to the site nav. The bar below keeps a way back. */
    #site-header, #site-footer { display: none !important; }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    /* The shared stylesheet centres body in 800px with 20px padding, which
       both pushes this full-height layout off the bottom of the screen and
       caps the board's width on a wide display. Neither is wanted here. */
    body {
      margin: 0;
      padding: 0;
      max-width: none;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      gap: 6px;
    }

    /* ---------- top bar: everything that is not the board ---------- */

    #bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 10px;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    /* overflow:hidden so a squeezed bar clips rather than letting labels
       overlap each other, which is what the old build did. */
    .stat { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; overflow: hidden; }
    .stat-label {
      font-size: 9px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

    #next {
      flex: none;
      display: block;
      background: var(--panel);
    }

    #app button {
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      background: var(--btn);
      border: 1px solid var(--btn-edge);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    #app button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) and (pointer: fine) {
      #app button:hover { background: #e0e5ea; }
    }
    #app button:active { transform: scale(0.96); }

    .bar-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    /* ---------- board: takes whatever is left ---------- */

    #boardArea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #board {
      display: block;
      border-radius: 4px;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      background: rgba(244, 245, 247, 0.92);
      border-radius: 8px;
    }
    #overlay[hidden] { display: none; }
    #overlayTitle { margin: 0; font-size: 1.4rem; }
    #overlayDetail { margin: 0; color: var(--muted); font-size: 0.9rem; }

    /* ---------- controls ---------- */

    #controls {
      flex: none;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    #controls button {
      height: 56px;
      font-size: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btnDrop { font-size: 13px; letter-spacing: 0.04em; }

    /* Base state first, then the override - same specificity, so whichever
       comes last wins regardless of the media query. */
    #hints {
      display: none;
      flex: none;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    /* A keyboard is likely: show the hints and drop the touch pad. */
    @media (hover: hover) and (pointer: fine) {
      #controls { display: none; }
      #hints { display: block; }
    }

    /* A narrow phone cannot fit four stats, a preview and two worded buttons
       on one row. Drop to the two that matter while playing. */
    @media (max-width: 379px) {
      #bar { gap: 7px; padding: 5px 6px; }
      .stats { gap: 8px; }
      .stat.secondary { display: none; }
      #app #bar button { padding: 7px 8px; font-size: 12px; }
    }

    /* ---------- short and wide: turn the stack on its side ----------
       A 10x20 board is height-limited, so in landscape the vertical stack
       wastes the entire width - measured at 14.8% of screen with 662px of
       nothing beside the board. Laying the bands out as a row instead gives
       the board the full height. */
    @media (orientation: landscape) and (max-height: 620px) {
      #app {
        flex-direction: row;
        align-items: stretch;
        gap: 8px;
      }

      #bar {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 8px;
        width: 108px;
        flex: none;
        overflow-y: auto;
      }
      #bar .stats {
        flex-direction: column;
        gap: 6px;
        flex: none;
        width: 100%;
      }
      #bar button { width: 100%; }

      #controls {
        grid-template-columns: repeat(2, 1fr);
        align-content: center;
        width: 132px;
        flex: none;
      }
      #controls button { height: 46px; }
      /* Hard drop is the one you reach for most: give it the full width. */
      #btnDrop { grid-column: 1 / -1; }

      /* Keep the keyboard hints in landscape - there is width to spare - but
         as a narrow column rather than a full-width band. On a touch device
         the base rule still hides them. */
      #hints {
        width: 120px;
        flex: none;
        align-self: center;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div id="app">
    <div id="bar">
      <a class="bar-link" href="/games/" title="Back to games" aria-label="Back to games">
        <span aria-hidden="true">←</span>
      </a>
      <div class="stats">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="level">1</span></div>
        <div class="stat secondary"><span class="stat-label">Lines</span><span class="stat-value" id="lines">0</span></div>
        <div class="stat secondary"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      </div>
      <canvas id="next" width="40" height="40" aria-label="Next piece"></canvas>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="restartBtn" type="button">New</button>
    </div>

    <div id="boardArea">
      <canvas id="board" width="300" height="600" role="img" aria-label="Tetris board"></canvas>
      <div id="overlay" hidden>
        <h2 id="overlayTitle">Tetris</h2>
        <p id="overlayDetail"></p>
        <button id="overlayBtn" type="button">Start</button>
      </div>
    </div>

    <p id="hints">
      Arrows move · Up or X rotates · Z rotates back · Space drops · P pauses
    </p>

    <div id="controls">
      <button id="btnLeft" type="button" aria-label="Move left">←</button>
      <button id="btnRight" type="button" aria-label="Move right">→</button>
      <button id="btnDown" type="button" aria-label="Soft drop">↓</button>
      <button id="btnRotate" type="button" aria-label="Rotate">↻</button>
      <button id="btnDrop" type="button" aria-label="Hard drop">DROP</button>
    </div>

    <p id="live" role="status" aria-live="polite"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;"></p>
  </div>

  <div id="site-footer"></div>

  <script src="/inc/include.js"></script>
  <script src="./engine.js?v=1"></script>
  <script src="./game.js?v=1"></script>
</body>
</html>

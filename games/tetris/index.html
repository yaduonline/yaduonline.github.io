<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris - Dusk Slate</title>
    <style>
        :root {
            --bg-color: #1c2030;
            --grid-line: #232840;
            --text-color: #c8d0e0;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #game-view {
            position: relative;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(28, 32, 48, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        #meta-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .stat-group {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.6;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        #tetris-canvas {
            border: 2px solid var(--grid-line);
            background-color: rgba(0, 0, 0, 0.2);
        }

        #sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 120px;
        }

        #next-canvas {
            border: 1px solid var(--grid-line);
            background: rgba(0, 0, 0, 0.1);
        }

        .controls-hint {
            margin-top: auto;
            font-size: 0.75rem;
            opacity: 0.5;
            line-height: 1.6;
        }

        button {
            background: #232840;
            color: var(--text-color);
            border: 1px solid rgba(200, 208, 224, 0.1);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #2d3350;
            border-color: rgba(200, 208, 224, 0.3);
        }

        #touch-controls {
            display: none;
            width: 100%;
            max-width: 440px;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding: 0 10px;
        }

        #sound-btn {
            min-width: 44px;
        }

        .touch-btn {
            height: 60px;
            font-size: 1.2rem;
            user-select: none;
            touch-action: manipulation;
            background: rgba(35, 40, 64, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .touch-btn:active {
            background: #4a5585;
        }

        @media (max-width: 600px) {
            #game-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            #touch-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div id="meta-bar">
        <div class="stat-group"><div class="stat-label">Score</div><div id="score" class="stat-value">0</div></div>
        <div class="stat-group"><div class="stat-label">Level</div><div id="level" class="stat-value">1</div></div>
        <div class="stat-group"><div class="stat-label">Best</div><div id="high-score" class="stat-value">0</div></div>
        <button id="sound-btn">🔇</button>
        <button id="restart-btn">Restart</button>
    </div>

    <div id="game-container">
        <div id="game-view">
            <canvas id="tetris-canvas"></canvas>
            <div id="overlay">
                <h2 id="overlay-text">PAUSED</h2>
                <button id="overlay-btn">Resume</button>
            </div>
        </div>
        <div id="sidebar">
            <div class="stat-group">
                <div class="stat-label">Next</div>
                <canvas id="next-canvas" width="100" height="100"></canvas>
            </div>
            <div class="controls-hint">
                <b>ARROWS</b>: Move<br>
                <b>UP / X</b>: Rotate<br>
                <b>SPACE</b>: Drop<br>
                <b>P</b>: Pause
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <button class="touch-btn" id="btn-left">←</button>
        <button class="touch-btn" id="btn-rotate">↻</button>
        <button class="touch-btn" id="btn-right">→</button>
        <button class="touch-btn" id="btn-down">↓</button>
        <button class="touch-btn" style="grid-column: span 2;" id="btn-drop">DROP</button>
    </div>

    <script>
        const CONFIG = {
            GRID_WIDTH: 10,
            GRID_HEIGHT: 20,
            BUFFER_ROWS: 2,
            BLOCK_SIZE: 30,
            COLORS: {
                'I': '#6ec6a2', 'J': '#6aabbb', 'L': '#e0856a',
                'O': '#d4a855', 'S': '#9ad4bf', 'Z': '#7a8fa8',
                'T': '#c47088', 'GRID': '#232840'
            }
        };

        const PIECES = {
            'I': [[0, 1, 0], [0, 1, 0], [0, 1, 0]],
            'J': [[0, 1, 0], [0, 1, 0], [1, 1, 1]],
            'L': [[1, 0, 0], [1, 0, 0], [1, 1, 1]],
            'O': [[1, 1], [1, 1]],
            'S': [[0, 1, 1], [1, 1, 0], [0, 0, 0]],
            'Z': [[1, 1, 0], [0, 1, 1], [0, 0, 0]],
            'T': [[0, 1, 0], [1, 1, 1], [0, 1, 0]]
        };

        let state = {
            grid: Array(CONFIG.GRID_HEIGHT + CONFIG.BUFFER_ROWS).fill().map(() => Array(CONFIG.GRID_WIDTH).fill(0)),
            activePiece: null,
            nextPiece: null,
            score: 0,
            level: 1,
            linesCleared: 0,
            status: 'idle',
            dropCounter: 0,
            lastTime: 0,
            soundEnabled: false,
            highScore: 0,
            clearingLines: [],
            clearingTimer: 0
        };

        let audioCtx = null;

        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlay-text');
        const overlayBtn = document.getElementById('overlay-btn');

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        // Audio Synthesis
        function playSound(type) {
            if (!state.soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'clear') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'tetris') {
                [440, 554, 659, 880].forEach(f => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(f, now);
                    g.gain.setValueAtTime(0.05, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now);
                    o.stop(now + 0.5);
                });
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(40, now + 1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1);
                osc.start(now);
                osc.stop(now + 1);
            }
        }

        function init() {
            canvas.width = CONFIG.GRID_WIDTH * CONFIG.BLOCK_SIZE;
            canvas.height = CONFIG.GRID_HEIGHT * CONFIG.BLOCK_SIZE;
            
            state.highScore = parseInt(localStorage.getItem('tetris-high-score')) || 0;
            document.getElementById('high-score').textContent = state.highScore;

            document.getElementById('sound-btn').onclick = function() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                state.soundEnabled = !state.soundEnabled;
                this.textContent = state.soundEnabled ? '🔊' : '🔇';
            };

            document.addEventListener('keydown', event => {
                if (state.status !== 'playing') return;
                if (event.key === 'ArrowLeft') move(-1, 0);
                if (event.key === 'ArrowRight') move(1, 0);
                if (event.key === 'ArrowDown') {
                    if (!move(0, 1)) lockPiece();
                }
                if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'x') rotate();
                if (event.key === ' ') hardDrop();
                if (event.key.toLowerCase() === 'p' || event.key === 'Escape') {
                    togglePause();
                }
            });

            // Touch Gesture Handling
            canvas.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = performance.now();
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                if (state.status !== 'playing') return;
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                const dt = performance.now() - touchStartTime;

                if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 200) {
                    rotate(); // Tap to rotate
                } else if (dy > 50 && Math.abs(dy) > Math.abs(dx)) {
                    hardDrop(); // Swipe down to hard drop
                } else if (Math.abs(dx) > 30) {
                    if (dx > 0) move(1, 0); else move(-1, 0);
                }
                e.preventDefault();
            }, { passive: false });

            // Button Controls
            document.getElementById('btn-left').onclick = () => { if(state.status === 'playing') move(-1, 0); };
            document.getElementById('btn-right').onclick = () => { if(state.status === 'playing') move(1, 0); };
            document.getElementById('btn-rotate').onclick = () => { if(state.status === 'playing') rotate(); };
            document.getElementById('btn-down').onclick = () => { 
                if(state.status === 'playing') {
                    if (!move(0, 1)) lockPiece();
                }
            };
            document.getElementById('btn-drop').onclick = () => { if(state.status === 'playing') hardDrop(); };

            overlayBtn.onclick = () => {
                if (state.status === 'game-over') {
                    document.getElementById('restart-btn').click();
                } else {
                    togglePause();
                }
            };

            document.getElementById('restart-btn').onclick = () => {
                overlay.style.display = 'none';
                state.status = 'playing';
                state.score = 0;
                state.level = 1;
                state.linesCleared = 0;
                state.clearingLines = [];
                state.clearingTimer = 0;
                state.grid = Array(CONFIG.GRID_HEIGHT + CONFIG.BUFFER_ROWS).fill().map(() => Array(CONFIG.GRID_WIDTH).fill(0));
                state.nextPiece = null;
                spawnPiece();
                state.lastTime = performance.now();
                document.getElementById('score').textContent = '0';
                document.getElementById('level').textContent = '1';
            };

            requestAnimationFrame(update);
        }

        function togglePause() {
            if (state.status === 'game-over') return;
            playSound('move');
            state.status = state.status === 'playing' ? 'paused' : 'playing';
            overlay.style.display = state.status === 'paused' ? 'flex' : 'none';
            overlayText.textContent = 'PAUSED';
            overlayBtn.textContent = 'Resume';
        }

        function checkCollision(matrix, pos) {
            for (let y = 0; y < matrix.length; y++) {
                for (let x = 0; x < matrix[y].length; x++) {
                    if (matrix[y][x] !== 0) {
                        const newX = pos.x + x;
                        const newY = pos.y + y;
                        if (newX < 0 || newX >= CONFIG.GRID_WIDTH || newY >= CONFIG.GRID_HEIGHT + CONFIG.BUFFER_ROWS) {
                            return true;
                        }
                        if (state.grid[newY] && state.grid[newY][newX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function rotate() {
            const matrix = state.activePiece.matrix;
            const newMatrix = matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
            const pos = state.activePiece.pos;
            
            // Simplified SRS kicks: try original, then left, then right, then up, then far left/right
            const kicks = [
                {x: 0, y: 0},
                {x: -1, y: 0},
                {x: 1, y: 0},
                {x: 0, y: -1},
                {x: -2, y: 0},
                {x: 2, y: 0}
            ];

            for (const kick of kicks) {
                const nextPos = { x: pos.x + kick.x, y: pos.y + kick.y };
                if (!checkCollision(newMatrix, nextPos)) {
                    state.activePiece.matrix = newMatrix;
                    state.activePiece.pos = nextPos;
                    playSound('move');
                    state.dropCounter = 0; // Lock delay
                    return;
                }
            }
        }

        function hardDrop() {
            while (move(0, 1));
            lockPiece();
        }

        function lockPiece() {
            state.activePiece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const gridY = state.activePiece.pos.y + y;
                        const gridX = state.activePiece.pos.x + x;
                        if (state.grid[gridY]) state.grid[gridY][gridX] = CONFIG.COLORS[state.activePiece.type];
                    }
                });
            });

            const fullRows = [];
            for (let y = 0; y < state.grid.length; y++) {
                if (state.grid[y].every(cell => cell !== 0)) {
                    fullRows.push(y);
                }
            }

            if (fullRows.length > 0) {
                state.status = 'clearing';
                state.clearingLines = fullRows;
                state.clearingTimer = 250;
            } else {
                spawnPiece();
            }
        }

        function updateScore(linesCount) {
            const points = [0, 100, 300, 500, 800];
            state.score += points[linesCount] * state.level;
            state.linesCleared += linesCount;
            state.level = Math.floor(state.linesCleared / 10) + 1;
            
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('tetris-high-score', state.highScore);
                document.getElementById('high-score').textContent = state.highScore;
            }

            document.getElementById('score').textContent = state.score;
            document.getElementById('level').textContent = state.level;
            playSound(linesCount === 4 ? 'tetris' : 'clear');
        }

        function getRandomPiece() {
            const types = Object.keys(PIECES);
            const type = types[Math.floor(Math.random() * types.length)];
            return { type, matrix: PIECES[type] };
        }

        function spawnPiece() {
            if (!state.nextPiece) state.nextPiece = getRandomPiece();
            state.activePiece = { ...state.nextPiece };
            state.nextPiece = getRandomPiece();
            state.activePiece.pos = { x: Math.floor(CONFIG.GRID_WIDTH / 2) - 1, y: 0 };
            renderNext(); // Only redraw when piece changes

            if (checkCollision(state.activePiece.matrix, state.activePiece.pos)) {
                state.status = 'game-over';
                playSound('gameover');
                overlay.style.display = 'flex';
                overlayText.textContent = 'GAME OVER\nScore: ' + state.score;
                overlayBtn.textContent = 'Play Again';
            }
        }

        function move(dx, dy) {
            const newPos = { x: state.activePiece.pos.x + dx, y: state.activePiece.pos.y + dy };
            if (!checkCollision(state.activePiece.matrix, newPos)) {
                state.activePiece.pos = newPos;
                if (dx !== 0) playSound('move');
                state.dropCounter = 0; // Lock delay
                return true;
            }
            return false;
        }

        function update(time = 0) {
            const deltaTime = time - state.lastTime;
            state.lastTime = time;

            if (state.status === 'playing') {
                state.dropCounter += deltaTime;

                const dropInterval = Math.max(100, 1000 - (state.level - 1) * 100);
                if (state.dropCounter > dropInterval) {
                    if (!move(0, 1)) lockPiece();
                    state.dropCounter = 0;
                }
            } else if (state.status === 'clearing') {
                state.clearingTimer -= deltaTime;
                if (state.clearingTimer <= 0) {
                    const linesCount = state.clearingLines.length;
                    state.clearingLines.sort((a, b) => b - a).forEach(y => {
                        state.grid.splice(y, 1);
                        state.grid.unshift(Array(CONFIG.GRID_WIDTH).fill(0));
                    });
                    updateScore(linesCount);
                    state.clearingLines = [];
                    state.status = 'playing';
                    spawnPiece();
                }
            }
            render();
            requestAnimationFrame(update);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid (locked blocks)
            state.grid.forEach((row, y) => {
                const isClearing = state.status === 'clearing' && state.clearingLines.includes(y);
                row.forEach((value, x) => {
                    if (value || isClearing) {
                        drawBlock(x, y - CONFIG.BUFFER_ROWS, isClearing ? '#fff' : value);
                    }
                });
            });

            if (state.status !== 'idle' && state.activePiece && state.status !== 'clearing') {
                // Draw ghost piece
                const ghostY = getGhostPosition();
                state.activePiece.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawGhostBlock(state.activePiece.pos.x + x, ghostY + y - CONFIG.BUFFER_ROWS);
                        }
                    });
                });

                // Draw active piece
                state.activePiece.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(state.activePiece.pos.x + x, state.activePiece.pos.y + y - CONFIG.BUFFER_ROWS, CONFIG.COLORS[state.activePiece.type]);
                        }
                    });
                });
            }

        }

        function renderNext() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!state.nextPiece) return;

            const size = 20;
            const matrix = state.nextPiece.matrix;
            const offsetX = (nextCanvas.width - matrix[0].length * size) / 2;
            const offsetY = (nextCanvas.height - matrix.length * size) / 2;

            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        nextCtx.fillStyle = CONFIG.COLORS[state.nextPiece.type];
                        nextCtx.fillRect(offsetX + x * size, offsetY + y * size, size - 1, size - 1);
                    }
                });
            });
        }

        function getGhostPosition() {
            let ghostY = state.activePiece.pos.y;
            while (!checkCollision(state.activePiece.matrix, { x: state.activePiece.pos.x, y: ghostY + 1 })) {
                ghostY++;
            }
            return ghostY;
        }

        function drawGhostBlock(x, y) {
            if (y < 0) return;
            ctx.strokeStyle = 'rgba(200, 208, 224, 0.2)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * CONFIG.BLOCK_SIZE + 2, y * CONFIG.BLOCK_SIZE + 2, CONFIG.BLOCK_SIZE - 5, CONFIG.BLOCK_SIZE - 5);
        }

        function drawBlock(x, y, color) {
            if (y < 0) return;
            ctx.fillStyle = color;
            ctx.fillRect(x * CONFIG.BLOCK_SIZE, y * CONFIG.BLOCK_SIZE, CONFIG.BLOCK_SIZE - 1, CONFIG.BLOCK_SIZE - 1);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris tests</title>
  <link rel="stylesheet" href="/style.css?v=2" />
  <script>/* Apply the saved theme before first paint, so a dark-theme visitor never gets a flash of white. "system" stores nothing and lets the CSS media query decide. */(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <style>
    #results { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    #summary { font-weight: 700; margin: 10px 0; font-size: 15px; }
    .ok { color: #2f6b48; }
    .bad { color: #a33b28; }
    .row { padding: 2px 0; }
    .detail { color: #777; }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <h2>Tetris tests</h2>
    <p class="note">
      The same suite the Node runner uses (<code>node test/run.js</code>), against
      the same <code>engine.js</code> the game runs.
    </p>
    <div id="summary">Running…</div>
    <div id="results"></div>
  </main>
  <div id="site-footer"></div>

  <script src="/inc/include.js?v=2"></script>
  <script src="./engine.js?v=2"></script>
  <script src="./test/suite.js?v=2"></script>
  <script>
    (function () {
      var outcome = TetrisTests.run({ Engine: TetrisEngine });
      var summary = document.getElementById('summary');
      summary.textContent = outcome.passed + ' passed, ' + outcome.failed + ' failed';
      summary.className = outcome.failed ? 'bad' : 'ok';
      document.getElementById('results').innerHTML = outcome.results.map(function (r) {
        return '<div class="row ' + (r.ok ? 'ok' : 'bad') + '">' +
          (r.ok ? '✓' : '✗') + ' ' + r.label +
          (r.detail ? ' <span class="detail">— ' + r.detail + '</span>' : '') +
          '</div>';
      }).join('');
    })();
  </script>
</body>
</html>
